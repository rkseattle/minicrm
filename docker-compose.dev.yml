# Development overrides for docker-compose.yml.
# Mounts local source into containers and overrides NODE_ENV.
#
# Usage (normal dev):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   npm run dev:client     # Vite dev server on :5173 — this is the dev UI, with HMR
#
# Automated testing does NOT run here. E2E, unit, coverage and TIA all target the
# isolated stack in docker-compose.test.yml (MINCRM-684):
#   docker compose -f docker-compose.test.yml up -d
#   npm run e2e:setup
# server-e2e, MinIO and Mailhog moved there; they shared this stack's `db` and were the
# path by which a test run truncated the dev database.
# (MINCRM-317, MINCRM-330, MINCRM-684)

services:
  server:
    environment:
      NODE_ENV: development
    # tsx watch is used instead of nodemon because tsx is in production
    # dependencies; nodemon is a devDependency and is not present in the
    # image (built with --omit=dev).
    command: npx tsx watch server/src/server.ts
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      # Anonymous volume keeps the container's node_modules intact when the
      # host source tree is mounted on top of /app.
      - /app/node_modules

  # Only applies under `--profile web`, since the base service is profiled (MINCRM-684).
  # NODE_ENV is set for parity with the other services; the bind mounts are deliberately
  # NOT carried over from the previous version of this block — the image serves a
  # production build baked in at build time (client/Dockerfile), so mounting host source
  # over /app/client changed nothing and implied a hot-reload path that never existed.
  client:
    environment:
      NODE_ENV: development

  # MINCRM-399: Dex OIDC provider for local SSO testing.
  # Enable with (both files — this overlay's services are override fragments):
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile sso up -d
  # Discovery URL: http://localhost:5556/dex/.well-known/openid-configuration
  # Test credentials: admin@example.com / password  (or rep@example.com / password)
  dex:
    profiles:
      - sso
    image: ghcr.io/dexidp/dex:v2.41.1
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: dex serve /etc/dex/config.yaml
