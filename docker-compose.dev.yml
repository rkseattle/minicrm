# Development overrides for docker-compose.yml.
# Mounts local source into containers and overrides NODE_ENV.
#
# Usage (normal dev) — one command, and the UI hot-reloads on :5173:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# `npm run dev:client` still runs the same dev server on the host, against the API on
# :3001, for when a native watcher is wanted instead of the container's polling.
#
# Automated testing does NOT run here. E2E, unit, coverage and TIA all target the
# isolated stack in docker-compose.test.yml (MINCRM-684):
#   docker compose -f docker-compose.test.yml up -d
#   npm run e2e:setup
# server-e2e, MinIO and Mailhog moved there; they shared this stack's `db` and were the
# path by which a test run truncated the dev database.
# (MINCRM-317, MINCRM-330, MINCRM-684)

services:
  server:
    environment:
      NODE_ENV: development
    # tsx watch is used instead of nodemon because tsx is in production
    # dependencies; nodemon is a devDependency and is not present in the
    # image (built with --omit=dev).
    command: npx tsx watch server/src/server.ts
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      # Anonymous volume keeps the container's node_modules intact when the
      # host source tree is mounted on top of /app.
      - /app/node_modules

  # The dev client is the Vite dev server, not the nginx image the base file defines.
  #
  # The base `client` is a production artifact: client/Dockerfile builds the bundle and
  # serves it from nginx, so nothing in that container can hot-reload and mounting source
  # over it does nothing. Dev stops at the `builder` stage instead, which already has the
  # workspace installed, and runs Vite against the mounted tree.
  #
  # Verifying the built bundle belongs to the test stack's client on :8080
  # (docker-compose.test.yml), which exists for exactly that.
  client:
    build:
      target: builder
    # Run through the workspace so Vite's root is client/, where index.html lives, and
    # the API proxy target comes from the same script the host-run dev server uses.
    working_dir: /app
    command: npm run dev --workspace=minicrm-client -- --host 0.0.0.0
    environment:
      NODE_ENV: development
      # Reached over the compose network, so it is the service name rather than localhost.
      API_URL: http://server:3001
      VITE_USE_POLLING: 'true'
    # !reset discards the base service's 80:80 rather than appending to it — sequences
    # merge by appending, and the dev container has nothing listening on 80.
    ports: !override
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      # Anonymous volumes keep the image's installed dependencies from being shadowed by
      # the host mount — node_modules is absent from the host tree for these workspaces.
      - /app/node_modules
      - /app/client/node_modules

  # MINCRM-399: Dex OIDC provider for local SSO testing.
  # Enable with (both files — this overlay's services are override fragments):
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile sso up -d
  # Discovery URL: http://localhost:5556/dex/.well-known/openid-configuration
  # Test credentials: admin@example.com / password  (or rep@example.com / password)
  dex:
    profiles:
      - sso
    image: ghcr.io/dexidp/dex:v2.41.1
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: dex serve /etc/dex/config.yaml
