# Development overrides for docker-compose.yml.
# Mounts local source into containers for hot-reload and overrides NODE_ENV.
#
# Usage (normal dev):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Usage (E2E testing — starts MinIO + Mailhog in addition to the dev stack):
#   docker compose -f docker-compose.dev.yml --profile e2e up -d
#   npm run e2e:setup
# (MINCRM-317)

services:
  server:
    environment:
      NODE_ENV: development
    # tsx watch is used instead of nodemon because tsx is in production
    # dependencies; nodemon is a devDependency and is not present in the
    # image (built with --omit=dev).
    command: npx tsx watch server/src/server.ts
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      # Anonymous volume keeps the container's node_modules intact when the
      # host source tree is mounted on top of /app.
      - /app/node_modules

  client:
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/client/node_modules

  # MINCRM-317: Optional E2E infrastructure — disabled by default.
  # Enable with: docker compose -f docker-compose.dev.yml --profile e2e up -d
  # Then run: npm run e2e:setup

  # MinIO — S3-compatible object storage for attachment E2E tests.
  # Port 9000: S3 API (used by the app server)
  # Port 9001: web console (useful for debugging uploaded files)
  # Image and healthcheck match ci.yml exactly so local and CI behaviour are identical.
  minio:
    profiles:
      - e2e
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailhog — SMTP capture server for email delivery E2E tests.
  # Port 1025: SMTP (the app server sends email here)
  # Port 8025: HTTP API (E2E tests query this to assert on delivered messages)
  # Activated by MINCRM-306; stub is present now so the profile is complete.
  mailhog:
    profiles:
      - e2e
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
