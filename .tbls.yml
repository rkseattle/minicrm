# tbls configuration — ERD and schema documentation (MINCRM-529)
# https://github.com/k1LoW/tbls
#
# Run: npm run db:erd --workspace=minicrm-server
#
# Freshness is manual: tbls output is non-deterministic across postgres versions, so
# no CI job diffs it. docs/schema/ goes stale silently unless regenerated with the
# migration that changes the schema.

# sslmode=disable is injected via the PGSSLMODE env var in the db:erd npm script —
# do not append query params here since DATABASE_URL may already contain them.
dsn: ${DATABASE_URL}

docPath: docs/schema

format:
  # Adjust column sort so id/created_at/updated_at always appear last
  sort: false

er:
  format: mermaid
  comment: true
  skip: false

# Exclude internal partitions and migration tracking tables from the ERD —
# they add visual noise without conveying schema decisions.
#
# audit_log partitions are created monthly by auditPartitionService (3 months ahead).
# This list is pre-populated through 2027m12 to avoid needing updates for ~18 months.
# When regenerating the baseline (~every 50 migrations), extend this list to cover
# the next 18 months from that date.
exclude:
  - audit_log_default
  - audit_log_y2026m06
  - audit_log_y2026m07
  - audit_log_y2026m08
  - audit_log_y2026m09
  - audit_log_y2026m10
  - audit_log_y2026m11
  - audit_log_y2026m12
  - audit_log_y2027m01
  - audit_log_y2027m02
  - audit_log_y2027m03
  - audit_log_y2027m04
  - audit_log_y2027m05
  - audit_log_y2027m06
  - audit_log_y2027m07
  - audit_log_y2027m08
  - audit_log_y2027m09
  - audit_log_y2027m10
  - audit_log_y2027m11
  - audit_log_y2027m12
  - pgmigrations
