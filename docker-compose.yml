x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: minicrm-db
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    # Raised from Postgres's default of 100: each parallel vitest worker gets
    # its own connection pool (server/src/db.ts + coverageDb.ts, up to
    # DB_POOL_MAX/COVERAGE_DB_POOL_MAX each, default 10), and the server test
    # suite's CPU-parallel worker count can multiply that past 100 total
    # connections under full-suite load — observed as sporadic, hard-to-
    # reproduce transaction failures in individual test files that pass
    # cleanly in isolation. 200 gives real headroom above what today's
    # worker count × pool size actually needs.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    container_name: minicrm-server
    logging: *default-logging
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      E2E: ${E2E:-false}
      COVERAGE_DASHBOARD_NO_AUTH: ${COVERAGE_DASHBOARD_NO_AUTH:-false}
      # Off by default (zero-overhead — see coverageConfig.ts's own
      # resolveCoverageConfig). Previously only the E2E server set these
      # (docker-compose.dev.yml), so the coverage-dashboard app's Sessions
      # tab and any backend coverage collection never worked against this
      # ordinary dev server at all, E2E or not — set both to 'true' in
      # .env to use the dashboard against regular local dev (MINCRM-636/637).
      COVERAGE_INSTRUMENTATION: ${COVERAGE_INSTRUMENTATION:-false}
      COVERAGE_SESSION_MANAGEMENT: ${COVERAGE_SESSION_MANAGEMENT:-false}
      # Same boot-time gating for the query/ingestion routers (MINCRM-685) — these
      # replaced the coverage_mapping_query/coverage_reporting_query/
      # coverage_pipeline_ingestion feature_flags rows that migration 163 deleted.
      # Unset means those routes are never registered and 404. The
      # coverage-dashboard app needs MAPPING and REPORTING set to 'true' in .env
      # to show anything against this dev server, plus COVERAGE_SESSION_MANAGEMENT
      # above for its Sessions tab.
      COVERAGE_MAPPING_QUERY: ${COVERAGE_MAPPING_QUERY:-false}
      COVERAGE_REPORTING_QUERY: ${COVERAGE_REPORTING_QUERY:-false}
      COVERAGE_PIPELINE_INGESTION: ${COVERAGE_PIPELINE_INGESTION:-false}
      NODE_ENCRYPTION_KEY: ${NODE_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_NAME: ${APP_NAME:-MiniCRM}
      SSO_CALLBACK_BASE_URL: ${SSO_CALLBACK_BASE_URL:-http://localhost}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-common}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MINCRM-684: Behind the `web` profile so it does not start with a plain local
  # `docker compose up`. This image serves a production build baked in at build time
  # (client/Dockerfile) — it has no /@vite/client and cannot hot-reload, so a developer
  # who opens http://localhost sees stale assets and concludes HMR is broken. Local dev
  # uses the Vite dev server on :5173 instead (`npm run dev:client`).
  #
  # Deployments must pass the profile explicitly:
  #   docker compose --profile backup up -d
  # See docs/operations.md — this file is the production deployment artifact, so the
  # service is profiled rather than removed.
  client:
    container_name: minicrm-client
    logging: *default-logging
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # MINCRM-286: Optional automated backup service — disabled by default.
  # Enable with: docker compose --profile backup up -d
  # Configure BACKUP_SCHEDULE and BACKUP_RETENTION_DAYS in your .env file.
  db-backup:
    container_name: minicrm-db-backup
    logging: *default-logging
    image: prodrigestivus/pg-backup-local:latest
    restart: unless-stopped
    profiles:
      - backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_EXTRA_OPTS: --format=custom
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_KEEP_WEEKS: "0"
      BACKUP_KEEP_MONTHS: "0"
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  db_backups:
