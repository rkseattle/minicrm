self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels: []

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
# Empty array means no configuration variable is allowed.
config-variables: null

# Configuration for file paths. The keys are glob patterns to match to file
# paths relative to the repository root. The values are the configurations for
# the file paths. Note that the path separator is always '/'.
paths:
  .github/workflows/*.yml:
    ignore:
      # actionlint's services: schema doesn't model `command:`, but GitHub
      # Actions does support it — verified against a real run's `docker create`
      # invocation (job 87939274359, e2e-serial): the generated command ends
      # with `minio/minio:latest server /data --console-address :9001`,
      # exactly the configured value, and the container reports healthy.
      # Required here: MinIO's image CMD is bare `minio` with no arguments,
      # which just prints usage and exits — the `server` subcommand is what
      # actually starts the service.
      - 'unexpected key "command" for "services" section'
      # Deliberately disabled job (ci.yml's Phase 4 - Update Visual Snapshots) —
      # the comment directly above its `if: false` documents the exact
      # condition to restore when re-enabling it. Not dead code.
      - 'constant expression "false" in condition'
