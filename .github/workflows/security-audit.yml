name: Security Audit

# Runs daily at 08:00 UTC on main to catch newly-disclosed CVEs in dependencies
# that haven't been touched recently. The CI security-audit job only runs when
# package*.json changes, so this schedule closes the gap.
on:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

jobs:
  security-audit:
    name: Daily Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high
