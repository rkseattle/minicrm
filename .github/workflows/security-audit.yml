name: Security Audit

# Runs daily at 08:00 UTC on main to catch newly-disclosed CVEs in dependencies
# that haven't been touched recently.
#
# MINCRM-703: the CI security-audit job is now unconditional, so this no longer
# closes a "only runs when package*.json changes" gap — that gap is gone. It still
# earns its place: advisories are published against a lockfile that is not moving,
# so main can go from clean to vulnerable with no commit at all. This surfaces that
# on a schedule instead of on whichever PR happens to open next.
on:
  schedule:
    - cron: '0 8 * * *'

# Workflow-level default. The notify job below raises its own scope; the audit job must
# never hold a write token, because `npm ci` executes arbitrary lifecycle scripts from the
# whole dependency tree. (MINCRM-704)
permissions:
  contents: read

jobs:
  security-audit:
    name: Daily Dependency Audit
    runs-on: ubuntu-latest
    # Stated on the job, not merely inherited from the workflow default. This job runs
    # `npm ci`, which executes arbitrary lifecycle scripts from the entire dependency
    # tree; the read-only token is the boundary that keeps a malicious postinstall from
    # writing to the repo. Declaring it here keeps the invariant next to the thing it
    # protects, rather than in a file-level default a future editor may not read.
    # (MINCRM-704)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      # The repo's single audit definition, shared with ci.yml's blocking gate. Extracted
      # rather than duplicated: these two had already drifted once, which is how the
      # fail-open hole survived here after MINCRM-703 closed it there. (MINCRM-704)
      - uses: ./.github/actions/npm-audit

  notify-on-failure:
    name: Report audit failure
    needs: [security-audit]
    if: failure()
    runs-on: ubuntu-latest
    # Deliberately a separate job. The audit job runs `npm ci`, which executes arbitrary
    # lifecycle scripts from the entire dependency tree; handing that job a write-scoped
    # token would put it one malicious postinstall away from writing to the repo. This job
    # holds the write scope and never checks out code or installs anything. (MINCRM-704)
    permissions:
      issues: write
    steps:
      - name: Open or update the audit-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'security-audit';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            // The run log distinguishes the two causes; this job cannot, because it has no
            // access to the audit job's output. Say so rather than guessing a diagnosis.
            const body = [
              'The scheduled dependency audit failed on `main`.',
              '',
              `Run: ${runUrl}`,
              '',
              'Check the run log — two causes produce this, and they need opposite responses:',
              '',
              '- **High/critical advisories found.** The log lists each GHSA id. Pin the',
              '  patched version in the root `package.json` `overrides`, re-resolve with',
              '  `rm -rf node_modules package-lock.json && npm install`, and commit the',
              '  regenerated lockfile. An incremental install will not reconsider overrides',
              '  for transitive deps (MINCRM-703).',
              '- **No usable audit report** — registry outage, proxy error, or npm crash.',
              '  Not a vulnerability; re-run once the registry recovers.',
              '',
              'Opened automatically: this job runs on a schedule, so a red run is otherwise',
              'unread (MINCRM-704).',
            ].join('\n');

            // listForRepo returns pull requests as well as issues, and its default ordering
            // is not guaranteed — hence the explicit sort and the pull_request filter below,
            // which together make [0] the newest genuine issue rather than an arbitrary row.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            // Same author filter close-on-success uses. Without it, a human-opened issue
            // carrying this label absorbs every failure comment, the bot never opens its
            // own, and close-on-success then finds nothing of its own to close — leaving
            // the label permanently pointing at a thread nothing here manages.
            const existing = open.filter(
              (item) =>
                item.pull_request === undefined && item.user?.login === 'github-actions[bot]',
            );

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Daily dependency audit failed',
              body,
              labels: [LABEL],
            });

  close-on-success:
    name: Close the audit-failure issue
    needs: [security-audit]
    if: success()
    runs-on: ubuntu-latest
    # Without this the failure issue stays open forever: once opened, every later failure
    # comments on the same stale thread, so a genuine new advisory arrives as a one-line
    # URL appended to a resolved outage's history. Closing on recovery means an open
    # `security-audit` issue always describes the CURRENT state. (MINCRM-704)
    permissions:
      issues: write
    steps:
      - name: Close any open audit-failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'security-audit';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            // Only close issues this workflow opened. The label is a shared, human-writable
            // namespace: closing a person's tracking issue and commenting "the audit is
            // green again" would read as a resolution of THEIR issue, which it is not.
            const ours = open.filter(
              (i) => i.pull_request === undefined && i.user?.login === 'github-actions[bot]',
            );

            for (const item of ours) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: `The daily dependency audit is green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                state: 'closed',
              });
            }
