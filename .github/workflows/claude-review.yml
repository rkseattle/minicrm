name: Claude Code PR Review

# MINCRM-178: Replaces Greptile with Claude Code as the automated PR reviewer.
# Claude reads CLAUDE.md natively, making it aware of MiniCRM-specific architecture
# rules, i18n requirements, data-testid conventions, and security patterns.

on:
  workflow_dispatch: # disabled — re-enable by restoring pull_request trigger when credits are available

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The action always runs: curl -fsSL https://claude.ai/install.sh | bash -s 1.0.88
      # That endpoint occasionally returns 429 with no retry logic in the action.
      # Workaround: pre-install the CLI with retries, then shadow `curl` with a
      # wrapper that intercepts the exact install URL and exits 0 (no-op), so the
      # action's install step succeeds without hitting the endpoint again.
      - name: Install Claude Code CLI (with retries) and shield install URL
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL https://claude.ai/install.sh | bash -s 1.0.88 && break
            echo "Attempt $i failed — waiting ${i}0s before retry"
            sleep $((i * 10))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Shadow curl so the action's re-install attempt is a no-op
          mkdir -p "$HOME/.local/bin-shim"
          cat > "$HOME/.local/bin-shim/curl" <<'SHIM'
          #!/usr/bin/env bash
          for arg in "$@"; do
            if [[ "$arg" == *"claude.ai/install.sh"* ]]; then
              echo "#!/usr/bin/env bash" >&1
              echo "# install already done — shim no-op" >&1
              exit 0
            fi
          done
          exec /usr/bin/curl "$@"
          SHIM
          chmod +x "$HOME/.local/bin-shim/curl"
          echo "$HOME/.local/bin-shim" >> "$GITHUB_PATH"

      - name: Run Claude Code PR review (MINCRM-178)
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: experimental-review
          custom_instructions: |
            You are a strict bug-finder reviewing a MiniCRM pull request.

            OUTPUT RULE — ABSOLUTE: Every comment you post must describe a concrete defect
            that requires a code change to fix. If no such defects exist, output nothing at all.

            NEVER post any of the following — these are forbidden outputs:
            - Praise or compliments ("excellent", "good practice", "well done", "looks good")
            - ✅ checkmarks or positive affirmations of any kind
            - Summaries of what the PR does
            - Observations about correct code ("this correctly implements X")
            - Suggestions, recommendations, or "consider" comments — only hard violations
            - Comments on style, naming, or speculative future concerns

            A comment is only valid if it meets ALL of these conditions:
            1. The code as written will cause a real bug, security hole, or rule violation
            2. Leaving it unchanged would be wrong
            3. You can cite the exact CLAUDE.md rule it violates

            ARCHITECTURE NOTE — read before flagging security issues:
            In MiniCRM, ownership is enforced in the **controller** layer, not the service layer.
            Controllers receive `req.user` and check ownership before calling the service.
            A service function that does NOT include ownership in its WHERE clause is correct
            by design — do NOT flag it as a security violation.

            When you find a genuine violation, post an inline comment on the offending line.
            Every comment MUST begin with its priority label on its own line:
            `**[P1 — Security]**`, `**[P2 — Bug]**`, or `**[P3 — Rule violation]**`

            Then provide:
            - One sentence naming the exact rule violated
            - The correct pattern or a concrete fix

            Check only for these violations:

            **P1 — Security**
            - Hardcoded credentials or secrets
            - Authenticated route missing the `authenticate` middleware
            - Admin-only route missing `requireRole('admin')`
            - Controller calling service for PATCH/DELETE without first checking `owner_id === req.user.id || req.user.role === 'admin'`
            - `owner_id` read from request body instead of `req.user.id`

            **P2 — Bugs / broken behavior**
            - `pool.query()` calls directly in a controller or route (not in a service)
            - Async route handler not wrapped in `try/catch` or `asyncHandler`
            - Error response not using shape `{ error: { code: string, message: string } }`
            - Missing Zod validation on API request body before the service call
            - ORDER BY column interpolated into SQL without allowlist validation

            **P3 — Rule violations**
            - New interactable UI element missing `data-testid`
            - User-facing string hardcoded in JSX instead of `t('key')`
            - Physical Tailwind directional class (`pl-`, `pr-`, `ml-`, `mr-`, `left-`, `right-`,
              `text-left`, `text-right`) instead of logical utility (`ps-`, `pe-`, `ms-`, `me-`,
              `start-`, `end-`, `text-start`, `text-end`)
            - New service function missing JSDoc
