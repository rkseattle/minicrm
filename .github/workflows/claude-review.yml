name: Claude Code PR Review

# MINCRM-178: Replaces Greptile with Claude Code as the automated PR reviewer.
# Claude reads CLAUDE.md natively, making it aware of MiniCRM-specific architecture
# rules, i18n requirements, data-testid conventions, and security patterns.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The action always runs: curl -fsSL https://claude.ai/install.sh | bash -s 1.0.88
      # That endpoint occasionally returns 429 with no retry logic in the action.
      # Workaround: pre-install the CLI with retries, then shadow `curl` with a
      # wrapper that intercepts the exact install URL and exits 0 (no-op), so the
      # action's install step succeeds without hitting the endpoint again.
      - name: Install Claude Code CLI (with retries) and shield install URL
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL https://claude.ai/install.sh | bash -s 1.0.88 && break
            echo "Attempt $i failed — waiting ${i}0s before retry"
            sleep $((i * 10))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Shadow curl so the action's re-install attempt is a no-op
          mkdir -p "$HOME/.local/bin-shim"
          cat > "$HOME/.local/bin-shim/curl" <<'SHIM'
          #!/usr/bin/env bash
          for arg in "$@"; do
            if [[ "$arg" == *"claude.ai/install.sh"* ]]; then
              echo "#!/usr/bin/env bash" >&1
              echo "# install already done — shim no-op" >&1
              exit 0
            fi
          done
          exec /usr/bin/curl "$@"
          SHIM
          chmod +x "$HOME/.local/bin-shim/curl"
          echo "$HOME/.local/bin-shim" >> "$GITHUB_PATH"

      - name: Run Claude Code PR review (MINCRM-178)
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: experimental-review
          custom_instructions: |
            You are a strict bug-finder reviewing a MiniCRM pull request.

            RULE: Only post a comment when you have found a concrete bug or violation.
            Do NOT post praise, encouragement, "looks good", or any comment on correct code.
            Do NOT summarize what the PR does. Do NOT acknowledge good practices.
            If the diff is clean, post nothing at all — silence is the correct output.

            When you do find an issue, post an inline comment on the offending line with:
            - Priority: P1 (security/data-loss), P2 (bug/broken behavior), or P3 (rule violation with no immediate runtime impact)
            - The specific rule it violates
            - The correct pattern

            Check only for these MiniCRM-specific violations:

            **P1 — Security**
            - Hardcoded credentials or secrets
            - Authenticated route missing the `authenticate` middleware
            - Admin-only route missing `requireRole('admin')`
            - PATCH/DELETE not enforcing ownership: `WHERE id = $1 AND (owner_id = $2 OR $3 = 'admin')`
            - `owner_id` read from request body instead of `req.user.id`

            **P2 — Bugs / broken behavior**
            - Business logic or `pool.query()` calls outside `server/src/services/`
            - Async route handler not wrapped in `try/catch` or `asyncHandler`
            - Error response not using shape `{ error: { code: string, message: string } }`
            - Missing Zod validation on API request body before the service call
            - ORDER BY column not allowlist-validated before SQL interpolation

            **P3 — Rule violations**
            - New interactable UI element missing `data-testid`
            - User-facing string hardcoded in JSX instead of `t('key')`
            - Physical Tailwind directional class (`pl-`, `pr-`, `ml-`, `mr-`, `left-`, `right-`,
              `text-left`, `text-right`) instead of logical utility (`ps-`, `pe-`, `ms-`, `me-`,
              `start-`, `end-`, `text-start`, `text-end`)
            - New service function missing JSDoc
            - Implementation touching out-of-scope MINCRM-5/6/7 features
            - PR title missing conventional commit prefix (`feat:`, `fix:`, `chore:`, `test:`, `docs:`)
