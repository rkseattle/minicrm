name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint (root + server + client)
        run: npm run lint --workspaces --if-present

      - name: Typecheck client
        run: npm run typecheck --workspace=minicrm-client

      - name: Typecheck server
        run: npm run typecheck --workspace=minicrm-server

      - name: Typecheck qa
        run: npm run typecheck --workspace=minicrm-qa

      - name: Validate OpenAPI spec
        run: npm run lint:api --workspace=minicrm-server
        env:
          NODE_ENV: development

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

  server-tests:
    name: Server Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        # Using ECR Public mirror to avoid Docker Hub unauthenticated pull rate limits
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run server tests with coverage
        run: npm run test:coverage --workspace=minicrm-server
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_test
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  client-tests:
    name: Client Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (no lockfile — resolves Linux-specific optional binaries)
        run: rm -f package-lock.json && npm install

      - name: Run client tests with coverage
        run: npm run test:coverage --workspace=minicrm-client

  e2e-framework-purity:
    name: E2E Framework Purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check framework/ has no application-domain strings (MINCRM-123)
        run: bash qa/scripts/check-framework-purity.sh

  e2e-trivial:
    name: E2E Trivial Smoke Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run trivial smoke test (desktop, MINCRM-123)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=desktop qa/e2e/tests/trivial.spec.ts

      - name: Run trivial smoke test (mobile-web, MINCRM-123)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=mobile-web qa/e2e/tests/trivial.spec.ts

  e2e-bvt:
    name: E2E BVT (MINCRM-131)
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run migrations on E2E database
        run: npm run migrate --workspace=minicrm-server
        env:
          DATABASE_URL: postgresql://minicrm:password@localhost:5432/minicrm_e2e
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-bvt-secret
          NODE_ENV: test

      - name: Seed E2E admin user
        run: npm run seed:e2e-admin
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Start application server
        run: npm run start --workspace=minicrm-server &
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-bvt-secret
          NODE_ENV: production
          PORT: 3001

      - name: Start frontend dev server
        run: npm run dev --workspace=minicrm-client &
        env:
          API_URL: http://localhost:3001

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          echo "Waiting for frontend dev server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done

      - name: Run BVT (desktop, MINCRM-131)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=desktop qa/e2e/tests/apps/minicrm/bvt.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Run BVT (mobile-web, MINCRM-131)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=mobile-web qa/e2e/tests/apps/minicrm/bvt.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Log heal count from report
        if: always()
        run: |
          REPORT=qa/test-results/healing-report.json
          if [ -f "$REPORT" ]; then
            TOTAL=$(node -e "const r=require('./$REPORT'); console.log(r.totalHeals ?? r.total ?? 0)")
            AI=$(node -e "const r=require('./$REPORT'); console.log(r.aiHeals ?? 0)")
            echo "Heal events this run: total=$TOTAL ai=$AI"
            if [ "$AI" -gt 0 ]; then
              echo "::warning::$AI AI heal(s) occurred — check healing-report.json for details"
            fi
          else
            echo "healing-report.json not found (zero heals or reporter did not run)"
          fi

      - name: Upload healing report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-report
          path: qa/test-results/healing-report.json
          if-no-files-found: warn
