name: CI

on:
  pull_request:
    branches: [main]

# MINCRM-135: checks:write for dorny/test-reporter; pull-requests:write for sticky PR comment
# MINCRM-324: contents:write for update-visual-snapshots to commit baselines back to the PR branch
permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  # MINCRM-662: Single source of truth for shard/worker count, computed from a
  # capacity probe run on this job's own runner (every shard in the e2e-functional
  # matrix runs on an identically-sized runner, so this one measurement is
  # representative). Replaces the old hand-maintained TOTAL_SHARDS env var and
  # --workers=2 CLI flags — see qa/e2e/framework/reporting/capacity.ts and
  # docs/dev/e2e-performance.md. Falls back to today's known-good 4 shards / 2
  # workers if the probe can't determine CPU count, so this is a strict
  # improvement with no regression risk.
  capacity-probe:
    name: Detect runner capacity
    runs-on: ubuntu-latest
    outputs:
      total-shards: ${{ steps.plan.outputs.shards }}
      workers: ${{ steps.plan.outputs.workers }}
      shard-matrix: ${{ steps.plan.outputs.shard-matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute capacity plan
        id: plan
        run: |
          PLAN=$(npm run --silent e2e:capacity-plan)
          echo "Capacity plan: $PLAN"
          SHARDS=$(echo "$PLAN" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf-8")).shards')
          WORKERS=$(echo "$PLAN" | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf-8")).workers')
          SHARD_MATRIX=$(node -pe "JSON.stringify(Array.from({length: $SHARDS}, (_, i) => i + 1))")
          {
            echo "shards=$SHARDS"
            echo "workers=$WORKERS"
            echo "shard-matrix=$SHARD_MATRIX"
          } >> "$GITHUB_OUTPUT"

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs:              ${{ steps.filter.outputs.docs }}
      client:            ${{ steps.filter.outputs.client }}
      server:            ${{ steps.filter.outputs.server }}
      qa:                ${{ steps.filter.outputs.qa }}
      config:            ${{ steps.filter.outputs.config }}
      visual:            ${{ steps.filter.outputs.visual }}
      migrations:        ${{ steps.filter.outputs.migrations }}
      ai:                ${{ steps.filter.outputs.ai }}
      coverage-dashboard: ${{ steps.filter.outputs.coverage-dashboard }}
      attestation-docs:  ${{ steps.filter.outputs.attestation-docs }}
      env-example-parity: ${{ steps.filter.outputs.env-example-parity }}
      playwright-version: ${{ steps.filter.outputs.playwright-version }}
      qa-e2e-scripts:    ${{ steps.filter.outputs.qa-e2e-scripts }}
      auth-token-expiry: ${{ steps.filter.outputs.auth-token-expiry }}
      coverage-migrations: ${{ steps.filter.outputs.coverage-migrations }}
      coverage-map-exit-code: ${{ steps.filter.outputs.coverage-map-exit-code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required: dorny/paths-filter needs full history to diff
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          base: ${{ github.base_ref }}
          filters: |
            docs:
              - '**.md'
              - 'docs/**'
            client:
              - 'client/src/**'
              - 'client/public/**'
            server:
              - 'server/src/**'
            qa:
              - 'qa/e2e/framework/**'
              - 'qa/e2e/behaviors/**/*.ts'
              - 'qa/e2e/pages/**/*.ts'
              - 'qa/e2e/apps/**/*.ts'
              - 'qa/e2e/tests/**/*.ts'
              - 'qa/e2e/*.ts'
              - 'qa/scripts/**/*.sh'
              - 'qa/scripts/**/*.ts'
              # .mjs is not decorative: check-locator-timeout-forwarding.mjs is a
              # static guard, so without this entry a PR editing only the guard
              # never runs it — the exact silent-guard failure this repo's
              # paths-filter rule exists to prevent. (MINCRM-703)
              - 'qa/scripts/**/*.mjs'
              # qa/e2e/tests/framework/merge-junit-results.spec.ts asserts that
              # qa/scripts/junit-xml.ts and server/src/scripts/junitXml.ts redact
              # the same JUnit payload regions. That rule deliberately exists in
              # both workspaces (qa/ must not import server's DB-bound modules at
              # runtime), and this parity test is the only thing pinning the two
              # together — so a server-side edit has to trigger this job or the
              # guard is absent on exactly the change it exists to catch.
              # (MINCRM-689)
              - 'server/src/scripts/junitXml.ts'
              # Same arrangement, second instance:
              # qa/e2e/tests/framework/coverage-session-control-client.spec.ts
              # asserts that the QA session resolver's SHA accept-set matches
              # server/src/coverageAgent/coverageConfig.ts's
              # SAFE_PATH_SEGMENT_PATTERN. One tags coverage SESSIONS (what the
              # attestation gate joins on), the other tags coverage DUMPS (what
              # the coverage map keys on), so a split between them is invisible
              # until a gate reports no-session-attribution or a generated map
              # turns out to be unusable. Without this entry a server-only edit
              # to that pattern would not re-run the parity test. (MINCRM-688)
              - 'server/src/coverageAgent/coverageConfig.ts'
              # check-sha-pattern-parity.sh (in the e2e-framework-purity job) reads
              # the coverage build-SHA accept-set out of all THREE files that
              # hold it. The other two are already matched by the globs above
              # and the coverageConfig.ts entry; this is the third. Without it a
              # dashboard-only edit to that pattern would not run the check that
              # exists to catch exactly that drift. (MINCRM-688)
              - 'coverage-dashboard/src/pages/SessionRecorderPage.tsx'
              # The parity/shape assertions read a captured real CI artifact, so a
              # fixture-only edit must re-run them too — the *.ts globs miss it.
              - 'qa/e2e/tests/framework/__fixtures__/**'
              # check-compose-isolation.sh (below) validates these, so a compose-only
              # change must still trigger this job. (MINCRM-684)
              - 'docker-compose*.yml'
              - 'qa/package.json'
              - 'qa/package-lock.json'
              - 'qa/tsconfig*.json'
            config:
              - '*.json'
              - '*.yaml'
              - '*.yml'
              - 'Dockerfile*'
              - '.github/**'
            visual:
              - 'qa/e2e/tests/apps/minicrm/functional/visual/**'
              - 'qa/e2e/snapshots/**'
            migrations:
              - 'db/migrations/**'
            # The COVERAGE database's migrations, which live in qa/migrations/
            # rather than db/migrations/ and were matched by no filter at all —
            # the `qa` output enumerates qa/e2e/** and qa/scripts/**, never this
            # directory. A PR touching only a coverage migration therefore ran
            # ZERO jobs, despite the migration executing at every server boot via
            # runCoverageMigrations() and the coverage-map export depending on
            # the index one of them creates. (MINCRM-703)
            coverage-migrations:
              - 'qa/migrations/**'
            # Single-purpose output for check-token-refresh-parity.sh, which pins
            # the token lifetime assumed by the E2E suite AND by the browser
            # client against the server's real one. The invariant is
            # bidirectional — it breaks by editing any side — and the QA half is
            # already covered by the `qa` filter, so the server and client files
            # need their own entries. Deliberately NOT folded into `qa` or
            # `client`: those gate many jobs including the full E2E matrix, and
            # a session-lifetime edit has no business booting all of it.
            # (MINCRM-703)
            auth-token-expiry:
              - 'server/src/auth/sessionCookie.ts'
              - 'client/src/hooks/useSessionRefresh.ts'
            # Single-purpose output for check-coverage-map-exit-code-parity.sh.
            # The two files it pins live outside qa/, so without this a change to
            # either would not re-run the guard — the bidirectional-invariant
            # rule in CLAUDE.md. Deliberately not folded into `server`, which
            # gates the whole E2E matrix. (MINCRM-703)
            coverage-map-exit-code:
              - 'server/src/scripts/load-coverage-map.ts'
              - 'scripts/pre-push-tia.ts'
            ai:
              - 'server/src/ai/**'
              - 'qa/evals/**'
              - '.github/workflows/ci.yml'
            coverage-dashboard:
              - 'coverage-dashboard/src/**'
              - 'coverage-dashboard/package.json'
              - 'coverage-dashboard/*.json'
              - 'coverage-dashboard/*.ts'
              - 'coverage-dashboard/*.cjs'
              - 'shared/schemas/**'
            # Single-purpose filter, deliberately NOT folded into `server`.
            # verifyTestAttestation.test.ts asserts that every member of
            # ATTESTATION_FAILURE_REASONS appears in docs/dev/coverage.md's
            # "Reading a failed run" list — the operator's index for a red
            # attestation gate, which had already drifted by three of seven
            # reasons. The invariant is bidirectional: the docs can drift by
            # DELETION just as easily as the source can drift by addition, and a
            # docs-only edit otherwise matches only the `docs` filter
            # (markdownlint), so server-tests would be skipped and the guard
            # silent on exactly half of what it exists to catch.
            #
            # `server` would also work but appears in eight job conditions,
            # including the full e2e-functional matrix — a typo fix in this one
            # .md would boot Postgres and every E2E shard, which the aggregate
            # job's own comment calls out as spurious. This output is OR'd into
            # server-tests alone, which additionally needs always() there; see
            # that job's comment for why. (MINCRM-691)
            attestation-docs:
              - 'docs/dev/coverage.md'

            # Single-purpose filter, deliberately NOT folded into `qa`.
            #
            # check-env-example-parity.sh compares each .env*.example to its local
            # counterpart AND, since MINCRM-699, the two qa/ templates to each
            # other — they declare themselves mirrors but nothing reconciled them,
            # so they had already drifted. That guard is silent unless an edit to
            # a template actually boots the job running it, and no CI job ran this
            # script at all before now. Folding it into `qa` would boot the entire
            # E2E matrix for a comment-only .env.example edit, which the
            # aggregate job's own comment calls out as spurious. (MINCRM-699)
            env-example-parity:
              - '**/*.env*.example'
              - 'qa/scripts/check-env-example-parity.sh'

            # Single-purpose filter, deliberately NOT folded into `qa`.
            #
            # global-setup-guard.spec.ts re-derives FLAGS_TAKING_A_VALUE from
            # node_modules/playwright/lib/program.js and asserts the guard's copy
            # covers every value-taking flag — so a Playwright upgrade that adds
            # one whose value is path-shaped fails that test instead of silently
            # changing which runs skip the stale-data guard. That guard is only
            # real if an upgrade BOOTS the job running it, and nothing did: this
            # is an npm-workspaces repo, so a Playwright bump lands in the ROOT
            # package-lock.json, which matches only `config` — not OR'd into
            # e2e-framework-specs. (`qa/package-lock.json` in the `qa` filter
            # above matches nothing; the file does not exist.) The declared range
            # in qa/package.json is included because it can move the installed
            # version on its own. (MINCRM-699)
            playwright-version:
              - 'package-lock.json'
              - 'qa/package.json'

            # Single-purpose filter, deliberately NOT folded into `qa`.
            #
            # qa/e2e/SCRIPTS is distinct from qa/scripts, and is matched by NO
            # existing filter: 'qa/e2e/*.ts' is single-level and does not descend,
            # and 'qa/scripts/**' is a different directory. So a PR touching only
            # qa/e2e/scripts/*.ts ran ZERO jobs — despite CI itself executing
            # gen-shard-config.ts, and despite those files sitting inside
            # qa/tsconfig.json's include (they are typechecked whenever the job
            # runs; the job simply never ran for an edit to them).
            #
            # `qa` would also close the gap but appears in eight job conditions,
            # including the full e2e-functional matrix and e2e-serial — a one-line
            # edit to gen-shards.ts would boot Postgres, MinIO, Mailhog and every
            # E2E shard. So this output is OR'd into the two jobs that STATICALLY
            # ANALYSE these files:
            #
            #   - lint-and-typecheck — they are inside qa/tsconfig.json's include
            #   - e2e-framework-specs — runs shard-script-args.spec.ts, which
            #     pins their `=`-preserving arg split. This one is the
            #     bidirectional half: without it the guard is silent on exactly
            #     the edit it exists to catch.
            #
            # Deliberately NOT e2e-framework-purity: its seven checks scan
            # e2e/framework, e2e/tests, e2e/behaviors and three named files, none
            # of which is qa/e2e/scripts — adding it there would be a no-op that
            # reads like coverage.
            #
            # Also deliberately NOT the jobs that merely EXECUTE a script here:
            # e2e-functional runs gen-shard-config.ts and e2e-serial runs
            # gen-conflict-group-configs.ts. Those jobs exercise the scripts as a
            # side effect of running the suite; they do not verify them, and
            # gating on them would boot the whole E2E stack for a one-line edit.
            # The invariants that CAN fail silently — the arg parsers — are
            # covered by shard-script-args.spec.ts under e2e-framework-specs
            # instead. gen-conflict-group-configs.ts takes no CLI arguments, so
            # it carries none of that class of defect.
            #
            # Neither job needs the always() + upstream-result form that
            # attestation-docs requires for server-tests: e2e-framework-specs
            # needs lint-and-typecheck, which is itself gated on this output, so
            # it cannot be skipped out from under it. (MINCRM-696)
            qa-e2e-scripts:
              - 'qa/e2e/scripts/**/*.ts'

      - name: Clear stale functional test comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-results-functional
          message: |
            ## Functional Test Results

            ⏳ Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in progress…

      - name: Clear stale unit test comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-test-coverage
          message: |
            ## Phase 2 — Unit & Framework Tests

            ⏳ Run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in progress…

  lint-and-typecheck:
    name: Phase 1 - Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.qa == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.coverage-dashboard == 'true' || needs.changes.outputs.qa-e2e-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (root + server + client)
        run: npm run lint

      - name: Typecheck client
        run: npm run typecheck --workspace=minicrm-client

      - name: Typecheck server
        run: npm run typecheck --workspace=minicrm-server

      - name: Typecheck qa
        run: npm run typecheck --workspace=minicrm-qa

      - name: Typecheck coverage-dashboard
        run: npm run typecheck --workspace=minicrm-coverage-dashboard

      - name: Validate OpenAPI spec
        run: npm run lint:api --workspace=minicrm-server
        env:
          NODE_ENV: development

  # MINCRM-203: npm audit runs in a separate parallel job so it does not delay
  # Phase 2 (server + client tests). Runs alongside Phase 1.
  # MINCRM-282: job is now blocking — continue-on-error removed.
  # MINCRM-703: unconditional — never gated on changed paths. Advisories are
  # published against versions ALREADY in the lockfile, so the runs that most need
  # this job are exactly the ones that touch no dependency file. Gating it on
  # `client || server || config` meant a docs- or qa-only PR reported a green CI
  # while carrying known-vulnerable dependencies, and drift was first discovered
  # from an unrelated branch. `always()` is required because GitHub auto-skips a
  # job whose `needs` was skipped BEFORE evaluating `if:`.
  security-audit:
    name: Phase 1 - Security Audit
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # MINCRM-703: the allowlist is GONE, and so are all 16 entries that used to be
      # here. Every one of them resolved once the dependency tree was actually
      # re-resolved rather than reasoned about.
      #
      # What was really happening: npm treats an existing node_modules + lockfile pair
      # as already-satisfying and will not reconsider `overrides` for a transitive dep
      # on an incremental install — `npm install`, `npm install --package-lock-only`,
      # and even deleting the lockfile alone all silently left undici at 7.28.0 and
      # hono at 4.12.31. Only a full `rm -rf node_modules package-lock.json` re-resolve
      # applied the pins. MINCRM-702 concluded from the same symptom that overrides
      # "do not take effect in this workspace layout"; that was wrong. A clean-room
      # repro of the identical chain (root overrides -> workspace -> promptfoo ->
      # optional @modelcontextprotocol/sdk -> hono) honors the override correctly.
      # The lockfile not recording an `overrides` key is a lockfileVersion 3 cosmetic
      # detail, not evidence the pins were ignored.
      #
      # Result: 19 advisories -> 0. Pins live in the root package.json `overrides`.
      #
      # One override knowingly violates a declared range: @connectrpc/connect-node
      # asks for undici `^5.28.4`, so `npm ls undici` reports `invalid`. That
      # violation is PRE-EXISTING — main already served it a hoisted v7 (7.28.0) and
      # reported the same `invalid`; this pin moves 7.28.0 -> 7.29.0 within an
      # already-violated range, it does not create the violation. It is safe because
      # connect-node's ONLY undici usage is dist/cjs/node-headers-polyfill.js, which
      # reads `undici.Headers` solely under `if (major < 18)` — dead code on Node 20
      # (CI) and Node 22, and undici v7 exports `Headers` regardless. Verified by
      # loading @connectrpc/connect-node against 7.29.0. Recheck this if connect-node
      # is upgraded or its undici surface grows beyond that polyfill.
      #
      # Keep this job at zero. If a future advisory genuinely has no fix, add an
      # allowlist back with a written justification and a re-resolve actually
      # attempted first — not a reasoned argument for why the fix cannot work.
      - name: Audit dependencies for high/critical vulnerabilities
        run: |
          # npm audit exits non-zero BOTH when it finds advisories and when it fails
          # to run at all, so the exit code alone cannot distinguish "clean" from
          # "never produced a verdict". Capture output and status separately, then
          # require a well-formed report before trusting any conclusion — otherwise a
          # registry outage, a proxy error, or an npm crash yields empty output that
          # scrapes to zero advisories and reports a green security gate. (MINCRM-703)
          set +e
          npm audit --audit-level=high --json > "${RUNNER_TEMP}/audit.json"
          AUDIT_STATUS=$?
          set -e

          if ! jq -e '(.metadata.vulnerabilities | type) == "object"' "${RUNNER_TEMP}/audit.json" > /dev/null 2>&1; then
            echo "::error::npm audit did not produce a usable report (exit ${AUDIT_STATUS})."
            echo "Treating this as a failure: an unreadable audit is not a clean audit."
            head -c 4000 "${RUNNER_TEMP}/audit.json" || true
            exit 1
          fi

          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' "${RUNNER_TEMP}/audit.json")
          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' "${RUNNER_TEMP}/audit.json")

          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "::error::npm audit found ${CRITICAL} critical and ${HIGH} high advisories:"
            jq -r '
              (.vulnerabilities // {}) | to_entries[] | .value.via[]
              | select(type == "object")
              | "\(.url | split("/")[-1])  \(.severity)  \(.name)"
            ' "${RUNNER_TEMP}/audit.json" | sort -u
            jq '.vulnerabilities' "${RUNNER_TEMP}/audit.json"
            echo ""
            echo "Before allowlisting anything, try a full re-resolve — an incremental"
            echo "npm install will NOT reconsider overrides for transitive deps:"
            echo "  rm -rf node_modules package-lock.json && npm install"
            echo "Pin the fixed version in the root package.json \"overrides\" block."
            exit 1
          fi

          echo "No high/critical advisories (MINCRM-703)."

  # MINCRM-633: PR select mode — runs the existing change-to-test selection
  # pipeline (server/src/scripts/select-tests.ts, pr-tia-6/MINCRM-623-627)
  # against this PR's diff and posts the result as fast, ADVISORY feedback.
  # This job's outcome never gates ci-gate and never narrows what
  # e2e-functional/e2e-serial actually run below — those remain the full
  # suite (or their own existing subset logic) exactly as before this job
  # existed. Only MINCRM-660's shard-feed (a later change) will make
  # e2e-functional's OWN behavior selection-aware; until then this job is
  # observational: it reports what select mode WOULD have run, so the
  # selection engine gets real-world PR exposure before anything is wired
  # to actually skip tests based on it.
  tia-selection:
    name: Phase 1 - TIA Selection (advisory)
    needs: [changes]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.qa == 'true'
    runs-on: ubuntu-latest
    # Never blocks the PR — a selection-engine failure (e.g. coverage DB
    # briefly unreachable) must not fail CI for something this job only
    # advises on. continue-on-error surfaces the failure as a yellow
    # warning in the Actions UI rather than a red X, while still letting
    # later steps in THIS job run (each step below has its own `if: always()`
    # so a failed selection step doesn't also skip the PR-comment step —
    # readers should see "selection failed" rather than no comment at all).
    continue-on-error: true

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # select-tests.ts shells `git diff base..head`, which needs full history

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        id: fetch-base
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          echo "sha=$(git rev-parse origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

      # Neither this job nor select-tests.ts ever starts the app server
      # (whose own boot sequence auto-provisions the coverage database) or
      # runs through Vitest's globalSetup.ts (which does the same for
      # minicrm_coverage_test) — so nothing else in this job creates
      # minicrm_coverage_test before the steps below query it. Found in CI:
      # "database minicrm_coverage_test does not exist" — Load committed
      # coverage map's own file-not-found fallback masked this, since it
      # short-circuits before ever touching the database when
      # qa/coverage-map.jsonl is absent, but Run TIA selection's direct query
      # has no such fallback.
      - name: Provision coverage database
        run: npm run --workspace=minicrm-server --silent create:coverage-db
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          COVERAGE_DB_NAME: minicrm_coverage_test

      # pr-tia-8: CI has no persistent database — this job's coverageDb is a
      # fresh, empty Postgres service container every run (see
      # coverageMappingService.ts's own "Committed-map load/export" docblock).
      # Re-populates coverage_test_links from the committed qa/coverage-map.jsonl
      # (produced by tia-record-mode.yml's dump-coverage-map.ts step) before
      # selection queries it below. A missing/absent map degrades to the
      # existing unmapped-changes safety-net fallback, not a hard failure.
      - name: Load committed coverage map
        run: |
          npm run --workspace=minicrm-server --silent load:coverage-map -- \
            --sha=${{ steps.fetch-base.outputs.sha }}
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_test
          DB_HOST: localhost
          DB_PORT: 5432
          COVERAGE_DB_NAME: minicrm_coverage_test
          NODE_ENV: test

      - name: Run TIA selection
        id: select
        if: always()
        run: |
          npm run select:tests --workspace=minicrm-server --silent -- \
            --base=origin/${{ github.base_ref }} --head=${{ github.event.pull_request.head.sha }} \
            > /tmp/tia-selection.json
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_test
          DB_HOST: localhost
          DB_PORT: 5432
          COVERAGE_DB_NAME: minicrm_coverage_test
          NODE_ENV: test

      - name: Build selection rationale comment
        if: always()
        run: |
          {
            echo "## TIA Selection (advisory — MINCRM-633)"
            echo ""
            if [ -s /tmp/tia-selection.json ] && jq -e . /tmp/tia-selection.json >/dev/null 2>&1; then
              MODE=$(jq -r '.mode' /tmp/tia-selection.json)
              BASE_SHA=$(jq -r '.baseSha' /tmp/tia-selection.json)
              HEAD_SHA=$(jq -r '.headSha' /tmp/tia-selection.json)
              echo "**Mode:** \`$MODE\`"
              echo ""
              echo "_Evaluated \`$BASE_SHA\` → \`$HEAD_SHA\`. Provenance: this run's selection JSON is uploaded as the \`tia-selection-${{ github.run_id }}\` artifact._"
              echo ""
              jq -r '.rationale[] | "- " + .' /tmp/tia-selection.json
              echo ""
              if [ "$MODE" = "targeted" ]; then
                COUNT=$(jq '.specFiles | length' /tmp/tia-selection.json)
                echo "<details><summary>$COUNT selected spec file(s)</summary>"
                echo ""
                jq -r '.specFiles[] | "- `" + . + "`"' /tmp/tia-selection.json
                echo ""
                echo "</details>"
              fi
              UNRESOLVED=$(jq '.unresolvedTestIds | length' /tmp/tia-selection.json)
              if [ "$UNRESOLVED" -gt 0 ]; then
                echo ""
                echo "⚠️ $UNRESOLVED selected test(s) could not be resolved to a spec file."
              fi
            else
              echo "⚠️ Selection did not complete (see the \`tia-selection\` job log). This is advisory-only and does not block this PR."
            fi
            echo ""
            echo "_Advisory only — a green result here is not a promise the full suite passed. The authoritative gate is the post-merge/nightly full-suite run (MINCRM-633 record mode)._"
            echo ""
            echo "_Coverage delta not shown: PR-time runs don't collect coverage instrumentation or ingest it, so no comparable data exists yet at select time (MINCRM-634 scoped gap — coverage data only becomes available post-merge via record mode)._"
          } > /tmp/tia-comment-body.md
          cat /tmp/tia-comment-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post selection rationale comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tia-selection
          path: /tmp/tia-comment-body.md

      - name: Upload selection result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tia-selection-${{ github.run_id }}
          path: /tmp/tia-selection.json
          retention-days: 14
          if-no-files-found: warn

  server-tests:
    name: Phase 2 - Server Unit Tests
    needs: [lint-and-typecheck, changes]
    # attestation-docs is OR'd in so a docs-only edit to docs/dev/coverage.md
    # still runs verifyTestAttestation.test.ts's reason-documentation parity
    # assertion. Scoped to this job rather than widening `server`, which gates
    # the E2E matrix too.
    #
    # coverage-migrations likewise: qa/migrations/** matched no filter at all,
    # so a coverage-migration-only PR ran nothing. These tests exercise the
    # coverage database those migrations define — including the index the map
    # export's keyset pagination depends on. (MINCRM-703)
    #
    # always() is required, not decorative: on a docs-only change
    # lint-and-typecheck is itself skipped (its gate is client/server/qa/config/
    # coverage-dashboard, none of which match a .md), and GitHub auto-skips any
    # job whose `needs` were skipped — regardless of what this `if:` evaluates
    # to. Without always() the attestation-docs path is dead on exactly the case
    # it exists for. Same pattern and reasoning as e2e-functional below
    # (MINCRM-271). The explicit result check preserves the Phase 1 gate: a real
    # lint/typecheck failure still blocks this job. (MINCRM-691)
    if: |
      always() &&
      (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped') &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.attestation-docs == 'true' || needs.changes.outputs.coverage-migrations == 'true')
    runs-on: ubuntu-latest

    services:
      postgres:
        # Using ECR Public mirror to avoid Docker Hub unauthenticated pull rate limits
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # @rolldown/binding-linux-x64-gnu is a platform-specific optional dep omitted from
        # the macOS-generated lockfile. Running npm install from within client/ bypasses
        # the root workspace lockfile and forces fresh resolution of platform-specific
        # optional binaries (npm workspace optional-deps bug: https://github.com/npm/cli/issues/4828).
        run: npm ci && npm install --prefix client

      - name: Run server tests with coverage
        run: npm run test:coverage --workspace=minicrm-server
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_test
          DB_HOST: localhost
          DB_PORT: 5432
          # Runners and the postgres:16 service container both default to UTC,
          # which is exactly the timezone where a local-vs-UTC date defect is
          # invisible: a boundary built from local calendar fields produces the
          # same instant as a UTC one, so a regression guard for MINCRM-700
          # would pass here while the bug shipped. Pinning a UTC-AHEAD zone
          # makes those guards live. Chosen over a UTC-behind zone because the
          # month-boundary defects in this codebase (a local month start
          # serializing to the previous month, an end-of-month landing a day
          # early) only manifest ahead of UTC. Postgres still resolves
          # CURRENT_DATE in UTC, so this also keeps the Node/DB disagreement
          # that MINCRM-700 is about permanently exercised.
          TZ: Pacific/Auckland
          # Coverage/TIA tables live in their own database (server/src/coverageDb.ts).
          # globalSetup.ts creates + migrates this database automatically (same
          # pattern as minicrm_test above) — this only needs to name it explicitly
          # so it doesn't collide with a real minicrm_coverage a developer might
          # also have running locally against the same Postgres instance.
          COVERAGE_DB_NAME: minicrm_coverage_test
          # Coverage/TIA control API and session management routes are
          # registered only when these are 'true' at process boot
          # (MINCRM-663) — needed so coverageController.test.ts/
          # coverageSessionController.test.ts can reach those routes.
          COVERAGE_INSTRUMENTATION: "true"
          COVERAGE_SESSION_MANAGEMENT: "true"
          # Same, for the query/ingestion routers (MINCRM-685) — needed so
          # coverageMappingController.test.ts/coverageReportingController.test.ts/
          # coveragePipelineController.test.ts reach their handlers instead of a
          # 404, now that those routers gate on these vars at boot.
          COVERAGE_MAPPING_QUERY: "true"
          COVERAGE_REPORTING_QUERY: "true"
          COVERAGE_PIPELINE_INGESTION: "true"
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20

      - name: Guard against empty server test results
        if: always()
        run: |
          COUNT=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              print(ET.parse('server/test-results/junit.xml').getroot().get('tests', '0'))
          except Exception:
              print('0')
          ")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Server test results contain 0 tests — likely a globalSetup crash. Check the 'Run server tests with coverage' step above."
            exit 1
          fi

      - name: Publish server test results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest – server
          path: server/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload server test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: server/test-results/junit.xml
          retention-days: 14

      - name: Upload server coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server/coverage/lcov.info
            server/coverage/coverage-summary.json
          retention-days: 14

  client-tests:
    name: Phase 2 - Client Unit Tests
    needs: [lint-and-typecheck, changes]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache client node_modules
        # MINCRM-331: cache client/node_modules separately from the root cache so
        # platform-specific optional binaries (@rollup/rollup-linux-x64-gnu) resolved
        # by the npm install --prefix client step below are persisted across runs.
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: client-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        # @rollup/rollup-linux-x64-gnu is a platform-specific optional dep omitted from
        # the macOS-generated lockfile. Running npm install from within client/ bypasses
        # the root workspace lockfile and forces fresh resolution of platform-specific
        # optional binaries (npm workspace optional-deps bug).
        run: npm ci && npm install --prefix client

      - name: Run client tests with coverage
        run: npm run test:coverage --workspace=minicrm-client
        env:
          # See the server-tests job for the full rationale: a UTC runner is the
          # one timezone where a local-vs-UTC date defect is invisible, so the
          # MINCRM-700 guards here would pass under UTC while the bug shipped.
          # The guards this makes live are in client/src/utils/utcDate.test.ts —
          # verified: reverting firstOfMonthIso to local calendar fields fails 4
          # tests under this zone and 0 under UTC.
          TZ: Pacific/Auckland

      - name: Guard against empty client test results
        if: always()
        run: |
          COUNT=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              print(ET.parse('client/test-results/junit.xml').getroot().get('tests', '0'))
          except Exception:
              print('0')
          ")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Client test results contain 0 tests — likely a setup crash. Check the 'Run client tests with coverage' step above."
            exit 1
          fi

      - name: Publish client test results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest – client
          path: client/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload client test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/test-results/junit.xml
          retention-days: 14

      - name: Upload client coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/coverage/lcov.info
            client/coverage/coverage-summary.json
          retention-days: 14

  coverage-dashboard-tests:
    name: Phase 2 - Coverage Dashboard Unit Tests
    needs: [lint-and-typecheck, changes]
    if: needs.changes.outputs.coverage-dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache coverage-dashboard node_modules
        # Same platform-specific-optional-deps rationale as client-tests' own cache step.
        uses: actions/cache@v4
        with:
          path: coverage-dashboard/node_modules
          key: coverage-dashboard-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci && npm install --prefix coverage-dashboard

      - name: Run coverage-dashboard tests with coverage
        run: npm run test:coverage --workspace=minicrm-coverage-dashboard

      - name: Guard against empty coverage-dashboard test results
        if: always()
        run: |
          COUNT=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              print(ET.parse('coverage-dashboard/test-results/junit.xml').getroot().get('tests', '0'))
          except Exception:
              print('0')
          ")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::coverage-dashboard test results contain 0 tests — likely a setup crash. Check the 'Run coverage-dashboard tests with coverage' step above."
            exit 1
          fi

      - name: Publish coverage-dashboard test results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest – coverage-dashboard
          path: coverage-dashboard/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage-dashboard test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dashboard-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-dashboard/test-results/junit.xml
          retention-days: 14

      - name: Upload coverage-dashboard coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dashboard-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-dashboard/coverage/lcov.info
            coverage-dashboard/coverage/coverage-summary.json
          retention-days: 14

  e2e-framework-purity:
    name: Phase 1 - E2E Framework Purity
    needs: changes
    # No always() here, deliberately. CLAUDE.md mandates it when an upstream job
    # can be SKIPPED, because GitHub auto-skips the dependent before evaluating
    # `if:`. This job's only dependency is `changes`, which is unconditional and
    # so never skipped — matching the other changes-only jobs above, which all
    # use a plain condition. Adding always() would be actively harmful: if
    # `changes` FAILED, every output would read as empty, the OR would be false,
    # and this job would report `skipped` rather than blocking — quietly
    # dropping the whole purity suite from a green build. (MINCRM-703)
    # env-example-parity is OR'd in so an edit to any .env*.example — including
    # one in a workspace this job's other checks ignore — still runs the template
    # mirror assertion. Scoped here rather than widening `qa`, which gates the
    # whole E2E matrix. (MINCRM-699)
    if: needs.changes.outputs.qa == 'true' || needs.changes.outputs.auth-token-expiry == 'true' || needs.changes.outputs.coverage-map-exit-code == 'true' || needs.changes.outputs.env-example-parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check framework/ has no application-domain strings (MINCRM-123)
        run: bash qa/scripts/check-framework-purity.sh

      - name: Check .env*.example templates match and mirror each other (MINCRM-699)
        run: bash qa/scripts/check-env-example-parity.sh

      - name: Check spec files that mutate settings call ensureSystemDefaults() (MINCRM-358)
        run: bash qa/scripts/check-settings-mutations.sh

      - name: Check spec files do not import from @pages/ directly (MINCRM-367)
        run: bash qa/scripts/check-behavior-layer.sh

      - name: Check spec files do not use waitForLoadState('networkidle') (MINCRM-551)
        run: bash qa/scripts/check-networkidle.sh

      - name: Check dev and test Compose stacks stay isolated (MINCRM-684)
        run: bash qa/scripts/check-compose-isolation.sh

      - name: Check the coverage build-SHA accept-set has not drifted (MINCRM-688)
        run: bash qa/scripts/check-sha-pattern-parity.sh

      - name: Check specs register created records for teardown (MINCRM-686)
        run: bash qa/scripts/check-e2e-cleanup.sh

      - name: Check the QA token lifetime matches the server's (MINCRM-703)
        run: bash qa/scripts/check-token-refresh-parity.sh

      - name: Check the corrupt-map exit code has not drifted (MINCRM-703)
        run: bash qa/scripts/check-coverage-map-exit-code-parity.sh

      - name: Check the locator-timeout guard itself is correct (MINCRM-703)
        run: node qa/scripts/check-locator-timeout-forwarding.mjs --self-test

      - name: Check page objects forward their caller's timeout (MINCRM-703)
        run: node qa/scripts/check-locator-timeout-forwarding.mjs

  e2e-framework-specs:
    name: Phase 2 - E2E Framework Unit Tests
    needs: [lint-and-typecheck, changes]
    # qa-e2e-scripts is load-bearing here, not merely additive: this is the job
    # that runs shard-script-args.spec.ts, which pins gen-shards.ts's and
    # gen-shard-config.ts's `=`-preserving arg split. Without it a PR that
    # "simplifies" that split back runs lint and the purity checks — neither of
    # which reads those files — and never runs the test that would fail, which
    # is the exact silent-guard failure CLAUDE.md's bidirectional-invariant rule
    # describes. (MINCRM-696)
    # playwright-version is OR'd in so a Playwright upgrade runs
    # global-setup-guard.spec.ts's flag-set parity assertion, which re-derives the
    # guard's value-taking-flag list from node_modules. Without it that guard is
    # silent on the exact change it exists to catch. (MINCRM-699)
    if: needs.changes.outputs.qa == 'true' || needs.changes.outputs.qa-e2e-scripts == 'true' || needs.changes.outputs.playwright-version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('qa/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run framework unit tests with coverage
        working-directory: qa
        run: npm run test:framework:coverage

      - name: Publish framework test results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright – framework
          path: qa/e2e/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload framework test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/e2e/test-results/results.xml
          retention-days: 14

      - name: Upload framework coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/coverage/lcov.info
            qa/coverage/coverage-summary.json
          retention-days: 14

  # MINCRM-549: Generates per-shard playwright.shard.config.ts files using LPT bin-packing
  # so each shard gets a balanced set of spec files by estimated wall time rather than count.
  # Falls back gracefully: if test-timing-baseline.json is absent (e.g. first run on a fresh
  # branch) this step exits 0 and e2e-functional falls back to Playwright's native --shard.
  e2e-timing-setup:
    name: Phase 3 - E2E Timing Setup (LPT shard config)
    needs: [server-tests, client-tests, changes, capacity-probe]
    if: |
      always() &&
      (needs.server-tests.result == 'success' || needs.server-tests.result == 'skipped') &&
      (needs.client-tests.result == 'success' || needs.client-tests.result == 'skipped') &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.qa == 'true')
    runs-on: ubuntu-latest
    outputs:
      baseline-exists: ${{ steps.check-baseline.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for timing baseline
        id: check-baseline
        run: |
          if [ -f qa/e2e/test-timing-baseline.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Timing baseline found — using LPT shard assignment."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::test-timing-baseline.json not found. Falling back to Playwright native --shard."
          fi

      - name: Generate shard configs (LPT assignment)
        if: steps.check-baseline.outputs.exists == 'true'
        run: |
          for i in $(seq 0 $(( ${{ needs.capacity-probe.outputs.total-shards }} - 1 ))); do
            npx tsx qa/e2e/scripts/gen-shard-config.ts \
              --shard-index="$i" \
              --total-shards=${{ needs.capacity-probe.outputs.total-shards }}
          done

      - name: Upload shard configs artifact
        if: steps.check-baseline.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-configs-${{ github.run_id }}
          path: qa/e2e/playwright.shard.*.config.ts
          retention-days: 1

  e2e-functional:
    # MINCRM-193: Phase 3 (BVT) eliminated — functional suite gates on Phase 2 directly.
    # Smoke tests (@smoke @functional) are individual tests distributed across domain
    # suites; they run alongside all functional tests in the same phase.
    # MINCRM-217: shard/worker counts are computed by capacity-probe (MINCRM-662);
    # today's known-good values are 4 shards x 2 workers = 8 parallel test slots per
    # project (2 projects x 4 shards = 8 concurrent runners) — see capacity-probe job.
    # MINCRM-549: Shard index is 1-based in the matrix (matching --shard=K/N convention)
    # but 0-based in the generated config filename (playwright.shard.0.config.ts).
    name: Phase 3 - E2E Functional (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ needs.capacity-probe.outputs.total-shards }})
    needs: [server-tests, client-tests, changes, capacity-probe, e2e-timing-setup]
    # MINCRM-271: always() prevents GitHub from auto-skipping this job when server-tests
    # or client-tests were legitimately skipped (qa-only change). The explicit result checks
    # preserve the original Phase 2 gate: e2e still blocks on a unit test failure.
    # MINCRM-549: e2e-timing-setup is included in needs so the shard configs are ready
    # before matrix jobs start. Its result must be checked explicitly — without this,
    # GitHub would auto-skip e2e-functional whenever e2e-timing-setup is skipped.
    if: |
      always() &&
      (needs.server-tests.result == 'success' || needs.server-tests.result == 'skipped') &&
      (needs.client-tests.result == 'success' || needs.client-tests.result == 'skipped') &&
      (needs.e2e-timing-setup.result == 'success' || needs.e2e-timing-setup.result == 'skipped' || needs.e2e-timing-setup.result == 'failure') &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.qa == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-web]
        shard: ${{ fromJSON(needs.capacity-probe.outputs.shard-matrix) }}

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MINCRM-278: MinIO provides an S3-compatible storage backend so attachment
      # E2E tests run unconditionally instead of skipping.
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        command: server /data --console-address :9001

      # MINCRM-306: Mailhog captures transactional emails sent by the app server.
      # SMTP port 1025 receives messages; HTTP port 8025 exposes the assertion API.
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # MINCRM-549: Download the pre-generated shard configs from e2e-timing-setup.
      # If the baseline was absent (e2e-timing-setup.outputs.baseline-exists == 'false'),
      # no artifact was uploaded and this step is skipped — the test run step falls back
      # to native --shard below.
      - name: Download shard config artifact (MINCRM-549)
        if: needs.e2e-timing-setup.outputs.baseline-exists == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-shard-configs-${{ github.run_id }}
          path: qa/e2e/

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('qa/package.json') }}

      - name: Install dependencies
        # @rollup/rollup-linux-x64-gnu is a platform-specific optional dep omitted from
        # the macOS-generated lockfile. Running npm install from within client/ bypasses
        # the root workspace lockfile and forces fresh resolution of platform-specific
        # optional binaries (npm workspace optional-deps bug).
        run: npm ci && npm install --prefix client

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run migrations on E2E database
        run: npm run migrate:fresh --workspace=minicrm-server
        env:
          DATABASE_URL: postgresql://minicrm:password@localhost:5432/minicrm_e2e
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-functional-secret
          NODE_ENV: test

      - name: Seed E2E admin user
        run: npm run seed:e2e-admin
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      # MINCRM-278: Create the test bucket using mc inside the running minio/minio
      # service container — no separate image pull, alias persists across commands.
      - name: Create MinIO test bucket
        run: |
          MINIO_ID=$(docker ps --filter "ancestor=minio/minio:latest" --format "{{.ID}}")
          docker exec "$MINIO_ID" mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec "$MINIO_ID" mc mb local/minicrm-test-bucket

      # MINCRM-278: Write MinIO storage config into system_settings so the server
      # finds a configured backend at startup — no manual admin setup required.
      - name: Seed E2E storage config
        run: npm run seed:e2e-storage
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          E2E_STORAGE_ENDPOINT: http://localhost:9000
          E2E_STORAGE_BUCKET: minicrm-test-bucket
          E2E_STORAGE_ACCESS_KEY_ID: minioadmin
          E2E_STORAGE_SECRET_ACCESS_KEY: minioadmin

      # MINCRM-306: Write Mailhog SMTP config into system_settings so the server
      # routes transactional email to Mailhog instead of a real SMTP server.
      - name: Seed E2E SMTP config
        run: npm run seed:e2e-smtp
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_SMTP_HOST: localhost
          E2E_SMTP_PORT: '1025'

      - name: Start application server
        run: npm run start --workspace=minicrm-server &
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          NODE_ENV: development
          PORT: 3001
          E2E: true
          # MINCRM-278: Required to decrypt the storage secret stored in system_settings.
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          # MINCRM-306: Used to construct invite and reset-password URLs in emails.
          APP_URL: http://localhost:5173
          # Coverage/TIA control API and session management routes are
          # registered only when these are 'true' at process boot
          # (MINCRM-663) — coverage-instrumentation.spec.ts/
          # coverage-sessions.spec.ts are NOT @serial (they no longer mutate
          # any shared feature-flag row), so they run in THIS sharded
          # functional job, not e2e-serial.
          COVERAGE_INSTRUMENTATION: "true"
          COVERAGE_SESSION_MANAGEMENT: "true"
          # Same, for the query/ingestion routers (MINCRM-685). Load-bearing in this
          # job specifically, in two ways: coverage-health.spec.ts's COVH-01 asserts
          # the health report's routers block equals
          # {pipeline: true, mapping: true, reporting: true}, which only holds because
          # these are set; and coverage-mapping.spec.ts/coverage-pipeline.spec.ts moved
          # into this job when MINCRM-685 dropped their @serial tags, so their calls to
          # /admin/coverage/mapping/* and /admin/coverage/pipeline/ingest now depend on
          # these too. Dropping any of them fails those specs, not just the routes.
          COVERAGE_MAPPING_QUERY: "true"
          COVERAGE_REPORTING_QUERY: "true"
          COVERAGE_PIPELINE_INGESTION: "true"

      - name: Start frontend dev server
        run: npm run dev --workspace=minicrm-client &
        env:
          API_URL: http://localhost:3001

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "API server did not start in time"; exit 1; fi
            sleep 2
          done
          echo "Waiting for frontend dev server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "Frontend server did not start in time"; exit 1; fi
            sleep 2
          done

      # globalSetup runs once per shard — each shard generates its own .auth/admin.json
      # independently via an API login. N concurrent globalSetup calls against the same
      # server are safe (no shared filesystem state between shard runners). MINCRM-217
      # MINCRM-549: When a timing baseline exists, each shard uses a pre-generated
      # playwright.shard.<N>.config.ts (0-indexed) from the e2e-timing-setup job, which
      # assigns spec files via LPT bin-packing. When the baseline is absent (first run on
      # a fresh branch), the fallback native --shard=K/N is used instead.
      - name: Run functional test suite (MINCRM-137, MINCRM-193, MINCRM-217, MINCRM-549, MINCRM-662)
        # MINCRM-324: Exclude visual-regression spec — it requires an isolated DB to
        # avoid pixel diffs caused by other shards' seeded data appearing on the board.
        # Visual tests run exclusively in the update-visual-snapshots job.
        # MINCRM-549: shard index in the matrix is 1-based; config filename is 0-based.
        # MINCRM-662: worker count comes from capacity-probe instead of a hardcoded flag.
        run: |
          SHARD_ZERO=$(( ${{ matrix.shard }} - 1 ))
          SHARD_CONFIG="qa/e2e/playwright.shard.${SHARD_ZERO}.config.ts"
          WORKERS=${{ needs.capacity-probe.outputs.workers }}
          if [ -f "$SHARD_CONFIG" ]; then
            echo "Using LPT shard config: $SHARD_CONFIG"
            npx playwright test \
              --config="$SHARD_CONFIG" \
              --project=${{ matrix.project }} \
              --workers="$WORKERS" \
              --grep @functional \
              --grep-invert "visual-regression|serial"
          else
            echo "::warning::LPT shard config not found — falling back to native --shard=${{ matrix.shard }}/${{ needs.capacity-probe.outputs.total-shards }}"
            npx playwright test \
              --config=qa/e2e/playwright.config.ts \
              --project=${{ matrix.project }} \
              --shard=${{ matrix.shard }}/${{ needs.capacity-probe.outputs.total-shards }} \
              --workers="$WORKERS" \
              --grep @functional \
              --grep-invert "visual-regression|serial" \
              qa/e2e/tests/apps/minicrm/functional/
          fi
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true
          # MINCRM-306: Mailhog HTTP API base URL for email delivery assertions.
          MAILHOG_URL: http://localhost:8025
          # MINCRM-322: activate the AI healing tier (requires MINCRM-309 intent strings to produce heals)
          AI_HEALING: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Conservative threshold for initial activation — >20 AI heals signals broad selector drift
          AI_HEAL_COST_WARNING_THRESHOLD: '20'

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            qa/e2e/test-results/results.xml
            qa/e2e/test-results/results.json
            qa/e2e/test-results/healing-shard*.json
            qa/e2e/test-results/healing-suggestions.md
            qa/e2e/blob-report/
            qa/e2e/test-timing.jsonl
          retention-days: 7

      # MINCRM-604/606: no-op unless a shard explicitly sets COVERAGE_INSTRUMENTATION=true
      # in the "Start application server" step above — not enabled on the default matrix,
      # so this never changes existing shard timing/behavior. if-no-files-found:warn
      # matches the "Upload shard artifacts" step's convention above.
      - name: Upload coverage dump artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-dumps-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}
          path: server/coverage-dumps/**
          retention-days: 7
          if-no-files-found: warn

      - name: Publish results to GitHub Checks (MINCRM-135)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright – ${{ matrix.project }} (functional)
          path: qa/e2e/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Log heal count from report (MINCRM-135)
        if: always()
        run: |
          REPORT=test-results/healing-report.json
          if [ -f "$REPORT" ]; then
            TOTAL=$(node -e "const r=require('./$REPORT'); console.log(r.totalHeals ?? r.total ?? 0)")
            AI=$(node -e "const r=require('./$REPORT'); console.log(r.aiHeals ?? 0)")
            echo "Heal events this run: total=$TOTAL ai=$AI"
            if [ "$AI" -gt 0 ]; then
              echo "::warning::$AI AI heal(s) occurred — check healing-report.json for details"
            fi
          else
            echo "healing-report.json not found (zero heals or reporter did not run)"
          fi

      - name: Check for healing report artifact (MINCRM-149)
        id: healing-check
        if: always()
        run: |
          REPORT=test-results/healing-report.json
          if [ -f "$REPORT" ] && [ -s "$REPORT" ]; then
            TOTAL=$(node -e "const r=require('./$REPORT'); console.log(r.totalHeals ?? r.total ?? 0)")
            if [ "$TOTAL" -gt 0 ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload healing report artifact (MINCRM-149)
        if: always() && steps.healing-check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: healing-report-functional-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_id }}
          path: test-results/healing-report.json
          retention-days: 14

      - name: Debug instructions
        if: failure()
        run: |
          echo "--------------------------------------------"
          echo "Tests failed. To view traces:"
          echo "  1. Download the 'playwright-artifacts-functional-${{ matrix.project }}-${{ github.run_id }}' CI artifact"
          echo "  2. Run: npx playwright show-trace path/to/trace.zip"
          echo "  3. Or open the HTML report: npx playwright show-report path/to/playwright-report"
          echo "--------------------------------------------"

      - name: Upload Playwright artifacts
        if: always()
        # continue-on-error: artifact uploads can fail under rate limiting or storage
        # quota when many shards upload large trace/video directories simultaneously.
        # This upload is for human debugging only — the results.xml upload above is
        # what matters for CI reporting, and it is a separate step.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-functional-${{ matrix.project }}-${{ github.run_id }}
          path: |
            qa/e2e/test-results/
            qa/e2e/playwright-report/
            test-results/
          retention-days: 14

  # MINCRM-237: Sentinel job — single named status check for branch protection.
  # GitHub aggregates needs.e2e-functional.result across all matrix permutations
  # (2 projects x however many shards capacity-probe computed, MINCRM-662):
  # if any shard fails or is cancelled, the result is not "success" and this job
  # exits 1. Branch protection would require "Phase 3 - E2E All Shards Passed" by
  # name rather than enumerating each individual shard check name (main has no
  # branch protection configured today — this job exists so that rule can be
  # added later without listing every shard).
  e2e-all-shards-passed:
    name: Phase 3 - E2E All Shards Passed
    needs: e2e-functional
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          result="${{ needs.e2e-functional.result }}"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            echo "One or more E2E shards failed or were cancelled."
            exit 1
          fi
          echo "E2E shards passed or were skipped (result: $result)."

  # MINCRM-549: Serial E2E job for tests that mutate shared global state and cannot
  # safely run concurrently with the sharded matrix. Tests tagged @serial are excluded
  # from e2e-functional (--grep-invert serial) and run here.
  # MINCRM-661: within this job, @serial files are partitioned into conflict-free
  # groups (qa/e2e/scripts/gen-conflict-group-configs.ts, driven by
  # qa/e2e/apps/minicrm/resource-registry.ts) and run as sequential invocations —
  # groups never overlap in wall-clock time, so two files that touch the same
  # resource never touch the database concurrently, but unrelated files can share
  # up to 2 workers within their own group. See docs/dev/e2e-authoring.md.
  e2e-serial:
    name: Phase 3 - E2E Serial (global-state tests)
    # MINCRM-658: runs after e2e-functional's 8 shard jobs finish rather than
    # concurrently with them. Previously e2e-serial had no dependency on
    # e2e-functional and ran alongside all 8 shards, which meant 9 jobs
    # simultaneously spinning up their own Postgres/MinIO/Mailhog/Playwright on
    # GitHub's shared runners — confirmed (via repeated historical CI failures
    # with an identical signature, and a clean local repro of the full serial
    # suite at full test volume with no timing degradation) to cause
    # intermittent resource-contention timeouts in the serial job's UI-timing
    # assertions, which have no sharding to spread load. Trades ~10 min of
    # added wall-clock time (waiting for shards) for removing that contention.
    needs: [server-tests, client-tests, changes, e2e-functional]
    if: |
      always() &&
      (needs.server-tests.result == 'success' || needs.server-tests.result == 'skipped') &&
      (needs.client-tests.result == 'success' || needs.client-tests.result == 'skipped') &&
      (needs.e2e-functional.result == 'success' || needs.e2e-functional.result == 'skipped' || needs.e2e-functional.result == 'failure') &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.qa == 'true')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        command: server /data --console-address :9001

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('qa/package.json') }}

      - name: Install dependencies
        run: npm ci && npm install --prefix client

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run migrations on E2E database
        run: npm run migrate:fresh --workspace=minicrm-server
        env:
          DATABASE_URL: postgresql://minicrm:password@localhost:5432/minicrm_e2e
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-functional-secret
          NODE_ENV: test

      - name: Seed E2E admin user
        run: npm run seed:e2e-admin
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Create MinIO test bucket
        run: |
          MINIO_ID=$(docker ps --filter "ancestor=minio/minio:latest" --format "{{.ID}}")
          docker exec "$MINIO_ID" mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec "$MINIO_ID" mc mb local/minicrm-test-bucket

      - name: Seed E2E storage config
        run: npm run seed:e2e-storage
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          E2E_STORAGE_ENDPOINT: http://localhost:9000
          E2E_STORAGE_BUCKET: minicrm-test-bucket
          E2E_STORAGE_ACCESS_KEY_ID: minioadmin
          E2E_STORAGE_SECRET_ACCESS_KEY: minioadmin

      - name: Seed E2E SMTP config
        run: npm run seed:e2e-smtp
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_SMTP_HOST: localhost
          E2E_SMTP_PORT: '1025'

      - name: Start application server
        run: npm run start --workspace=minicrm-server &
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          NODE_ENV: development
          PORT: 3001
          E2E: true
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          APP_URL: http://localhost:5173
          # Coverage/TIA control API and session management routes are
          # registered only when these are 'true' at process boot
          # (MINCRM-663, MINCRM-685). No @serial spec depends on these any more:
          # coverage-instrumentation/coverage-sessions moved off @serial earlier,
          # and MINCRM-685 moved coverage-mapping/coverage-pipeline too, after an
          # audit of all 25 @serial specs confirmed none of the rest reads a
          # coverage route or the coverage database.
          #
          # The first two are NOT optional regardless: apps/minicrm/fixtures.ts
          # calls startCoverageSession and POST /admin/coverage/dump for EVERY
          # test (E2E_COVERAGE_PER_TEST defaults on, and nothing here sets
          # E2E_COVERAGE_GRANULARITY). Those calls are .catch()-swallowed, so
          # removing the vars would not fail a test — it would silently blank
          # per-test coverage attribution, which is worse.
          #
          # The other three are KEPT deliberately too. ci.yml has already been
          # burned once here:
          # a prior fix removed these vars assuming no @serial spec needed them,
          # having checked only the two specs it was editing, and CI failed with
          # 404s on COVM-01/COVP-01. The cost of keeping five env vars on a job
          # that may not need them is zero; the cost of being wrong is a red
          # build whose cause is a 404 three layers from the change. Remove them
          # only alongside a fresh audit, not on the strength of this comment.
          COVERAGE_INSTRUMENTATION: "true"
          COVERAGE_SESSION_MANAGEMENT: "true"
          COVERAGE_MAPPING_QUERY: "true"
          COVERAGE_REPORTING_QUERY: "true"
          COVERAGE_PIPELINE_INGESTION: "true"

      - name: Start frontend dev server
        run: npm run dev --workspace=minicrm-client &
        env:
          API_URL: http://localhost:3001

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "API server did not start in time"; exit 1; fi
            sleep 2
          done
          echo "Waiting for frontend dev server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "Frontend server did not start in time"; exit 1; fi
            sleep 2
          done

      - name: Generate conflict-free group configs (MINCRM-661)
        run: npx tsx qa/e2e/scripts/gen-conflict-group-configs.ts

      # MINCRM-661: Replaces the single --workers=1 invocation over every @serial
      # file with N sequential invocations, one per conflict-free group. Groups
      # run one after another (process-level separation — the only reliable way
      # to guarantee two conflicting files never overlap; see conflict-graph.ts
      # and gen-conflict-group-configs.ts module docs), but each group internally
      # uses up to 2 workers since no two files within a conflict-free group touch
      # the same resource. Each group writes its own JUnit XML (via
      # PLAYWRIGHT_JUNIT_OUTPUT_FILE); merged into the final results.xml below.
      - name: Run serial functional tests (MINCRM-549, MINCRM-661)
        run: |
          if [ ! -f qa/e2e/playwright.serial-groups.json ]; then
            echo "::warning::No conflict-group manifest generated — falling back to the single blanket invocation."
            # NOT creating serial-groups/ here is deliberate: the merge step below
            # uses that directory's existence to distinguish "groups ran" (merge
            # their per-group XML files) from "fallback ran" (results.xml was
            # already written directly by this invocation, nothing to merge).
            # Creating it unconditionally previously broke that check — the merge
            # step saw an always-existing-but-empty directory on the fallback path
            # and failed with "no group XML files found" even though the fallback
            # had already succeeded.
            npx playwright test \
              --config=qa/e2e/playwright.config.ts \
              --project=desktop \
              --workers=1 \
              --grep "@functional.*@serial|@serial.*@functional"
            exit $?
          fi
          mkdir -p qa/e2e/test-results/serial-groups
          exit_code=0
          # Single jq pass over the manifest (index, configPath, workers as TSV)
          # instead of re-reading/re-parsing the JSON file once per field per group.
          while IFS=$'\t' read -r i config_path workers; do
            echo "::group::Running serial-group $i ($config_path, $workers worker(s))"
            # SHARD_INDEX namespaces this invocation's healing-*.json worker files
            # (healing-shard${i}-worker*.json) so they don't collide with the next
            # sequential group's own worker-0/1 files in the shared test-results/ dir.
            # PLAYWRIGHT_JUNIT_OUTPUT_FILE (not ...OUTPUT_NAME) is the env var
            # Playwright's junit reporter actually checks BEFORE the config's own
            # `outputFile` — see resolveOutputFile() in playwright's runner: an
            # explicit `outputFile` in playwright.config.ts (as this repo sets)
            # always wins over ...OUTPUT_NAME, since OUTPUT_NAME is only consulted
            # when neither the env var nor `options.outputFile` resolved anything.
            # --output gives each group its OWN artifacts directory: every
            # `playwright test` invocation unconditionally clears its outputDir at
            # startup (createRemoveOutputDirsTask in Playwright's runner, no public
            # flag to disable it) — without per-group --output, group N+1 wipes the
            # entire shared qa/e2e/test-results/ tree, deleting group N's just-written
            # serial-groups/group-N.xml before the merge step ever runs. The JUnit
            # file itself is written as a SIBLING of these scoped artifact dirs (not
            # nested inside any of them), so no group's own clear-output step touches it.
            PLAYWRIGHT_JUNIT_OUTPUT_FILE="qa/e2e/test-results/serial-groups/group-${i}.xml" \
            SHARD_INDEX="$i" \
              npx playwright test \
                --config="$config_path" \
                --project=desktop \
                --workers="$workers" \
                --output="qa/e2e/test-results/serial-groups/group-${i}-artifacts" \
                --grep "@functional.*@serial|@serial.*@functional" || exit_code=$?
            echo "::endgroup::"
          done < <(jq -r '.[] | [.groupIndex, .configPath, .workers] | @tsv' qa/e2e/playwright.serial-groups.json)
          exit "$exit_code"
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true
          MAILHOG_URL: http://localhost:8025
          AI_HEALING: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_HEAL_COST_WARNING_THRESHOLD: '20'

      # MINCRM-689: the merge moved to the unit-tested
      # qa/scripts/merge-junit-results.ts. The inline version it replaces
      # truncated suites on embedded CDATA and emitted an attribute-less root —
      # see that module's docblock for the full defect description rather than
      # duplicating it here.
      #
      # What stays here is caller-specific policy, not merge logic: the
      # serial-groups directory check and the group-count expectation.
      #
      # --allow-empty-inputs IS passed, deliberately. Playwright writes a
      # zero-`<testsuite>` document whenever a group matches no tests or its
      # globalSetup throws — verified against this repo's own config. Treating
      # that as fatal would make one transient group failure discard the results
      # of every other group AND write no results.xml at all, blanking the
      # GitHub Check, the uploaded artifact, and the PR-comment row (the same
      # blackout MINCRM-658, below, exists to prevent). A group that fails is
      # already reported loudly by the run step's own propagated exit code, so
      # the merge step does not need to be the detector; its job is to preserve
      # whatever did run.
      - name: Merge conflict-group JUnit XML results (MINCRM-661, MINCRM-689)
        if: always()
        run: |
          if [ ! -d qa/e2e/test-results/serial-groups ]; then
            echo "No serial-groups directory — single blanket invocation already wrote results.xml directly."
            exit 0
          fi

          # -maxdepth 1 with an explicit group-*.xml name: the run step writes
          # each group's JUnit as serial-groups/group-N.xml but ALSO creates
          # serial-groups/group-N-artifacts/ dirs (--output). A bare
          # `-name "*.xml"` descends into those and would feed attachment XML to
          # the merger as if it were a results document.
          #
          # `set --` rather than `mapfile`: mapfile is a bash 4+ builtin, so the
          # whole block would be untestable on a macOS dev machine (bash 3.2)
          # even though it works on ubuntu-latest. Group filenames are
          # group-<int>.xml, so word splitting is safe here.
          # shellcheck disable=SC2046
          set -- $(find qa/e2e/test-results/serial-groups -maxdepth 1 -name 'group-*.xml' | sort -V)

          if [ "$#" -eq 0 ]; then
            echo "::error::No group JUnit XML files found — all groups failed before Playwright ran."
            exit 1
          fi

          # --expected-files guards against a group file that went MISSING, not
          # against a group whose tests failed. Verified against the installed
          # Playwright, since the distinction decides whether this is safe:
          #
          #   - matched no tests        → writes <testsuites tests="0"> (no
          #                               <testsuite> children)
          #   - globalSetup threw       → same zero-<testsuite> document
          #   - config failed to load   → writes NOTHING
          #
          # The first two are what --allow-empty-inputs absorbs, so a group whose
          # login or onboarding call failed does not discard the other groups'
          # results; its own non-zero exit from the run step is the report. Only
          # the third loses a file — that, and the per-group `--output` wipe
          # documented in the "Run serial functional tests" step above, are what a
          # count assertion could catch here.
          #
          # MERGE FIRST, THEN FAIL. A shortfall must not abort before the merge:
          # that writes no results.xml at all, blanking the GitHub Check below,
          # the uploaded artifact and the PR comment's serial row for EVERY group
          # when only one was lost — the blackout the MINCRM-658 comment in the
          # "Upload serial failure diagnostics" step records having been fixed
          # once already. But it must still fail the job, because the run step's
          # exit code only propagates TEST failures: a group whose XML was
          # overwritten while all its tests passed leaves exit_code=0, so without
          # the exit below a green run could ship silently incomplete results —
          # precisely the defect class this ticket closes. So the shortfall is
          # recorded, the merge runs over what survived, and the step exits
          # non-zero afterwards. Every downstream consumer is `if: always()`, so
          # failing here costs no reporting.
          if [ -f qa/e2e/playwright.serial-groups.json ]; then
            EXPECTED_GROUPS=$(jq 'length' qa/e2e/playwright.serial-groups.json)
          else
            EXPECTED_GROUPS=0
          fi

          # `jq length` also yields 0 for `null` or `[]`, so this one branch
          # covers a missing, empty and malformed-but-parseable manifest alike.
          GROUP_SHORTFALL=0
          if [ "$EXPECTED_GROUPS" -gt 0 ] && [ "$#" -lt "$EXPECTED_GROUPS" ]; then
            echo "::error::Only $#/$EXPECTED_GROUPS conflict-group JUnit files found — a group produced no output (config load failure) or its XML was overwritten. Merging the $# file(s) that survived, then failing this step."
            GROUP_SHORTFALL=1
          fi

          npx tsx qa/scripts/merge-junit-results.ts \
            --output qa/e2e/test-results/results.xml \
            --allow-empty-inputs \
            "$@"

          if [ "$GROUP_SHORTFALL" -eq 1 ]; then
            exit 1
          fi

      - name: Publish serial results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright – serial (functional)
          path: qa/e2e/test-results/results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload serial test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-results
          path: |
            qa/e2e/test-results/results.xml
            qa/e2e/test-results/results.json
            qa/e2e/test-results/healing-shard*.json
            qa/e2e/test-results/healing-suggestions.md
          retention-days: 14
          if-no-files-found: warn

      # MINCRM-658: separate step so results.xml/results.json above keep their
      # flat archive layout (upload-artifact derives the archive root from the
      # common ancestor of ALL globs in one call — mixing in nested test-results/**
      # patterns here previously pushed results.xml down into a test-results/
      # subfolder in the zip, breaking e2e-functional-report's expected flat
      # artifacts/serial/results.xml download path and making the PR comment's
      # "serial (desktop)" row always show "❓ Unknown, 0/0/0" even on a passing run).
      - name: Upload serial failure diagnostics (screenshots/video/trace)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-diagnostics
          path: |
            qa/e2e/test-results/**/trace.zip
            qa/e2e/test-results/**/test-failed-*.png
            qa/e2e/test-results/**/video.webm
            qa/e2e/test-results/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore

      # qa/e2e/test-timing.jsonl sits one level up from qa/e2e/test-results/ —
      # mixing it into the results-artifact glob above reintroduces the exact
      # MINCRM-658 bug (a shallower sibling path widens the common ancestor,
      # pushing results.xml down a directory). Uploaded separately so the
      # results artifact's archive root stays flat.
      - name: Upload serial test timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-timing
          path: qa/e2e/test-timing.jsonl
          retention-days: 14
          if-no-files-found: warn

  # MINCRM-218: Aggregation job runs after all 8 e2e-functional shard jobs complete.
  # Job dependency chain:
  #   Phase 2 → e2e-functional (8 shard jobs) → e2e-aggregate (2 jobs) → e2e-functional-report
  e2e-aggregate:
    name: Phase 3 - Aggregate E2E Results (${{ matrix.project }})
    needs: [e2e-functional, changes, capacity-probe]
    # always() is required because e2e-functional itself uses always() to run when its
    # upstream deps (server-tests, client-tests) were skipped. GitHub records e2e-functional's
    # combined matrix result as 'skipped' from the perspective of downstream jobs in that
    # situation, so a plain result == 'success' check here would never match.
    # The path gate mirrors e2e-functional exactly: only run when there are code changes
    # that actually triggered E2E. Without this, aggregate runs on docs-only PRs where
    # e2e-functional was skipped (result == 'skipped'), producing spurious job runs.
    if: |
      always() &&
      needs.e2e-functional.result != 'cancelled' &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.qa == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile-web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('qa/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-${{ matrix.project }}-*
          path: ./shard-artifacts

      - name: Collect blob reports into flat directory
        run: |
          mkdir -p ./blob-report
          find ./shard-artifacts -name "*.zip" -path "*/blob-report/*" -exec cp {} ./blob-report/ \;
          echo "Blob zips collected: $(find ./blob-report -maxdepth 1 -type f | wc -l)"

      - name: Merge Playwright reports
        run: >
          npx playwright merge-reports
          --reporter html
          ./blob-report

      # MINCRM-689: the merge moved to the unit-tested
      # qa/scripts/merge-junit-results.ts — see its docblock for the defects it
      # fixes and for why --allow-empty-inputs is passed.
      #
      # The MINCRM-662 shard-completeness guard is preserved, not dropped: it
      # moves into --expected-files, which fails on the same "fewer files than
      # shards" condition for the same reason.
      - name: Merge JUnit XML results (MINCRM-689)
        env:
          # MINCRM-662: sourced from capacity-probe instead of a hardcoded constant.
          EXPECTED_SHARDS: ${{ needs.capacity-probe.outputs.total-shards }}
        run: |
          # No -maxdepth bound is needed here, unlike the serial site with its
          # nested per-group artifact dirs: the "Upload shard test artifacts" step
          # puts one results.xml per shard artifact, and the only nested content
          # (blob-report/) holds .zip files exclusively. Adding a second
          # results.xml to that upload would silently feed this merge.
          # shellcheck disable=SC2046
          set -- $(find ./shard-artifacts -name 'results.xml' | sort -V)

          if [ "$#" -eq 0 ]; then
            echo "::error::No results.xml files found — all shards failed before Playwright ran."
            exit 1
          fi

          # This job runs under `if: always()`, so it also executes when
          # capacity-probe failed — in which case total-shards is the empty
          # string. The inline version this replaces did `parseInt('')` → NaN and
          # `files.length < NaN` → false, silently skipping the guard but still
          # writing the merged file. Passing "" straight through to the merger
          # would instead abort it, leaving no merged-results.xml.
          if printf '%s' "$EXPECTED_SHARDS" | grep -Eq '^[0-9]+$'; then
            EXPECTED_FILES="$EXPECTED_SHARDS"
          else
            echo "::warning::capacity-probe produced no total-shards value — cannot assert shard completeness, falling back to the number of files present."
            EXPECTED_FILES="$#"
          fi

          # MERGE FIRST, THEN FAIL — same rule as the serial merge step, and for
          # the same reason. The MINCRM-662 hard failure on a missing shard is
          # preserved, but it must not cost the report: passing --expected-files to
          # the merger would abort before anything is written, leaving no
          # merged-results.xml and blanking two GitHub Checks plus both
          # PR-comment rows. So the shortfall is asserted here, the merge runs over
          # what survived, and the step exits non-zero afterwards.
          SHARD_SHORTFALL=0
          if [ "$#" -lt "$EXPECTED_FILES" ]; then
            echo "::error::Only $#/$EXPECTED_FILES shard results.xml files found. Some shards failed before Playwright ran and produced no output. Merging the $# file(s) that survived, then failing this step to prevent a partial green result from masking real failures."
            SHARD_SHORTFALL=1
          fi

          npx tsx qa/scripts/merge-junit-results.ts \
            --output merged-results.xml \
            --allow-empty-inputs \
            "$@"

          if [ "$SHARD_SHORTFALL" -eq 1 ]; then
            exit 1
          fi

      - name: Merge JSON results and count flaky tests (MINCRM-355)
        if: always()
        id: flaky
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, writeFileSync, existsSync } from 'fs';
          import { execSync } from 'child_process';
          import { appendFileSync } from 'fs';

          const files = execSync(
            'find ./shard-artifacts -name "results.json" 2>/dev/null || true'
          ).toString().trim().split('\n').filter(Boolean);

          let flaky = 0;
          const flakyNames = [];

          for (const f of files) {
            if (!existsSync(f)) continue;
            let report;
            try { report = JSON.parse(readFileSync(f, 'utf8')); } catch { continue; }
            const suites = report.suites ?? [];
            const walk = (items) => {
              for (const item of items ?? []) {
                if (item.specs) {
                  for (const spec of item.specs ?? []) {
                    for (const test of spec.tests ?? []) {
                      if (test.status === 'flaky') {
                        flaky++;
                        flakyNames.push(spec.title);
                      }
                    }
                  }
                }
                if (item.suites) walk(item.suites);
              }
            };
            walk(suites);
          }

          const output = `flaky_count=${flaky}\nflaky_names=${JSON.stringify(flakyNames)}`;
          appendFileSync(process.env.GITHUB_OUTPUT, output + '\n');
          writeFileSync('flaky-report-${{ matrix.project }}.json', JSON.stringify({ flaky, flakyNames }, null, 2));
          console.log(`Flaky tests this run: ${flaky}`);
          if (flakyNames.length) console.log(flakyNames.map(n => '  - ' + n).join('\n'));
          EOF

      - name: Merge healing artifacts
        if: always()
        run: >
          npx tsx qa/scripts/merge-healing-artifacts.ts
          --input ./shard-artifacts
          --output ./healing-report-${{ matrix.project }}.json

      - name: Collect patch suggestions from shards
        if: always()
        run: |
          # Concatenate healing-suggestions.md files from all shards.
          # If every shard reported "No heal events this run.", collapse to one line.
          # MINCRM-225
          SUGGESTIONS_OUT="healing-suggestions-${{ matrix.project }}.md"
          mapfile -t SUGGESTION_FILES < <(find ./shard-artifacts -name "healing-suggestions.md" 2>/dev/null | sort)
          if [ "${#SUGGESTION_FILES[@]}" -eq 0 ]; then
            echo "No heal events this run." > "$SUGGESTIONS_OUT"
          else
            # Strip "No heal events" placeholder lines; keep real content.
            REAL_CONTENT=$(cat "${SUGGESTION_FILES[@]}" | grep -v "^No heal events this run\.$" | grep -v "^$" || true)
            if [ -z "$REAL_CONTENT" ]; then
              echo "No heal events this run." > "$SUGGESTIONS_OUT"
            else
              {
                echo "# Healing Patch Suggestions"
                echo ""
                # Extract suggestion bodies (lines after the # headings).
                cat "${SUGGESTION_FILES[@]}" | grep -v "^No heal events this run\.$" | grep -v "^# Healing Patch Suggestions$"
              } > "$SUGGESTIONS_OUT"
            fi
          fi
          echo "Suggestions written to $SUGGESTIONS_OUT"
          cat "$SUGGESTIONS_OUT"

      # Posted BEFORE the shard-failure gate below, so a per-project result is
      # visible as soon as this project's shards are merged.
      #
      # The combined comment (e2e-functional-report) needs e2e-serial, which runs
      # after the whole functional matrix — so on a red functional run the
      # combined comment was blocked for ~30 minutes while the placeholder said
      # only "in progress…". A reader checking why CI is red got nothing, at the
      # one moment the results mattered most. This interim comment closes that
      # window; the combined one still overwrites it with the fuller table
      # (functional + serial + evals) when it lands.
      #
      # Its own sticky header, so it never races the combined comment for the
      # same slot. (MINCRM-695, MINCRM-696)
      - name: Post interim per-project functional results
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-results-${{ matrix.project }}
          message: |
            ## Functional Test Results — `${{ matrix.project }}` (interim)

            **Shards**: ${{ needs.e2e-functional.result }} · **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Merged results for this project are attached as the
            `e2e-merged-${{ matrix.project }}` artifact. The combined table
            (functional + serial + AI evals) replaces the summary comment above
            once `e2e-serial` finishes.

      - name: Check for shard failures
        if: always()
        run: |
          # Exit non-zero if any shard of this project failed, so this job
          # blocks PR merge correctly even though it runs with if: always()
          if [[ "${{ needs.e2e-functional.result }}" == "failure" ]]; then
            echo "One or more shards failed."
            exit 1
          fi

      - name: Enforce flaky test gate (MINCRM-355, MINCRM-554)
        if: always()
        run: |
          REPORT="flaky-report-${{ matrix.project }}.json"
          if [ -f "$REPORT" ]; then
            COUNT=$(node -e "const r=require('./$REPORT'); console.log(r.flaky ?? 0)")
            echo "Flaky test count for ${{ matrix.project }}: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::Flaky test count ($COUNT) exceeds threshold of 0 for project ${{ matrix.project }}. Zero flaky tests are allowed — retries are disabled (MINCRM-554). Fix the non-determinism before merging."
              exit 1
            fi
          fi

      - name: Publish merged results to GitHub Checks
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright – ${{ matrix.project }} (all shards)
          path: merged-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload merged artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-merged-${{ matrix.project }}
          path: |
            merged-results.xml
            playwright-report/
            healing-report-${{ matrix.project }}.json
            healing-suggestions-${{ matrix.project }}.md
            flaky-report-${{ matrix.project }}.json
          retention-days: 30
          if-no-files-found: warn

  e2e-functional-report:
    name: Phase 3 - E2E Functional — Report
    # MINCRM-218: Depends on e2e-aggregate (not e2e-functional directly) so that
    # the PR comment is built from merged outputs covering all shards.
    # Job dependency chain:
    #   Phase 2 → e2e-functional (8 shard jobs) → e2e-aggregate (2 jobs) → e2e-functional-report
    #                                            → e2e-serial ────────────┘
    needs: [e2e-aggregate, e2e-serial, ai-evals]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.e2e-aggregate.result == 'success' || needs.e2e-aggregate.result == 'failure' ||
       needs.e2e-serial.result == 'success' || needs.e2e-serial.result == 'failure') &&
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop merged artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-merged-desktop
          path: artifacts/desktop

      - name: Download mobile-web merged artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-merged-mobile-web
          path: artifacts/mobile-web

      - name: Download serial test artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-serial-results
          path: artifacts/serial

      - name: Download AI eval artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: eval-results-${{ github.run_number }}
          path: artifacts/ai-evals

      - name: Build combined PR comment (MINCRM-135)
        id: comment
        env:
          # github.head_ref is attacker-controllable (a PR's branch name) —
          # passed through an env var per actionlint's own guidance, never
          # interpolated directly into the shell script via ${{ }}.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          DESKTOP=$(python3 .github/scripts/parse-junit.py summary artifacts/desktop/merged-results.xml)
          MOBILE=$(python3 .github/scripts/parse-junit.py summary artifacts/mobile-web/merged-results.xml)
          SERIAL=$(python3 .github/scripts/parse-junit.py summary artifacts/serial/results.xml)
          EVAL_INTENT=$(python3 .github/scripts/parse-junit.py summary-promptfoo artifacts/ai-evals/nli-intent.json)
          EVAL_SEMANTIC=$(python3 .github/scripts/parse-junit.py summary-promptfoo artifacts/ai-evals/nli-semantic.json)
          EVAL_RBAC=$(python3 .github/scripts/parse-junit.py summary-promptfoo artifacts/ai-evals/nli-rbac.json)
          EVAL_PII=$(python3 .github/scripts/parse-junit.py summary-promptfoo artifacts/ai-evals/nli-pii.json)
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          IFS='|' read -r d_status d_tests d_passed d_failed d_skipped <<< "$DESKTOP"
          IFS='|' read -r m_status m_tests m_passed m_failed m_skipped <<< "$MOBILE"
          IFS='|' read -r s_status s_tests s_passed s_failed s_skipped <<< "$SERIAL"
          IFS='|' read -r ei_status ei_tests ei_passed ei_failed ei_errors <<< "$EVAL_INTENT"
          IFS='|' read -r es_status es_tests es_passed es_failed es_errors <<< "$EVAL_SEMANTIC"
          IFS='|' read -r er_status er_tests er_passed er_failed er_errors <<< "$EVAL_RBAC"
          IFS='|' read -r ep_status ep_tests ep_passed ep_failed ep_errors <<< "$EVAL_PII"

          HEAL_NOTE=""
          HEAL_LINK=""
          AI_HEAL_LINE=""
          SUGGESTIONS_BODY=""
          TOTAL_FLAKY=0
          FLAKY_SECTION=""
          for project in desktop mobile-web; do
            FLAKY_REPORT="artifacts/$project/flaky-report-$project.json"
            if [ -f "$FLAKY_REPORT" ]; then
              COUNT=$(node -e "const r=require('./$FLAKY_REPORT'); console.log(r.flaky ?? 0)")
              TOTAL_FLAKY=$((TOTAL_FLAKY + COUNT))
              if [ "$COUNT" -gt 0 ]; then
                NAMES=$(node -e "const r=require('./$FLAKY_REPORT'); (r.flakyNames??[]).forEach(n=>console.log('  - '+n))")
                FLAKY_SECTION="${FLAKY_SECTION}\n**${project}** (${COUNT} flaky):\n${NAMES}"
              fi
            fi
          done
          for project in desktop mobile-web; do
            dir="artifacts/$project"
            REPORT="$dir/healing-report-$project.json"
            if [ -f "$REPORT" ]; then
              TOTAL=$(node -e "const r=require('./$REPORT'); console.log(r.totalHeals ?? r.total ?? 0)")
              if [ "$TOTAL" -gt 0 ]; then
                HEAL_NOTE="> ⚕️ $TOTAL selector(s) self-healed this run — review \`healing-report.json\` in artifacts"
                HEAL_LINK="[📋 Download healing report]($ARTIFACTS_URL#artifacts)"
              fi
              AI_COUNT=$(node -e "const r=require('./$REPORT'); console.log(r.aiHealCount ?? 0)")
              if [ "$AI_COUNT" -gt 0 ]; then
                TOKEN_COST=$(node -e "const r=require('./$REPORT'); console.log(r.estimatedTokenCost ?? 0)")
                AI_HEAL_LINE="AI heals: $AI_COUNT (~$TOKEN_COST tokens)"
              fi
            fi
            SUGGESTIONS="$dir/healing-suggestions-$project.md"
            if [ -f "$SUGGESTIONS" ]; then
              CONTENT=$(cat "$SUGGESTIONS")
              if [ "$CONTENT" != "No heal events this run." ]; then
                SECTION=$(printf '\n### Patch Suggestions (%s)\n\n%s' "$project" "$CONTENT")
                SUGGESTIONS_BODY="${SUGGESTIONS_BODY}${SECTION}"
              fi
            fi
          done

          build_summary() {
            echo "## Functional Test Results"
            echo ""
            echo "**Branch**: \`$BRANCH_NAME\` · **Commit**: \`$(echo "${{ github.sha }}" | cut -c1-7)\` · **Run**: [${{ github.run_id }}]($ARTIFACTS_URL) · **Started**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Project | Status | Tests | Passed | Failed | Skipped |"
            echo "|---------|--------|-------|--------|--------|---------|"
            echo "| desktop | $d_status | $d_tests | $d_passed | $d_failed | $d_skipped |"
            echo "| mobile-web | $m_status | $m_tests | $m_passed | $m_failed | $m_skipped |"
            echo "| serial (desktop) | $s_status | $s_tests | $s_passed | $s_failed | $s_skipped |"
            echo ""
            echo "### AI Evals (Promptfoo)"
            echo ""
            echo "| Suite | Status | Tests | Passed | Failed | Errors |"
            echo "|-------|--------|-------|--------|--------|--------|"
            echo "| nli-intent | $ei_status | $ei_tests | $ei_passed | $ei_failed | $ei_errors |"
            echo "| nli-semantic | $es_status | $es_tests | $es_passed | $es_failed | $es_errors |"
            echo "| nli-rbac | $er_status | $er_tests | $er_passed | $er_failed | $er_errors |"
            echo "| nli-pii | $ep_status | $ep_tests | $ep_passed | $ep_failed | $ep_errors |"
            if [ -n "$HEAL_NOTE" ]; then
              echo ""
              echo "$HEAL_NOTE"
              if [ -n "$AI_HEAL_LINE" ]; then
                echo "$AI_HEAL_LINE"
              fi
            fi
            echo ""
            echo "[Download trace artifacts]($ARTIFACTS_URL)"
            if [ -n "$HEAL_LINK" ]; then
              echo "$HEAL_LINK"
            fi
            # Append per-project failure details when any tests failed.
            if [ "$d_failed" -gt 0 ] 2>/dev/null; then
              python3 .github/scripts/parse-junit.py failures artifacts/desktop/merged-results.xml desktop
            fi
            if [ "$m_failed" -gt 0 ] 2>/dev/null; then
              python3 .github/scripts/parse-junit.py failures artifacts/mobile-web/merged-results.xml mobile-web
            fi
            if [ "$s_failed" -gt 0 ] 2>/dev/null; then
              python3 .github/scripts/parse-junit.py failures artifacts/serial/results.xml "serial (desktop)"
            fi
            # Flaky test report (MINCRM-355)
            if [ "$TOTAL_FLAKY" -gt 0 ]; then
              echo ""
              echo "---"
              echo ""
              echo "## ⚠️ Flaky Tests Detected"
              echo ""
              echo "> $TOTAL_FLAKY test(s) required a retry to pass this run."
              echo "> Fix these before they mask real failures."
              printf '%b\n' "$FLAKY_SECTION"
              echo ""
              echo "> ❌ Flaky count exceeds threshold (0) — \`ci-gate\` will fail. Retries are disabled (MINCRM-554); fix the non-determinism."
            fi
            if [ -n "$SUGGESTIONS_BODY" ]; then
              echo ""
              echo "---"
              echo ""
              echo "## Self-Healing Patch Suggestions"
              echo ""
              echo "$SUGGESTIONS_BODY"
            fi
          }

          # Write body to a file to avoid ARG_MAX when the failure list is large.
          build_summary > /tmp/e2e-comment-body.md

          # MINCRM-332: Also write to job summary so the merged pass/fail table
          # is visible in the Actions workflow run summary tab.
          cat /tmp/e2e-comment-body.md >> "$GITHUB_STEP_SUMMARY"

      # always(): without it a failure in any earlier step of this job — a
      # missing artifact, a parse error — leaves the sticky comment showing the
      # "in progress…" placeholder posted at run start, so a red run reports
      # nothing at all. The comment is most valuable precisely when something
      # failed, so posting it must not itself be conditional on success.
      # (MINCRM-695, MINCRM-696)
      - name: Post combined summary comment (MINCRM-135)
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-results-functional
          path: /tmp/e2e-comment-body.md


  unit-test-report:
    name: Phase 2 - Unit Tests — Coverage Report
    needs: [server-tests, client-tests, coverage-dashboard-tests, e2e-framework-specs]
    runs-on: ubuntu-latest
    # MINCRM-293: run whenever any test suite ran, regardless of which paths changed.
    # always() is required: without it GitHub skips this job when e2e-framework-specs is
    # skipped (qa paths unchanged), before the if condition is even evaluated.
    if: always() && (contains(fromJson('["success","failure"]'), needs.server-tests.result) || contains(fromJson('["success","failure"]'), needs.client-tests.result) || contains(fromJson('["success","failure"]'), needs.coverage-dashboard-tests.result) || contains(fromJson('["success","failure"]'), needs.e2e-framework-specs.result)) && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # MINCRM-293: Each download step uses continue-on-error because only the suites
      # that ran for this PR will have uploaded artifacts. Missing artifacts are handled
      # gracefully in the build step below with per-file existence checks.
      - name: Download server coverage artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: server-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-coverage

      - name: Download client coverage artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: client-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/client-coverage

      - name: Download coverage-dashboard coverage artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-dashboard-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-dashboard-coverage

      - name: Download server test results artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: server-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-test-results

      - name: Download client test results artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: client-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/client-test-results

      - name: Download coverage-dashboard test results artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-dashboard-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-dashboard-test-results

      - name: Download framework test results artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: framework-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/framework-test-results

      - name: Download framework coverage artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: framework-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/framework-coverage

      - name: Build coverage comment
        id: comment
        env:
          # github.head_ref is attacker-controllable (a PR's branch name) —
          # passed through an env var per actionlint's own guidance, never
          # interpolated directly into the shell script via ${{ }}.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          SERVER_COV=$(python3 .github/scripts/parse-junit.py coverage-summary artifacts/server-coverage/coverage-summary.json)
          CLIENT_COV=$(python3 .github/scripts/parse-junit.py coverage-summary artifacts/client-coverage/coverage-summary.json)
          COVERAGE_DASHBOARD_COV=$(python3 .github/scripts/parse-junit.py coverage-summary artifacts/coverage-dashboard-coverage/coverage-summary.json)
          FRAMEWORK_COV=$(python3 .github/scripts/parse-junit.py coverage-summary artifacts/framework-coverage/coverage-summary.json)
          SERVER_TESTS=$(python3 .github/scripts/parse-junit.py summary-unit artifacts/server-test-results/junit.xml)
          CLIENT_TESTS=$(python3 .github/scripts/parse-junit.py summary-unit artifacts/client-test-results/junit.xml)
          COVERAGE_DASHBOARD_TESTS=$(python3 .github/scripts/parse-junit.py summary-unit artifacts/coverage-dashboard-test-results/junit.xml)
          FRAMEWORK_TESTS=$(python3 .github/scripts/parse-junit.py summary-unit artifacts/framework-test-results/results.xml)
          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          IFS='|' read -r s_lines s_funcs s_branch s_stmts <<< "$SERVER_COV"
          IFS='|' read -r c_lines c_funcs c_branch c_stmts <<< "$CLIENT_COV"
          IFS='|' read -r cd_lines cd_funcs cd_branch cd_stmts <<< "$COVERAGE_DASHBOARD_COV"
          IFS='|' read -r f_lines f_funcs f_branch f_stmts <<< "$FRAMEWORK_COV"
          IFS='|' read -r s_status s_tests s_passed s_failed s_skipped <<< "$SERVER_TESTS"
          IFS='|' read -r c_status c_tests c_passed c_failed c_skipped <<< "$CLIENT_TESTS"
          IFS='|' read -r cd_status cd_tests cd_passed cd_failed cd_skipped <<< "$COVERAGE_DASHBOARD_TESTS"
          IFS='|' read -r fw_status fw_tests fw_passed fw_failed fw_skipped <<< "$FRAMEWORK_TESTS"

          # Write body to a file to avoid ARG_MAX on large outputs.
          {
            echo "## Phase 2 — Unit & Framework Tests"
            echo ""
            echo "**Branch**: \`$BRANCH_NAME\` · **Commit**: \`$(echo "${{ github.sha }}" | cut -c1-7)\` · **Run**: [${{ github.run_id }}]($ARTIFACTS_URL) · **Started**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Suite | Status | Tests | Passed | Failed | Skipped |"
            echo "|-------|--------|-------|--------|--------|---------|"
            echo "| server | $s_status | $s_tests | $s_passed | $s_failed | $s_skipped |"
            echo "| client | $c_status | $c_tests | $c_passed | $c_failed | $c_skipped |"
            echo "| coverage-dashboard | $cd_status | $cd_tests | $cd_passed | $cd_failed | $cd_skipped |"
            echo "| e2e framework | $fw_status | $fw_tests | $fw_passed | $fw_failed | $fw_skipped |"
            echo ""
            echo "## Unit Test Coverage"
            echo ""
            echo "| Package | Lines | Functions | Branches | Statements |"
            echo "|---------|-------|-----------|----------|------------|"
            echo "| server  | ${s_lines}% | ${s_funcs}% | ${s_branch}% | ${s_stmts}% |"
            echo "| client  | ${c_lines}% | ${c_funcs}% | ${c_branch}% | ${c_stmts}% |"
            echo "| coverage-dashboard | ${cd_lines}% | ${cd_funcs}% | ${cd_branch}% | ${cd_stmts}% |"
            echo "| e2e framework | ${f_lines}% | ${f_funcs}% | ${f_branch}% | ${f_stmts}% |"
            echo ""
            echo "> Thresholds: server services ≥ 80% · client/coverage-dashboard components/pages ≥ 70%"
            echo ""
            echo "[Download coverage artifacts]($ARTIFACTS_URL)"
          } > /tmp/coverage-comment-body.md
          cat /tmp/coverage-comment-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-test-coverage
          path: /tmp/coverage-comment-body.md

  lint-docs:
    name: Phase 1 - Lint Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Lint markdown files
        run: markdownlint-cli2 "**/*.md" "#node_modules"

  # MINCRM-324: Generate visual regression baselines on Linux and commit them
  # back to the PR branch. Runs only on qa path changes. Services and setup
  # steps mirror e2e-functional. The .github/actions/e2e-infra composite action
  # exists for future consolidation once it lands on main.
  update-visual-snapshots:
    name: Phase 4 - Update Visual Snapshots
    needs: [lint-and-typecheck, changes]
    # disabled — re-enable by restoring: needs.lint-and-typecheck.result == 'success' &&
    #   (needs.changes.outputs.client == 'true' || needs.changes.outputs.visual == 'true')
    if: false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        command: server /data --console-address :9001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('qa/package.json') }}

      - name: Install dependencies
        run: npm ci && npm install --prefix client

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run migrations on E2E database
        run: npm run migrate:fresh --workspace=minicrm-server
        env:
          DATABASE_URL: postgresql://minicrm:password@localhost:5432/minicrm_e2e
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-functional-secret
          NODE_ENV: test

      - name: Seed E2E admin user
        run: npm run seed:e2e-admin
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Create MinIO test bucket
        run: |
          MINIO_ID=$(docker ps --filter "ancestor=minio/minio:latest" --format "{{.ID}}")
          docker exec "$MINIO_ID" mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec "$MINIO_ID" mc mb local/minicrm-test-bucket

      - name: Seed E2E storage config
        run: npm run seed:e2e-storage
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          E2E_STORAGE_ENDPOINT: http://localhost:9000
          E2E_STORAGE_BUCKET: minicrm-test-bucket
          E2E_STORAGE_ACCESS_KEY_ID: minioadmin
          E2E_STORAGE_SECRET_ACCESS_KEY: minioadmin

      - name: Start application server
        run: npm run start --workspace=minicrm-server &
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          NODE_ENV: development
          PORT: 3001
          E2E: true
          NODE_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20

      - name: Start frontend dev server
        run: npm run dev --workspace=minicrm-client &
        env:
          API_URL: http://localhost:3001

      - name: Wait for servers to be ready
        run: |
          echo "Waiting for API server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "API server did not start in time"; exit 1; fi
            sleep 2
          done
          echo "Waiting for frontend dev server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            echo "  attempt $i/30 — retrying in 2s"
            if [ "$i" -eq 30 ]; then echo "Frontend server did not start in time"; exit 1; fi
            sleep 2
          done

      - name: Generate missing visual snapshots — desktop
        # continue-on-error: Playwright exits 1 when it writes a new baseline
        # ("snapshot doesn't exist, writing actual") — the PNGs are still
        # created. We must not let that exit code abort the commit step.
        # MINCRM-324: --workers=1 serialises tests so each test's seeded deals
        # are fully torn down before the next test runs. Without this, parallel
        # workers contaminate the pipeline board with each other's deal cards,
        # producing non-deterministic pixel diffs.
        # --update-snapshots=missing only writes baselines that do not yet exist.
        # To regenerate stale baselines after intentional UI changes, trigger
        # the update-baselines.yml workflow_dispatch manually.
        continue-on-error: true
        run: >
          npx playwright test
          --config=qa/e2e/playwright.config.ts
          --project=desktop
          --workers=1
          --update-snapshots=missing
          qa/e2e/tests/apps/minicrm/functional/visual/visual-regression.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true

      - name: Generate missing visual snapshots — mobile-web
        continue-on-error: true
        run: >
          npx playwright test
          --config=qa/e2e/playwright.config.ts
          --project=mobile-web
          --workers=1
          --update-snapshots=missing
          qa/e2e/tests/apps/minicrm/functional/visual/visual-regression.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true

      - name: Commit and push updated snapshots
        id: commit-snapshots
        env:
          # Passed through an env var rather than interpolated directly into the
          # script — github.head_ref is attacker-controlled (a PR branch name)
          # and inline expression interpolation is a script-injection vector.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa/e2e/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "baselines_changed=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "chore(qa): update visual regression baselines ($CHANGED file(s)) [skip ci]"
            # Push an empty follow-up commit without [skip ci] so GitHub's required
            # status checks have a non-skipped HEAD commit to report against.
            # Without this the [skip ci] baseline commit becomes HEAD and the PR's
            # required checks stay "Waiting for status to be reported" indefinitely.
            git commit --allow-empty -m "ci: re-trigger checks after baseline update (MINCRM-324)"
            git push origin "HEAD:$HEAD_REF"
            echo "Pushed $CHANGED updated snapshot file(s) to $HEAD_REF."
            # Signal to the verify steps that new baselines were just committed.
            # They must not run now — the re-trigger commit above will run CI
            # again on the stable baselines, and the verify steps will run then.
            echo "baselines_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify visual snapshots — desktop
        # Skip when baselines were just generated this run. The re-trigger commit
        # pushes above will cause CI to run again; on that second run no new
        # baselines are written (baselines_changed=false) and the verify steps
        # run against stable committed PNGs. Running verify immediately after
        # generate produces false pixel diffs from render non-determinism between
        # the two sequential Playwright processes. (MINCRM-324)
        if: steps.commit-snapshots.outputs.baselines_changed == 'false'
        run: >
          npx playwright test
          --config=qa/e2e/playwright.config.ts
          --project=desktop
          --workers=1
          qa/e2e/tests/apps/minicrm/functional/visual/visual-regression.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true

      - name: Verify visual snapshots — mobile-web
        if: steps.commit-snapshots.outputs.baselines_changed == 'false'
        run: >
          npx playwright test
          --config=qa/e2e/playwright.config.ts
          --project=mobile-web
          --workers=1
          qa/e2e/tests/apps/minicrm/functional/visual/visual-regression.spec.ts
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E: true

  # MINCRM-569: Promptfoo NLI eval suite.
  # Runs only when AI source or eval config changes; never on draft PRs or Dependabot.
  # Keeps Anthropic API spend minimal: path filter is the primary cost lever.
  ai-evals:
    name: Phase 3 - AI Evals (Promptfoo)
    needs: [server-tests, client-tests, changes]
    if: |
      always() &&
      (needs.server-tests.result == 'success' || needs.server-tests.result == 'skipped') &&
      (needs.client-tests.result == 'success' || needs.client-tests.result == 'skipped') &&
      needs.changes.outputs.ai == 'true' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Promptfoo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/promptfoo
          key: promptfoo-${{ hashFiles('qa/evals/promptfooconfig.yaml', 'qa/evals/*.yaml') }}
          restore-keys: |
            promptfoo-

      - name: Run eval suite
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.run_number }}
          path: qa/evals/.output/
          if-no-files-found: warn

  # MINCRM-269: Sentinel job — sole required status check for branch protection.
  # Treats skipped jobs as passing so that path-scoped PRs are not blocked by
  # jobs that legitimately did not run.
  # MINCRM-282: security-audit is now blocking and included in this gate.
  # MINCRM-308: e2e-all-shards-passed added so any shard failure blocks this gate
  # regardless of how branch protection rules are named or configured.
  ci-gate:
    name: CI gate
    needs:
      - lint-and-typecheck
      - security-audit
      - server-tests
      - client-tests
      - coverage-dashboard-tests
      - e2e-framework-purity
      # e2e-framework-specs was absent here, so every framework unit spec could
      # fail without blocking a merge — including two guards CLAUDE.md documents
      # as load-bearing: merge-junit-results.spec.ts (MINCRM-689's JUnit CDATA
      # redaction parity) and coverage-session-control-client.spec.ts
      # (MINCRM-688's SHA-pattern parity). Note the asymmetry that made this easy
      # to miss: e2e-framework-purity runs check-sha-pattern-parity.sh and WAS
      # gated, so one half of the MINCRM-688 invariant blocked while the other
      # did not. MINCRM-696 added shard-script-args.spec.ts to this job and
      # depends on it failing a merge, which is what surfaced the gap.
      - e2e-framework-specs
      - lint-docs
      - e2e-aggregate
      - e2e-all-shards-passed
      - e2e-serial
      - ai-evals
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs
        run: |
          results=( \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.security-audit.result }}" \
            "${{ needs.server-tests.result }}" \
            "${{ needs.client-tests.result }}" \
            "${{ needs.coverage-dashboard-tests.result }}" \
            "${{ needs.e2e-framework-purity.result }}" \
            "${{ needs.e2e-framework-specs.result }}" \
            "${{ needs.lint-docs.result }}" \
            "${{ needs.e2e-aggregate.result }}" \
            "${{ needs.e2e-all-shards-passed.result }}" \
            "${{ needs.e2e-serial.result }}" \
            "${{ needs.ai-evals.result }}" \
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
