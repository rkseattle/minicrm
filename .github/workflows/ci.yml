name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint (root + server + client)
        run: npm run lint --workspaces --if-present

      - name: Typecheck client
        run: npm run typecheck --workspace=minicrm-client

      - name: Typecheck server
        run: npm run typecheck --workspace=minicrm-server

      - name: Typecheck qa
        run: npm run typecheck --workspace=minicrm-qa

      - name: Validate OpenAPI spec
        run: npm run lint:api --workspace=minicrm-server
        env:
          NODE_ENV: development

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

  server-tests:
    name: Server Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        # Using ECR Public mirror to avoid Docker Hub unauthenticated pull rate limits
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run server tests with coverage
        run: npm run test:coverage --workspace=minicrm-server
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_test
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  client-tests:
    name: Client Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (no lockfile — resolves Linux-specific optional binaries)
        run: rm -f package-lock.json && npm install

      - name: Run client tests with coverage
        run: npm run test:coverage --workspace=minicrm-client

  e2e-framework-purity:
    name: E2E Framework Purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check framework/ has no application-domain strings (MINCRM-123)
        run: bash qa/scripts/check-framework-purity.sh

  e2e-trivial:
    name: E2E Trivial Smoke Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run trivial smoke test (desktop, MINCRM-123)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=desktop qa/e2e/tests/trivial.spec.ts

      - name: Run trivial smoke test (mobile-web, MINCRM-123)
        run: npx playwright test --config=qa/e2e/playwright.config.ts --project=mobile-web qa/e2e/tests/trivial.spec.ts
