name: Claude Code Review Autofix

# MINCRM-178: Replaces the Greptile autofix loop. When Claude's PR review
# (claude-review.yml) posts comments via github-actions[bot], this workflow
# runs Claude Code on the branch to address the feedback automatically.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  address-feedback:
    # Run when github-actions[bot] posts a review comment or a follow-up PR comment.
    # github-actions[bot] is the actor used by claude-code-action review posts.
    if: |
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'github-actions[bot]' &&
       github.event.review.state == 'commented') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'github-actions[bot]' &&
       github.event.issue.pull_request != null)

    runs-on: ubuntu-latest
    # Serialize runs per PR so concurrent review posts don't cause conflicting commits
    concurrency:
      group: claude-review-autofix-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Fetch the PR head ref via API — issue_comment events don't include head.ref
      - name: Get PR head ref
        id: get-ref
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request?.number
              || context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            core.setOutput('pr_number', String(pr_number));
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_branch', pr.head.ref);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.get-ref.outputs.pr_branch }}
          fetch-depth: 0

      - name: Collect Claude review feedback
        id: feedback
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number('${{ steps.get-ref.outputs.pr_number }}');

            // Top-level review summary bodies from github-actions[bot]
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            const reviewSummaries = reviews
              .filter(r => r.user.login === 'github-actions[bot]')
              .map(r => r.body)
              .filter(Boolean)
              .join('\n\n---\n\n');

            // Per-file inline comments from github-actions[bot]
            const { data: reviewComments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            const inlineComments = reviewComments
              .filter(c => c.user.login === 'github-actions[bot]')
              .map(c => `File: ${c.path} (line ${c.line ?? c.original_line})\n${c.body}`)
              .join('\n\n---\n\n');

            const sections = [];
            if (reviewSummaries) sections.push(`=== REVIEW SUMMARIES ===\n\n${reviewSummaries}`);
            if (inlineComments)  sections.push(`=== INLINE COMMENTS ===\n\n${inlineComments}`);
            core.setOutput('review_feedback', sections.join('\n\n'));

      - name: Run Claude Code to address feedback
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A Claude Code review bot has reviewed a pull request and flagged issues
            that need to be addressed.

            PR Title: ${{ steps.get-ref.outputs.pr_title }}
            Branch: ${{ steps.get-ref.outputs.pr_branch }}

            Claude review feedback to address:
            ---
            ${{ steps.feedback.outputs.review_feedback }}
            ---

            Instructions:
            - Read each issue raised carefully
            - Fix only the issues identified — do not refactor unrelated code
            - Re-read CLAUDE.md to ensure fixes comply with architecture rules
            - After fixing, run the linter and fix any new errors introduced
            - Commit with message: fix: address Claude review feedback on <PR title>
            - Do not open a new PR — push to the existing branch
