name: TIA Record Mode

# MINCRM-633: record mode — the FULL functional + serial suite runs
# post-merge (on every push to main) and nightly, with coverage
# instrumentation enabled, then ingests every dump produced into
# coverage_units/coverage_test_links so the mapping engine's map stays
# fresh. This run's result is the AUTHORITATIVE signal MINCRM-634's PR
# gating defers to — unlike ci.yml's own PR-time select mode (tia-selection
# job), which is fast, advisory feedback only.
#
# Triggered by `push: branches: [main]`, NOT workflow_run off ci.yml —
# workflow_run's `branches` filter matches the branch the TRIGGERING
# workflow itself executed on, which for a pull_request-only workflow
# (ci.yml has no push trigger — see its own `on:` block) is the PR's own
# head branch, never literally "main". `workflow_run: {branches: [main]}`
# chained off a pull_request-only workflow therefore never fires at all
# (confirmed against GitHub's own docs and community reports — this was a
# real bug in an earlier revision of this file, caught in review). A
# direct `push: branches: [main]` trigger reacts to the actual merge
# commit landing on main, which is what this workflow needs.
#
# This intentionally does NOT gate on "did ci.yml pass for this PR" first
# (unlike the discarded workflow_run design) — this repo's main branch has
# no branch-protection rule requiring CI to pass before merge, so a push
# to main is not guaranteed to have already passed ci.yml. Record mode is
# the authoritative check; it must run unconditionally on every push to
# main rather than trust an unenforced precondition.
#
# Why a separate workflow file, not a job inside ci.yml: ci.yml is
# pull_request-only (see its own `on:` block) — a full nightly/scheduled
# run has no PR to attach a status check to, and mixing a `schedule:`
# trigger into ci.yml would make every job's `if:` conditions (many of
# which already assume `github.event_name == 'pull_request'`, e.g. sticky
# PR comments) need a second branch of special-casing throughout an
# already very large file.

on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC nightly — recalibrates the map even on a quiet day with no
    # merges, so a long-idle branch's PR select mode never resolves against
    # a stale map older than this window.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch to check out. Defaults to main, which is what every scheduled
          and post-merge run uses. Override ONLY to validate a change to this
          workflow itself before merging it: the checkout is otherwise pinned
          to main, so dispatching a branch would run main's workflow
          definition against main's code and prove nothing about the branch.
          A non-main run exports its coverage map but does NOT commit it —
          only main's map is authoritative — so treat such runs as throwaway
          validation and re-run on main after merging. (MINCRM-687)
        required: false
        default: main

# Serialize record-mode runs so two overlapping runs never write
# coverage_test_links for the same commit concurrently in a way that could
# race with pruneCoverageUnits' retention deletion.
concurrency:
  group: tia-record-mode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record-mode:
    name: Full-suite record mode
    runs-on: ubuntu-latest

    # MINCRM-687: the Playwright JUnit artifact, named once. Both the
    # zero-test guard and the attestation gate below read this exact file,
    # and a drift between two hardcoded copies would mean the guard silently
    # checked a file nobody else used. Job-level rather than step-level
    # because two steps need it — unlike the suite step's credentials, which
    # stay step-scoped so they are not exposed to the `git push` further
    # down. The path itself is not a secret.
    env:
      RESULTS_XML: ${{ github.workspace }}/qa/e2e/test-results/results.xml

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: password
          POSTGRES_DB: minicrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        command: server /data --console-address :9001

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit ref removes any ambiguity for the schedule/
          # workflow_dispatch triggers, which have no natural "ref" of
          # their own — record mode runs against main's own tip by default.
          #
          # workflow_dispatch can be launched against ANY ref in the
          # GitHub UI, not just main — github.sha in that case resolves to
          # the DISPATCHED ref's tip, not main's, even though this step
          # checks out the resolved ref regardless (found via Greptile PR
          # review: a non-main dispatch would test main's code but
          # attestation/failure-reporting below would reference a
          # different commit than what was actually tested). The step
          # below resolves and records the SHA actually checked out here,
          # and every later step uses that output, never github.sha.
          #
          # The `ref` input (MINCRM-687) exists solely so a change to THIS
          # workflow can be validated before it is merged; every non-dispatch
          # trigger still gets main. Without it the pin made this file
          # untestable by construction — a dispatch against a branch ran
          # main's definition — which is how MINCRM-687's breakage survived
          # five weeks and several inspection-only reviews.
          ref: ${{ inputs.ref || 'main' }}
          # Full history: the commit step below uses `git merge-base
          # --is-ancestor` to decide whether what was tested is on main, and
          # rebases onto main's tip before pushing. Neither works against the
          # default depth-1 shallow clone. (MINCRM-687)
          fetch-depth: 0

      # Also records main's tip AS OF NOW, which the commit step needs to tell
      # "main advanced while we ran" (fine — rebase and publish) apart from
      # "we deliberately tested an old commit" (not fine — the map would be
      # attributed to newer code). Both are ancestors of origin/main by the
      # time that step runs, so ancestry alone cannot distinguish them; only a
      # checkout-time snapshot can. (MINCRM-687)
      - name: Resolve checked-out SHA
        id: resolve-sha
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "main-at-checkout=$(git rev-parse origin/main)"
          } >> "$GITHUB_OUTPUT"

      # e2e-infra's own "Run migrations on E2E database" step handles this —
      # no separate migration step needed here.
      - uses: ./.github/actions/e2e-infra
        with:
          e2e-admin-email: ${{ secrets.E2E_ADMIN_EMAIL }}
          e2e-admin-password: ${{ secrets.E2E_ADMIN_PASSWORD }}
          node-encryption-key: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
          # Record mode's whole purpose is producing coverage dumps to
          # ingest below — every other e2e-infra caller needs this OFF for
          # a clean, zero-overhead baseline run (see the action's own input
          # docs).
          coverage-instrumentation: 'true'

      # Single worker, not the config's own IS_CI default (4): this run
      # mixes @functional and @serial tests in ONE invocation (unlike
      # ci.yml's split e2e-functional/e2e-serial jobs), and per CLAUDE.md's
      # own rule, @serial tests mutate a shared system_settings row and
      # race under concurrent workers. Slower than ci.yml's sharded run, but
      # record mode isn't latency-sensitive — it runs post-merge/nightly,
      # off the PR's own critical path.
      #
      # A bare `--grep @functional` reaches the @serial tests too: every
      # @serial test in the suite also carries @functional (verified across
      # all 29 @serial files), so the single grep is the union of ci.yml's
      # two jobs rather than a subset of either. ci.yml needs its narrower
      # patterns only because it SPLITS the suite — the shards use
      # `--grep-invert "visual-regression|serial"` (ci.yml:1036) to push
      # serial work to a separate job, and that job re-selects it with a
      # both-tags pattern (ci.yml:1436). Record mode wants everything in one
      # pass, so it excludes nothing. @visual tests are not swept in: they
      # are tagged @visual and deliberately NOT @functional
      # (visual-regression.spec.ts:39), because they need OS-matching
      # baselines.
      #
      # MINCRM-687: both projects, not just desktop. This suite guards
      # viewport-specific tests in BOTH directions — some skip on mobile
      # viewports, others on desktop ones — so a desktop-only run leaves the
      # mobile-only tests never having run an assertion anywhere, and
      # verify-test-attestation.ts reports those as 'skipped-tests' (see
      # findTestsSkippedEverywhere there: a test is attested when it passed
      # in at least one project run present in the results file). Running
      # both projects means every viewport-conditional test is covered by
      # the union. ci.yml:826 already runs @functional over both, so this is
      # existing practice, not a new combination.
      #
      # Narrowing this back to one project would re-introduce that failure.
      # The gate reconciles what the results file CONTAINS and cannot know
      # which projects were intended, so it will not catch the mistake for
      # you — it would simply report the now-uncovered tests as skipped.
      #
      # Known risk accepted when this landed: most @serial spec files carry
      # NO viewport handling at all and had never run under mobile-web
      # before this change, because ci.yml runs serial specs on desktop only
      # (ci.yml:1436). Some target pages hide elements responsively — e.g.
      # client/src/pages/admin/GeneralSettings.tsx:152 (`hidden lg:block`)
      # and client/src/pages/admin/BrandingSettings.tsx:350
      # (`hidden sm:block`) — so a spec that assumes such an element is
      # present will fail under the Pixel 5 viewport.
      #
      # For the current census (a count quoted here would drift with every
      # spec edit):
      #   for f in $(grep -rl "@serial" qa/e2e/tests/apps/minicrm/functional/); do
      #     grep -q "isMobile\|viewportSize" "$f" || echo "$f"
      #   done
      #
      # If this run goes red on those specs, the fix is to viewport-guard
      # them, NOT to drop --project=mobile-web: dropping it just moves the
      # failure onto the mobile-only tests, which would then be skipped in
      # every project present and reported by the gate.
      #
      # Most likely first casualty if one exists: ai.spec.ts's F-AI6, which
      # reads the session sidebar (AiPage.tsx's `hidden md:flex`) with no
      # viewport guard, unlike its neighbours F-AI7/F-AI8 which do guard.
      # It is EXPECTED to survive — both getSessionSidebarText and
      # waitForAiSidebarText go through textContent(), which reads
      # display:none elements, unlike innerText() — but it is the first
      # place to look.
      - name: Run full functional + serial suite (record mode)
        id: run-suite
        run: |
          npx playwright test \
            --config=qa/e2e/playwright.config.ts \
            --project=desktop \
            --project=mobile-web \
            --workers=1 \
            --grep @functional
        env:
          # MINCRM-687: this block previously set PW_WORKERS and nothing
          # else, so E2E_ADMIN_PASSWORD was unset for the run. That has no
          # default anywhere, and eleven @functional spec files throw at
          # module scope when it is missing — the suite collected 0 tests on
          # every run since this workflow was added, which then surfaced
          # three steps later as the attestation gate's confusing
          # "no-session-attribution". Kept in step-level env (not job-level)
          # so the credentials are not exposed to the `git push` in "Commit
          # updated coverage map" below. Mirrors ci.yml's e2e-serial job
          # (ci.yml:1443-1452), the closest analogue: a single-worker
          # --project run of the same suite.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BASE_URL: http://localhost:5173
          # Set explicitly even though globalSetup.ts falls back to :3001
          # under CI: qa/e2e/apps/minicrm/apiBaseUrl.ts defaults to :3002
          # (the docker-compose test stack) instead, and nothing listens
          # there in this job. Two modules agreeing by coincidence is the
          # fragility class MINCRM-684 closed.
          E2E_API_URL: http://localhost:3001
          E2E: true
          MAILHOG_URL: http://localhost:8025
          # Bind the coverage sessions this run records to the SAME SHA the
          # attestation step verifies against. resolveSessionBuildSha()
          # (coverage-session-control-client.ts:28-30) falls back to
          # GITHUB_SHA, which for a workflow_dispatch launched against a
          # non-main ref is the DISPATCHED ref's tip — not the `ref: main`
          # this job actually checks out. The gate would then query one SHA
          # while sessions were tagged with another, find nothing, and fail
          # with 'no-session-attribution': a correct suite run reported as a
          # coverage-plumbing fault, which is exactly the confusing symptom
          # the zero-test guard below was added to stop producing.
          #
          # The checkout step's own comment (:113-122) already establishes
          # that every later step must use the resolved SHA rather than
          # github.sha; this closes the one path that still did not.
          # MINCRM-688 tracks the same fix for the local/ingest paths.
          GIT_COMMIT_SHA: ${{ steps.resolve-sha.outputs.sha }}
          # AI healing is deliberately NOT enabled here, unlike ci.yml's
          # e2e-functional/e2e-serial jobs. Healing repairs drifted locators
          # at runtime; this run is the authoritative source of coverage
          # attribution, so it must record what the selectors actually
          # resolve to, not what an LLM patched them into. Do not "restore
          # parity" with ci.yml by adding AI_HEALING/ANTHROPIC_API_KEY.
          #
          # 150 minutes, overriding playwright.config.ts's 20-minute default
          # (:154-156), which is calibrated for CI's sharded 4x2x2 matrix and
          # is far too small for one unsharded single-worker process.
          #
          # Derived from this repo's own MEASURED single-worker throughput,
          # not from sharded per-file medians (which understate a serialized
          # run): playwright.config.ts's comment records ~420-445 of 1030
          # tests completing in 20 minutes at 1-2 local workers — the test
          # server is a single Node process, so it bottlenecks throughput
          # regardless of worker count. That is ~21-22 tests/min.
          #
          # This invocation is 1322 tests (661 per project x 2 projects,
          # counted with `playwright test --grep @functional --list`), so
          # ~60-63 min at that rate. 150 min is ~2.4x the projection, which
          # is the margin this needs: the figure above was measured locally,
          # and a GitHub runner is slower than a dev machine.
          #
          # Cross-check: scripts/pre-push-tia.ts covers the same 1322 tests
          # across the same two projects (it passes no --project either), but
          # as TWO sequential invocations of disjoint subsets — 60 min for the
          # 1030 non-serial, then 25 min for the 292 serial. Not a directly
          # comparable single budget, but it brackets the same work at 85 min
          # total, which is the useful signal: one unsharded invocation of the
          # union needs more than that, not less.
          #
          # GitHub's default 360-minute job limit is the only hard ceiling.
          #
          # This does NOT interact with verify-test-attestation's
          # DEFAULT_MAX_AGE_MINUTES (120) the way a job-duration budget
          # would: that gate stats the results.xml mtime, which is
          # written when the SUITE finishes, and the attestation step runs
          # seconds later. The freshness window guards against a stale
          # results.xml left over from an earlier run of the same commit, not
          # against a long job. GitHub's default 360-minute job limit is the
          # only ceiling this value has to respect.
          PW_GLOBAL_TIMEOUT_MS: '9000000'
          # E2E_COVERAGE_GRANULARITY intentionally UNSET (per-test, the
          # default — see coverage.md's Low-Overhead Mode table). Record
          # mode's whole purpose is populating coverage_test_links with real
          # per-test attribution so select-tests.ts can resolve testId ->
          # testFile; per-run mode routes every dump through
          # coverage-reporter.ts's single end-of-run dump instead, which
          # carries no session/testId attribution at all (sessionDump is
          # null in coverageIngestionService.ts), so coverage_test_links
          # would stay empty regardless of how many tests ran. Not
          # latency-sensitive (see e2e-infra step above), so per-test's
          # higher overhead is an acceptable tradeoff here.
          #
          # PW_WORKERS intentionally absent: --workers=1 on the CLI above
          # takes precedence over the config's PW_WORKERS read, so setting
          # it here was inert.

      # MINCRM-687 (AC 7): fail loudly, here, when the suite collected no
      # tests. Without this the symptom surfaces two steps later as the
      # attestation gate's "no-session-attribution" — which reads as a
      # coverage-plumbing problem and sent a previous investigation down
      # exactly that wrong path, when the real cause was that every spec
      # threw at import time and nothing ran at all.
      #
      # if: always() so it also fires when the suite step itself failed: a
      # crashed run that produced no results.xml is precisely the case this
      # diagnoses. Reads the JUnit XML the run already writes rather than
      # Playwright's exit code, per the project rule to read result files.
      #
      # Scope: this guard covers the ZERO-TESTS half of the problem, not the
      # zero-DUMPS half. The ingest step below still exits 0 on an empty dump
      # set — deliberately, since it is if: always() and an empty ingest is
      # legitimate when the suite failed earlier. So a run where all 1322
      # tests pass but no coverage dumps are produced (instrumentation
      # silently off, say) still reaches the attestation gate and fails there
      # with 'no-session-attribution' rather than being named here. That is
      # the accepted residual: attributing it correctly needs a dump-count
      # assertion the ingest step does not currently expose, and the
      # attestation reason is at least specific about what is missing.
      # Gated on the suite step having actually executed, NOT bare always().
      # When an earlier step fails — e2e-infra died in two of the runs in this
      # ticket's own history — run-suite is skipped, no results.xml exists, and
      # a bare always() would fire this guard's "check the suite step" message
      # over the real infra error. Naming the wrong cause is the exact failure
      # mode this ticket exists to remove, so the guard must not reintroduce
      # it. It still runs when run-suite FAILS, which is the case it diagnoses.
      - name: Verify the suite actually ran tests
        id: verify-ran
        if: always() && steps.run-suite.conclusion != 'skipped'
        run: |
          if [ ! -f "$RESULTS_XML" ]; then
            echo "::error::No results file at $RESULTS_XML — the suite produced no JUnit output at all. Check the 'Run full functional + serial suite' step: if every spec threw at import time (a missing E2E_ADMIN_PASSWORD does this), Playwright collects 0 tests and writes nothing."
            exit 1
          fi
          TEST_COUNT=$(sed -n 's/.*<testsuites[^>]*tests="\([0-9]*\)".*/\1/p' "$RESULTS_XML" | head -1)
          if [ -z "$TEST_COUNT" ]; then
            echo "::error::Could not read a test count from $RESULTS_XML — the file exists but has no <testsuites tests=\"N\"> attribute, so it is malformed or truncated."
            exit 1
          fi
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "::error::The suite collected 0 tests. This is a harness failure, not a passing run — record mode must never export a coverage map from an empty run. Check the suite step's env block against ci.yml's E2E jobs."
            exit 1
          fi
          echo "Suite collected $TEST_COUNT test(s)."

      - name: Ingest coverage dumps into the mapping engine
        id: ingest
        if: always()
        run: npm run ingest:coverage-dumps --workspace=minicrm-qa
        env:
          E2E_API_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          COVERAGE_DUMPS_ROOT: ${{ github.workspace }}/server/coverage-dumps

      # MINCRM-642: the shared attestation gate, run here because this is
      # the ONE place in the whole hybrid model where a genuine, freshly-
      # ingested full-suite results.xml AND its session attribution
      # (COVERAGE_SESSION_MANAGEMENT, enabled above) exist together in the
      # SAME job — ci.yml's own tia-selection job never executes Playwright
      # at all, so there is nothing there to attest to. No --selection
      # argument: this run IS the full suite, not a targeted subset, so
      # there is no required-file list to reconcile against — only the
      # all-pass + SHA-binding/freshness mechanism applies here.
      - name: Verify test attestation
        id: attest
        if: always()
        run: |
          npm run --workspace=minicrm-server --silent verify:test-attestation -- \
            --results="$RESULTS_XML" \
            --sha=${{ steps.resolve-sha.outputs.sha }}
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432

      # pr-tia-8: CI has no persistent database (see
      # coverageMappingService.ts's own "Committed-map load/export"
      # docblock) — this is the ONE place coverage_test_links reflects a
      # genuine, freshly-ingested full-suite run. Exports it to
      # qa/coverage-map.json and commits back to main, the same pattern
      # update-timing-baseline.yml already establishes for
      # test-timing-baseline.json. Every other job (ci.yml's tia-selection,
      # the local pre-push hook) re-loads FROM this committed file — see
      # load-coverage-map.ts.
      #
      # Gated on the suite AND attestation both having actually passed, not
      # just on ingestion having succeeded (found via Greptile PR review):
      # a run with real test FAILURES can still produce technically valid
      # coverage data (code was exercised even though assertions failed),
      # but that data reflects a known-broken state of the app — publishing
      # it as "the current authoritative map" would let a later PR's
      # selection quietly rely on mappings derived from a build that never
      # actually passed. Ingestion succeeding is necessary (there must be
      # something to export) but not sufficient.
      - name: Export coverage map
        if: always() && steps.run-suite.outcome == 'success' && steps.verify-ran.outcome == 'success' && steps.attest.outcome == 'success'
        run: npm run dump:coverage-map --workspace=minicrm-server
        env:
          DB_USER: minicrm
          DB_PASSWORD: password
          DB_NAME: minicrm_e2e
          DB_HOST: localhost
          DB_PORT: 5432

      # Only main's map is authoritative, so only a run that actually checked
      # out main may commit one. A validation dispatch against a branch (see
      # the `ref` input) produces a real map, but committing it would push to
      # whatever ref was checked out — and on a SHA dispatch, to a detached
      # HEAD, failing the job at its last step after a multi-hour run. Skip
      # instead, and say so: the export step above still ran, so the artifact
      # is inspectable in the uploaded report.
      - name: Commit updated coverage map
        if: always() && steps.run-suite.outcome == 'success' && steps.verify-ran.outcome == 'success' && steps.attest.outcome == 'success'
        run: |
          # Ask git what was actually checked out rather than string-matching
          # the `ref` input. That input is a user-supplied label and takes
          # several forms for the same commit — `main`, `refs/heads/main`,
          # `origin/main`, a raw SHA — so comparing it to a literal would skip
          # the publish for a legitimate main dispatch and for any future
          # equivalent spelling. Comparing COMMITS sidesteps the whole class.
          #
          # TWO conditions, because the map is attributed to a SHA and
          # select-tests.ts resolves coverage links by that SHA. Publishing a
          # map derived from older code would misattribute it to newer code:
          # selection would then miss relationships the newer code introduced
          # and act on ones it removed.
          #
          #  1. HEAD must be ON main — not a branch, not an arbitrary commit.
          #  2. HEAD must have been main's TIP when this run checked out.
          #     `main` legitimately advances during a run this long, and a
          #     merge landing mid-run must not cost us the map — that is what
          #     the rebase below handles. But a DELIBERATELY old commit
          #     (dispatching HEAD~50, say) is a different thing, and ancestry
          #     alone cannot tell them apart: by the time this step runs both
          #     are ancestors of origin/main. Comparing against the
          #     checkout-time snapshot does distinguish them.
          git fetch --quiet origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::notice::HEAD ($HEAD_SHA) is not on origin/main — skipping the coverage-map commit. The map was still exported and is in the uploaded report; re-run on main to publish it."
            exit 0
          fi
          if [ "$HEAD_SHA" != "$MAIN_AT_CHECKOUT" ]; then
            echo "::notice::HEAD ($HEAD_SHA) was not main's tip at checkout ($MAIN_AT_CHECKOUT) — this run tested older code, so publishing its map would attribute those coverage links to newer code. Skipping the commit; the map is in the uploaded report."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa/coverage-map.json
          if git diff --cached --quiet; then
            echo "Coverage map unchanged — nothing to commit."
          else
            git commit -m "chore(coverage-tia): update coverage map [skip ci]"
            # Replay onto main's current tip before pushing. This job can run
            # for over two hours, so main has often moved since checkout; a
            # plain push would then be rejected as non-fast-forward and the
            # map would be lost after a full suite run. The commit touches
            # only qa/coverage-map.json, which nothing else writes, so the
            # rebase is conflict-free in practice.
            git rebase origin/main
            # Explicit destination: HEAD may be detached (a SHA dispatch), where
            # a bare `git push` has no upstream to infer.
            git push origin HEAD:main
          fi
        env:
          MAIN_AT_CHECKOUT: ${{ steps.resolve-sha.outputs.main-at-checkout }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tia-record-mode-report-${{ github.run_id }}
          path: |
            qa/e2e/test-results/
            qa/e2e/playwright-report/
          retention-days: 30

      # MINCRM-634: "a post-merge full-suite failure triggers a clear
      # signal/rollback path (since merge is not the final gate)". This is
      # the ONE point in the whole hybrid model where a red result means
      # something already merged to main is provably broken by the
      # authoritative full suite, not just a PR's own advisory select-mode
      # check — every prior job in this workflow ran on already-merged
      # code, so there is no PR to attach a status check to. A commit
      # comment on the exact SHA that broke is the closest GitHub-native
      # equivalent: visible on the commit itself, linked from the compare
      # view, and durable (unlike a Slack ping into a channel nobody reads
      # later). Scoped to a failing check + this comment only, per this
      # branch's own design decision — no external paging/rollback
      # automation exists in this repo today (see e2e-infra's own lack of
      # any notification integration).
      - name: Post failure signal on the offending commit
        if: failure()
        uses: actions/github-script@v7
        env:
          # NOT context.sha — workflow_dispatch can be launched against ANY
          # ref in the GitHub UI, in which case context.sha is the
          # DISPATCHED ref's tip, not main's, even though this job always
          # checks out and tests main regardless (found via Greptile PR
          # review). resolve-sha's own output is the SHA this job actually
          # checked out and tested, correct for every trigger.
          RESOLVED_SHA: ${{ steps.resolve-sha.outputs.sha }}
        with:
          script: |
            const sha = process.env.RESOLVED_SHA;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body:
                `## ⚠️ TIA record-mode failure (MINCRM-633/634)\n\n` +
                `The full-suite authoritative run failed against this commit. ` +
                `Since merge is not the final gate in the hybrid selection model, ` +
                `this means code already on \`main\` did not actually pass the full suite ` +
                `— any PR-time select-mode green check for this commit was advisory only.\n\n` +
                `[View the failing run](${runUrl})\n\n` +
                `Next steps: investigate the failure and either fix forward or revert this commit.`,
            });
