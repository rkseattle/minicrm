name: Update E2E Timing Baseline

# MINCRM-549: Triggered when the CI workflow completes on main, so the artifacts
# from that run (e2e-shard-* containing test-timing.jsonl) are available for
# download. Merges all shard JSONL files, recomputes the per-file median baseline,
# and commits the updated test-timing-baseline.json back to main with [skip ci].
#
# Also dispatchable manually so maintainers can force a refresh (e.g. after mass
# spec renames that invalidate stale baseline entries).
#
# Why workflow_run instead of push?
# The download-artifact action fetches artifacts from the *current* workflow run by
# default. Using workflow_run gives us access to the triggering CI run's artifacts
# (where the e2e-shard-* JSONL files actually live).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize baseline updates so back-to-back merges to main don't race on git
# push. cancel-in-progress: false queues the second run rather than dropping it,
# ensuring every CI run's timing data is eventually committed.
concurrency:
  group: update-timing-baseline-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-baseline:
    name: Merge JSONL shards and update timing baseline
    runs-on: ubuntu-latest
    # Only run when the triggering CI workflow succeeded; skip on failures so a
    # broken run doesn't overwrite a good baseline with partial data.
    # workflow_dispatch runs unconditionally (github.event.workflow_run is null).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download all e2e-shard-* artifacts from the triggering CI run.
      # Each matrix shard uploads its own test-timing.jsonl inside the shard artifact.
      # Skipped on workflow_dispatch — github.event.workflow_run.id is null in that case.
      # Manual dispatch recomputes the baseline from whatever test-timing.jsonl is already
      # present in the checkout (committed by a previous workflow_run invocation).
      - name: Download shard timing artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: ./timing-shards
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # continue-on-error allows a partial CI run (some shards skipped) to still
        # update the baseline from whichever shards completed.
        continue-on-error: true

      - name: Merge shard JSONL files
        run: |
          MERGED="qa/e2e/test-timing.jsonl"
          touch "$MERGED"
          FOUND=0
          for f in $(find ./timing-shards -name 'test-timing.jsonl' 2>/dev/null | sort); do
            echo "Merging: $f"
            cat "$f" >> "$MERGED"
            FOUND=$(( FOUND + 1 ))
          done
          if [ "$FOUND" -gt 0 ]; then
            echo "Merged ${FOUND} shard JSONL file(s) into $MERGED ($(wc -l < "$MERGED") lines total)"
          elif [ -s "$MERGED" ]; then
            # workflow_dispatch: no shards downloaded; recompute from committed test-timing.jsonl.
            echo "No shard artifacts found — recomputing from committed $MERGED ($(wc -l < "$MERGED") lines)."
          else
            echo "::error::No shard JSONL files found and $MERGED is empty. Run the E2E suite first."
            exit 1
          fi

      - name: Recompute timing baseline
        run: npm run e2e:timing:baseline

      - name: Commit updated baseline
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa/e2e/test-timing-baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged — nothing to commit."
          else
            git commit -m "chore(e2e): update test timing baseline [skip ci]"
            git push
          fi
