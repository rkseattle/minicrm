name: Lint Workflows

# Kept in its own file, separate from ci.yml, so it can still run and report
# a failure even when ci.yml itself is malformed enough to fail GitHub's own
# workflow schema parse — a broken ci.yml causes every job defined inside it
# to be skipped outright, including any validation job that lived there.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # Composite actions are not workflows, so actionlint's workflow glob never reaches
      # them — without this a PR editing only an action file runs no lint at all. That
      # matters more since MINCRM-704 moved the audit gate's only definition into
      # .github/actions/npm-audit/. See the validate-composite-actions job below.
      - '.github/actions/**'
      # The validator itself. Without this, narrowing its glob or breaking its checks
      # triggers no run of the guard it is — the same bidirectional paths-filter
      # invariant CLAUDE.md states, applied to the guard's own source. (MINCRM-704)
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      # Composite actions are not workflows, so actionlint's workflow glob never reaches
      # them — without this a PR editing only an action file runs no lint at all. That
      # matters more since MINCRM-704 moved the audit gate's only definition into
      # .github/actions/npm-audit/. See the validate-composite-actions job below.
      - '.github/actions/**'
      # The validator itself. Without this, narrowing its glob or breaking its checks
      # triggers no run of the guard it is — the same bidirectional paths-filter
      # invariant CLAUDE.md states, applied to the guard's own source. (MINCRM-704)
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate workflow YAML (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint .github/workflows/*.yml

  validate-composite-actions:
    name: Validate composite actions
    runs-on: ubuntu-latest
    # actionlint parses workflows only — pointed at an action.yml it reports "jobs section
    # is missing" rather than validating it, so composite actions had no linting at all.
    # The script checks the two things that actually break them: structure, and shell
    # errors in `run:` blocks. That matters since the npm audit gate's only definition now
    # lives in .github/actions/npm-audit/. (MINCRM-704)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate composite actions
        run: python3 .github/scripts/validate-composite-actions.py
