# Composite action: e2e-infra
#
# Installs deps, caches Playwright browsers, runs DB migrations, seeds test
# data (admin user, MinIO bucket + storage config, SMTP config), starts the
# app server + frontend dev server, and waits for both to be healthy.
#
# Its only caller today is .github/workflows/tia-record-mode.yml. ci.yml's
# e2e-functional/e2e-serial/update-visual-snapshots jobs still inline an
# equivalent sequence of their own rather than calling this action — a known
# duplication kept for now because consolidating three large CI jobs is its
# own change, not a rider on a bug fix. When changing a step here, check
# whether ci.yml's copies need the same change: MINCRM-687 was caused by
# exactly that drift, where this action lacked the SMTP seeding step both
# ci.yml jobs have.
#
# Callers are responsible for declaring the postgres and minio services at
# the job level — service containers cannot be defined inside a composite
# action. A caller whose specs assert on email delivery must also declare a
# mailhog service on :1025/:8025, which the SMTP seeding step below assumes.
#
# MINCRM-324, MINCRM-687

name: E2E infrastructure setup
description: >
  Shared setup for E2E jobs: install, Playwright browsers, DB migrations,
  seeding, MinIO bucket, app server + frontend server startup.

inputs:
  e2e-admin-email:
    description: Admin user email for the E2E database
    required: true
  e2e-admin-password:
    description: Admin user password for the E2E database
    required: true
  node-encryption-key:
    description: 64-char hex NODE_ENCRYPTION_KEY for the app server
    required: true
  coverage-instrumentation:
    description: >
      Set to 'true' to start the app server with the whole Coverage/TIA
      surface enabled (MINCRM-633 record mode): COVERAGE_INSTRUMENTATION,
      COVERAGE_SESSION_MANAGEMENT, and — since MINCRM-685 moved them off
      feature_flags rows onto boot-time env vars — COVERAGE_MAPPING_QUERY,
      COVERAGE_REPORTING_QUERY, and COVERAGE_PIPELINE_INGESTION. One input
      drives all five deliberately: a record-mode run needs the agent, the
      session API, and the ingestion pipeline together, and
      qa/e2e/scripts/ingest-coverage-dumps.ts can no longer switch the pipeline
      on for itself over REST now that there is no flag row to switch — this
      input is what supplies that precondition instead.
      Every other caller needs the backend V8 agent OFF for a clean,
      zero-overhead baseline run, so this defaults to unset.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Cache Playwright browser binaries
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ hashFiles('qa/package.json') }}

    - name: Install dependencies
      # @rollup/rollup-linux-x64-gnu is a platform-specific optional dep omitted
      # from the macOS-generated lockfile. npm install --prefix client forces
      # fresh resolution of platform-specific optional binaries. (npm workspace
      # optional-deps bug)
      shell: bash
      run: npm ci && npm install --prefix client

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Run migrations on E2E database
      # migrate:fresh, not migrate: this action always runs against a brand-new
      # service-container Postgres with no prior pgmigrations rows. Plain
      # `npm run migrate` replays 001-N after 000_baseline already created
      # those same objects, so it fails on the first re-declared table
      # ("relation already exists") — see 000_baseline.js's own docblock and
      # ci.yml's e2e-functional/e2e-serial/update-visual-snapshots jobs, which
      # all use migrate:fresh for this same reason.
      shell: bash
      run: npm run migrate:fresh --workspace=minicrm-server
      env:
        DATABASE_URL: postgresql://minicrm:password@localhost:5432/minicrm_e2e
        DB_USER: minicrm
        DB_PASSWORD: password
        DB_NAME: minicrm_e2e
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_SECRET: ci-functional-secret
        NODE_ENV: test

    - name: Seed E2E admin user
      shell: bash
      run: npm run seed:e2e-admin
      env:
        DB_USER: minicrm
        DB_PASSWORD: password
        DB_NAME: minicrm_e2e
        DB_HOST: localhost
        DB_PORT: 5432
        E2E_ADMIN_EMAIL: ${{ inputs.e2e-admin-email }}
        E2E_ADMIN_PASSWORD: ${{ inputs.e2e-admin-password }}

    # MINCRM-278: Create the test bucket using mc inside the running minio/minio
    # service container — no separate image pull, alias persists across commands.
    - name: Create MinIO test bucket
      shell: bash
      run: |
        MINIO_ID=$(docker ps --filter "ancestor=minio/minio:latest" --format "{{.ID}}")
        docker exec $MINIO_ID mc alias set local http://localhost:9000 minioadmin minioadmin
        docker exec $MINIO_ID mc mb local/minicrm-test-bucket

    # MINCRM-278: Write MinIO storage config into system_settings so the server
    # finds a configured backend at startup — no manual admin setup required.
    - name: Seed E2E storage config
      shell: bash
      run: npm run seed:e2e-storage
      env:
        DB_USER: minicrm
        DB_PASSWORD: password
        DB_NAME: minicrm_e2e
        DB_HOST: localhost
        DB_PORT: 5432
        NODE_ENCRYPTION_KEY: ${{ inputs.node-encryption-key }}
        E2E_STORAGE_ENDPOINT: http://localhost:9000
        E2E_STORAGE_BUCKET: minicrm-test-bucket
        E2E_STORAGE_ACCESS_KEY_ID: minioadmin
        E2E_STORAGE_SECRET_ACCESS_KEY: minioadmin

    # MINCRM-306: Write Mailhog SMTP config into system_settings so the server
    # routes transactional email to Mailhog instead of a real SMTP server.
    #
    # MINCRM-687: this action was missing the step ci.yml's e2e-functional and
    # e2e-serial jobs both run (ci.yml:954-963, :1317-1326). Callers declaring
    # a mailhog service still had no SMTP config written, so the @functional
    # email-delivery specs — email-delivery.spec.ts's F1-EM1/F1-EM2 and
    # send-email.spec.ts's two tests — failed against an unconfigured backend
    # as soon as a caller actually ran them.
    - name: Seed E2E SMTP config
      shell: bash
      run: npm run seed:e2e-smtp
      env:
        DB_USER: minicrm
        DB_PASSWORD: password
        DB_NAME: minicrm_e2e
        DB_HOST: localhost
        DB_PORT: 5432
        E2E_SMTP_HOST: localhost
        E2E_SMTP_PORT: '1025'

    - name: Start application server
      shell: bash
      run: npm run start --workspace=minicrm-server &
      env:
        DB_USER: minicrm
        DB_PASSWORD: password
        DB_NAME: minicrm_e2e
        DB_HOST: localhost
        DB_PORT: 5432
        JWT_SECRET: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
        NODE_ENV: development
        PORT: 3001
        E2E: true
        NODE_ENCRYPTION_KEY: ${{ inputs.node-encryption-key }}
        COVERAGE_INSTRUMENTATION: ${{ inputs.coverage-instrumentation }}
        COVERAGE_SESSION_MANAGEMENT: ${{ inputs.coverage-instrumentation }}
        COVERAGE_MAPPING_QUERY: ${{ inputs.coverage-instrumentation }}
        COVERAGE_REPORTING_QUERY: ${{ inputs.coverage-instrumentation }}
        COVERAGE_PIPELINE_INGESTION: ${{ inputs.coverage-instrumentation }}
        # `npm run start --workspace=minicrm-server` sets this process's cwd
        # to server/, not the repo root — coverageConfig.ts's
        # resolveSourceRoot() would otherwise relativize coverage paths
        # against the wrong root, rejecting containment for anything under
        # shared/ or client/ (every frontend Istanbul dump) and falling back
        # to unportable absolute paths. Harmless when coverage instrumentation
        # is off — nothing consults it.
        COVERAGE_SOURCE_ROOT: ${{ github.workspace }}

    - name: Start frontend dev server
      shell: bash
      run: npm run dev --workspace=minicrm-client &
      env:
        API_URL: http://localhost:3001
        # client/vite.config.ts only adds the Istanbul instrumentation plugin
        # when COVERAGE=true — without it window.__coverage__ never exists in
        # the browser, so per-test frontend coverage attribution in
        # fixtures.ts (pullAndSubmitBrowserCoverage) is a permanent no-op.
        # Tied to the same input as the backend agent: every other caller of
        # this action needs an uninstrumented, byte-identical dev build.
        COVERAGE: ${{ inputs.coverage-instrumentation }}

    - name: Wait for servers to be ready
      shell: bash
      run: |
        echo "Waiting for API server..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:3001/api/health && break
          echo "  attempt $i/30 — retrying in 2s"
          if [ "$i" -eq 30 ]; then echo "API server did not start in time"; exit 1; fi
          sleep 2
        done
        echo "Waiting for frontend dev server..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:5173 && break
          echo "  attempt $i/30 — retrying in 2s"
          if [ "$i" -eq 30 ]; then echo "Frontend server did not start in time"; exit 1; fi
          sleep 2
        done
