# Composite action: npm-audit
#
# The repo's single definition of the high/critical dependency audit. Two workflows run
# it: ci.yml's blocking "Phase 1 - Security Audit" gate, and security-audit.yml's daily
# scheduled run against main.
#
# Extracted rather than copied. The two had already drifted once: MINCRM-703 hardened
# ci.yml's copy against the fail-open hole below and left security-audit.yml a bare
# `npm audit --audit-level=high`, so the nightly security job reported green on any
# registry outage for as long as that went unnoticed. A "keep these in sync" comment is
# what e2e-infra/action.yml:7-14 already documents as insufficient — MINCRM-687 was
# caused by exactly that kind of drift.
#
# Callers are responsible for checkout and for installing dependencies; this action only
# audits an already-installed tree.
#
# MINCRM-703, MINCRM-704

name: npm audit
description: >
  Fails on any high/critical advisory, and fails closed when npm audit does not
  produce a usable report.

runs:
  using: composite
  steps:
    - name: Audit dependencies for high/critical vulnerabilities
      shell: bash
      run: |
        # npm audit exits non-zero BOTH when it finds advisories and when it fails
        # to run at all, so the exit code alone cannot distinguish "clean" from
        # "never produced a verdict". Capture output and status separately, then
        # require a well-formed report before trusting any conclusion — otherwise a
        # registry outage, a proxy error, or an npm crash yields empty output that
        # scrapes to zero advisories and reports a green security gate. (MINCRM-703)
        set +e
        npm audit --audit-level=high --json > "${RUNNER_TEMP}/audit.json"
        AUDIT_STATUS=$?
        set -e

        if ! jq -e '(.metadata.vulnerabilities | type) == "object"' "${RUNNER_TEMP}/audit.json" > /dev/null 2>&1; then
          echo "::error::npm audit did not produce a usable report (exit ${AUDIT_STATUS})."
          echo "Treating this as a failure: an unreadable audit is not a clean audit."
          head -c 4000 "${RUNNER_TEMP}/audit.json" || true
          exit 1
        fi

        HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' "${RUNNER_TEMP}/audit.json")
        CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' "${RUNNER_TEMP}/audit.json")

        if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
          echo "::error::npm audit found ${CRITICAL} critical and ${HIGH} high advisories:"
          jq -r '
            (.vulnerabilities // {}) | to_entries[] | .value.via[]
            | select(type == "object")
            | "\(.url | split("/")[-1])  \(.severity)  \(.name)"
          ' "${RUNNER_TEMP}/audit.json" | sort -u
          jq '.vulnerabilities' "${RUNNER_TEMP}/audit.json"
          echo ""
          echo "Before allowlisting anything, try a full re-resolve — an incremental"
          echo "npm install will NOT reconsider overrides for transitive deps:"
          echo "  rm -rf node_modules package-lock.json && npm install"
          echo "Pin the fixed version in the root package.json \"overrides\" block."
          exit 1
        fi

        echo "No high/critical advisories (MINCRM-703)."
