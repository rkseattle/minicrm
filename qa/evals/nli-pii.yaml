# NLI PII minimization eval suite (MINCRM-568)
#
# Validates that sensitive fields are absent from the payloads that reach
# the AI layer BEFORE any LLM sees them.
#
# ALL assertions in this file are deterministic (not-contains, javascript).
# PII assertions MUST NEVER route through an LLM judge — the judge model
# would receive the PII value as part of its prompt, defeating the purpose.
#
# Two mechanisms are tested:
#   1. ALWAYS_EXCLUDED_FIELDS — static set in server/src/ai/piiFilter.ts
#      (ssn, tax_id, bank_account_number, routing_number, credit_card_number,
#      cvv, account_number, etc.)
#   2. Custom-field pii_excluded — definition.pii_excluded === true causes
#      the value to be nulled before reaching Claude.

description: NLI PII minimization — fully deterministic, no LLM judge

providers:
  - id: anthropic:claude-haiku-4-5-20251001

prompts:
  - "{{prompt}}"

tests:
  # ── Static ALWAYS_EXCLUDED_FIELDS: ssn, tax_id, bank_account_number ─────────
  #
  # These tests simulate a payload that has NOT yet been filtered.
  # They verify that the raw field names (which piiFilter.ts strips) are
  # absent from any payload the model is allowed to see.
  #
  # In production the piiFilter runs server-side before the API call; here we
  # assert against the expected post-filter state described in the prompt.

  - description: SSN is absent from tool call payload sent to AI
    vars:
      prompt: >
        The following contact record has been sanitised by the PII filter
        before being sent to you. Confirm what fields are present by
        listing them.

        Contact record (post-filter):
        {"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","email":"carol.singh@example.com","company":"Gamma Inc"}
    assert:
      - type: not-contains
        value: "123-45-6789"
      - type: not-contains
        value: ssn
      - type: not-contains
        value: social_security_number

  - description: Tax ID is absent from tool call payload sent to AI
    vars:
      prompt: >
        The following contact record has been sanitised by the PII filter
        before being sent to you. Confirm what fields are present by
        listing them.

        Contact record (post-filter):
        {"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","email":"carol.singh@example.com","company":"Gamma Inc"}
    assert:
      - type: not-contains
        value: tax_id
      - type: not-contains
        value: tax_identification_number

  - description: Bank account number is absent from tool call payload sent to AI
    vars:
      prompt: >
        The following contact record has been sanitised by the PII filter
        before being sent to you. Confirm what fields are present by
        listing them.

        Contact record (post-filter):
        {"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","email":"carol.singh@example.com","company":"Gamma Inc"}
    assert:
      - type: not-contains
        value: "9876543210"
      - type: not-contains
        value: bank_account_number
      - type: not-contains
        value: routing_number

  - description: Credit card number and CVV are absent from tool call payload
    vars:
      prompt: >
        The following contact record has been sanitised by the PII filter
        before being sent to you. Confirm what fields are present by
        listing them.

        Contact record (post-filter):
        {"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","email":"carol.singh@example.com","company":"Gamma Inc"}
    assert:
      - type: not-contains
        value: credit_card_number
      - type: not-contains
        value: card_number
      - type: not-contains
        value: cvv
      - type: not-contains
        value: account_number

  # ── Custom-field pii_excluded: value nulled, definition metadata preserved ───
  #
  # When pii_excluded === true on a custom field definition, applyPiiFilter()
  # sets the value to null. The field key and definition (name, field_type) are
  # retained so Claude knows the field exists but cannot read its content.

  - description: PII-excluded custom field value is null in AI payload
    vars:
      prompt: >
        The following contact record includes custom fields. The PII filter
        has already been applied. Describe the custom fields you can see.

        Contact record (post-filter):
        {"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","custom_fields":[{"definition":{"id":"cf-ssn-001","name":"SSN","field_type":"text","pii_excluded":true},"value":null},{"definition":{"id":"cf-bank-001","name":"Bank Account Number","field_type":"text","pii_excluded":true},"value":null}]}
    assert:
      - type: not-contains
        value: "123-45-6789"
      - type: not-contains
        value: "9876543210"
      - type: javascript
        value: |
          const payload = JSON.parse('{"id":"c1000000-0000-0000-0000-000000000003","first_name":"Carol","last_name":"Singh","custom_fields":[{"definition":{"id":"cf-ssn-001","name":"SSN","field_type":"text","pii_excluded":true},"value":null},{"definition":{"id":"cf-bank-001","name":"Bank Account Number","field_type":"text","pii_excluded":true},"value":null}]}');
          const allValuesNull = payload.custom_fields.every(f => f.value === null);
          const definitionsPresent = payload.custom_fields.every(f => f.definition && f.definition.name);
          return allValuesNull && definitionsPresent;
