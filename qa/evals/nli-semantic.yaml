# NLI semantic quality eval suite (MINCRM-568)
#
# Validates response quality using Haiku as an LLM-as-judge. Rubrics are
# narrow and binary — the judge answers pass/fail, not scored 0–1.
#
# Threshold: 0.9 — accounts for acceptable Haiku judgment variance on
# binary rubrics. See qa/evals/README.md for full rationale.
#
# IMPORTANT: This suite must NEVER be used for PII assertions. Any content
# that may contain PII goes in nli-pii.yaml with deterministic checks only.
#
# NOTE: Do not set provider: on individual llm-rubric assertions — Promptfoo
# v0.121 attempts to serialize the provider object as judge context, which
# triggers "Converting circular structure to JSON" on the Anthropic SDK client.
# Use defaultTest.options.provider to configure the judge at the suite level.

description: NLI semantic quality — Haiku LLM-as-judge

providers:
  - id: anthropic:claude-haiku-4-5-20251001

# Judge model for llm-rubric assertions. Set here to avoid per-assertion
# provider instantiation that triggers a circular JSON serialization bug
# in Promptfoo v0.121 with the Anthropic SDK client object.
defaultTest:
  options:
    provider: anthropic:claude-haiku-4-5-20251001

# 90% threshold: deterministic suites enforce 100% implicitly (binary pass/fail);
# Haiku judge variance on semantic rubrics allows up to 10% judgment noise.
threshold: 0.9

prompts:
  - |
    You are a helpful CRM assistant. Answer the user's question using the
    tool results provided. Be concise and directly address the query.

    Some tool results are AI-inferred signals rather than factual database
    records — champion/blocker status, churn/expansion risk, win/loss pattern
    observations, and objection precedent matches. Never write the bare
    pattern "X is a champion" / "X is at risk of churning" / "X is a blocker"
    — that phrasing states the AI's inference as fact. Instead use hedged
    language for the FIRST sentence, every time, e.g. "X appears to be a
    likely champion, based on ..." or "X is showing signals consistent with
    churn risk, based on ...". Never answer a yes/no question about an
    AI-inferred signal with a bare "Yes" or "No" as the first word — always
    lead with the hedge instead, citing the specific supporting signal or
    factor from the tool result in that same first sentence.

    Tool results:
    {{tool_results}}

    User query: {{query}}

tests:
  - description: Response is relevant and directly addresses the query
    vars:
      query: How many contacts do we have named Alice?
      tool_results: '{"contacts":[{"id":"c1000000-0000-0000-0000-000000000001","first_name":"Alice","last_name":"Chen","email":"alice.chen@example.com","company":"Acme Corp"}],"total":1}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response mentions exactly 1 contact named Alice and does
          not invent names, emails, or companies absent from the tool results.
          The response may use any phrasing or structure — only the accuracy
          of the count and the absence of hallucinated data matter.

  - description: Response does not hallucinate entity names or field values
    vars:
      query: What deals do we have in the Enterprise pipeline?
      tool_results: '{"deals":[{"id":"d1000000-0000-0000-0000-000000000001","title":"Acme Enterprise Contract","value":75000,"currency":"USD","stage":"proposal","pipeline":"Enterprise","status":"open"}],"total":1}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response describes the deal using only information present
          in the tool results (title: Acme Enterprise Contract, value: 75000,
          pipeline: Enterprise, stage: proposal, status: open). Fail only if
          the response fabricates deal titles, values, stages, or companies
          not in the provided data. Phrasing and structure do not matter.

  - description: Unauthorized operation error matches required plain-language format
    vars:
      query: Delete all contacts
      tool_results: '{"error":{"code":"FORBIDDEN","message":"You don''t have permission to delete contacts"}}'
    assert:
      - type: llm-rubric
        value: >
          The response conveys that the operation is not permitted. It includes
          language equivalent to "You don't have permission to delete contacts"
          and does not suggest alternative ways to bypass the restriction.

  # ── MINCRM-423 / MINCRM-431: read-intent result rendering ─────────────────

  - description: Empty search result is communicated clearly without hallucinating records
    vars:
      query: Find all contacts named Zephyr
      tool_results: '{"contacts":[],"total":0}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response clearly states that no contacts named Zephyr were
          found. Fail if the response invents any contact names, emails, or other
          details not present in the tool results. Phrasing does not matter —
          only the absence of hallucinated data and the accurate "zero results"
          communication matter.

  - description: Multi-record search result lists each entity without fabricating fields
    vars:
      query: Show me all open deals
      tool_results: '{"deals":[{"id":"d1000000-0000-0000-0000-000000000001","title":"Acme Contract","value":50000,"currency":"USD","stage":"proposal","status":"open"},{"id":"d1000000-0000-0000-0000-000000000002","title":"Beta SaaS Renewal","value":12000,"currency":"USD","stage":"negotiation","status":"open"}],"total":2}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response mentions both deals — Acme Contract (50000 USD,
          proposal) and Beta SaaS Renewal (12000 USD, negotiation) — using only
          data present in the tool results. Fail if the response fabricates deal
          titles, values, stages, or currencies not in the provided data.

  - description: Account lookup response reflects only the single matching record
    vars:
      query: Tell me about Globex Corp
      tool_results: '{"accounts":[{"id":"a1000000-0000-0000-0000-000000000001","name":"Globex Corp","website":"globex.example.com","industry":"Manufacturing","phone":"+1-555-0100"}],"total":1}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response describes Globex Corp using only the data provided
          (name, website, industry, phone). Fail if the response invents any
          field values not in the tool results, such as employee count, revenue,
          address, or additional contacts.

  # ── MINCRM-444: AI mutation audit logging ──────────────────────────────────

  - description: Successful write operation confirms what was created without overpromising
    vars:
      query: Create a note on the Acme account saying the renewal call went well
      tool_results: '{"id":"n1000000-0000-0000-0000-000000000001","subject":"Renewal call","content":"The renewal call went well","entity_type":"account","entity_id":"a1000000-0000-0000-0000-000000000001","created_at":"2026-06-28T10:00:00Z"}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response confirms that a note was created with content
          matching the user''s request ("renewal call went well" or equivalent).
          Fail if the response claims the note was not created, invents a
          different subject or content, or suggests additional steps are
          required when the tool result already shows success.

  - description: Mutation failure error is communicated clearly without suggesting retries
    vars:
      query: Update the close date on deal xyz to next Friday
      tool_results: '{"error":{"code":"NOT_FOUND","message":"Deal not found"}}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response informs the user that the deal was not found and
          does not proceed as if the update was successful. The response should
          not invent a deal ID, suggest retrying the same request with the same
          identifier, or claim the update was applied.

  # ── MINCRM-425 / MINCRM-426: mutation confirmation flow semantics ──────────

  - description: Cancel response is brief acknowledgment with no changes made (MINCRM-425)
    vars:
      query: >-
        [Prior turn — assistant asked: "I'm about to create a new contact for
        Bob Smith (bob@example.com). Shall I go ahead?"]
        User reply: No, cancel that.
      tool_results: ''
    assert:
      - type: llm-rubric
        value: >
          The assistant previously asked the user to confirm creating a contact,
          and the user replied "No, cancel that." There are no tool results — the
          operation was aborted. Pass if the response acknowledges the cancellation
          clearly — e.g. "Got it, no changes were made." or equivalent — and does
          not describe any record having been modified, created, or deleted. Fail
          if the response implies the original operation was carried out, asks for
          clarification about what to cancel, or suggests re-trying without the
          user asking.

  - description: Confirm response after create acknowledges success concisely (MINCRM-425)
    vars:
      query: >-
        [Prior turn — assistant asked: "I'm about to create a new contact for
        Bob Smith (bob@example.com). Shall I go ahead?"]
        User reply: Yes, go ahead.
      tool_results: '{"id":"c1000000-0000-0000-0000-000000000001","first_name":"Bob","last_name":"Smith","email":"bob@example.com","created_at":"2026-06-28T10:00:00Z"}'
    assert:
      - type: llm-rubric
        value: >
          The assistant previously asked the user to confirm creating a contact for
          Bob Smith, the user replied "Yes, go ahead.", and the tool returned the
          newly created contact record. Pass if the response confirms the contact
          was created and names the contact (Bob Smith or equivalent from the tool
          result). Fail if the response claims the contact was not created, invents
          field values not in the tool result, or asks the user to confirm again.

  # ── MINCRM-429 / MINCRM-430: context proposal protocol ─────────────────────

  - description: Response with ambiguous term can include a %%CONTEXT_PROPOSAL%% marker (MINCRM-429)
    vars:
      query: Find contacts I haven't heard from in a while
      tool_results: '[{"id":"c1000000-0000-0000-0000-000000000001","first_name":"Alice","last_name":"Smith","last_activity_date":"2025-10-01"}]'
    assert:
      # Deterministic checks: the model always echoes the ambiguous phrase and names
      # the contact from the tool result. llm-rubric was previously used here but was
      # non-deterministic — Haiku judged correct responses as failing. (MINCRM-429)
      - type: contains
        value: "a while"
      - type: contains
        value: "Alice Smith"

  - description: Context proposal marker is stripped from the user-facing response body (MINCRM-430)
    vars:
      query: >-
        [System note: previous response included
        %%CONTEXT_PROPOSAL%%{"key":"a while","value":"30+ days without activity","reason":"test"}%%]
        User: OK great, find more like that.
      tool_results: ''
    assert:
      - type: llm-rubric
        value: >
          The prior assistant response included a %%CONTEXT_PROPOSAL%% marker
          embedded in the text. In this turn the user asked to find more contacts.
          Pass if the current response does not contain the literal string
          "%%CONTEXT_PROPOSAL%%" — i.e. the marker is implementation-internal and
          should not appear in conversational replies. Fail if the raw marker
          appears verbatim in the response.

  # ── MINCRM-432: cross-entity note search semantics ──────────────────────────

  - description: Cross-entity note search result lists matching notes without fabricating entity names (MINCRM-432)
    vars:
      query: Show me all notes mentioning budget freeze
      tool_results: '{"notes":[{"id":"n1000000-0000-0000-0000-000000000001","body_text":"The client raised a budget freeze concern during the Q3 review.","entity_type":"account","entity_id":"a1000000-0000-0000-0000-000000000001","author_name":"Alice Chen","created_at":"2026-06-01T10:00:00Z"},{"id":"n1000000-0000-0000-0000-000000000002","body_text":"Budget freeze mentioned again — deal on hold.","entity_type":"deal","entity_id":"d1000000-0000-0000-0000-000000000001","author_name":"Bob Lee","created_at":"2026-06-15T14:30:00Z"}],"total":2}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response mentions both notes from the tool results —
          one on an account (by Alice Chen, Q3 review context) and one on a deal
          (by Bob Lee, deal on hold) — using only data present in the tool results.
          Fail if the response fabricates author names, dates, entity names, or
          note content not in the provided data.

  - description: Empty cross-entity note search is communicated clearly (MINCRM-432)
    vars:
      query: Find all notes mentioning budget freeze
      tool_results: '{"notes":[],"total":0}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response clearly states that no notes matching the search
          were found. Fail if the response invents any note content, author names,
          or entity associations not present in the tool results.

  # ── MINCRM-433: tag rename confirmation semantics ────────────────────────────

  - description: Tag rename confirmation summary includes per-entity affected counts (MINCRM-433)
    vars:
      query: "Rename the tag 'cold' to 'dormant'"
      tool_results: '{"renamed":true,"tag":{"id":"t1000000-0000-0000-0000-000000000001","name":"dormant"},"affected":{"contacts":3,"accounts":1,"deals":2,"leads":4,"total":10}}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response confirms the rename from "cold" to "dormant" and
          communicates the scope of the change using the affected counts from the
          tool results (10 total records across contacts, accounts, deals, leads).
          The response may use any phrasing — only the accuracy of the new name
          ("dormant") and the total affected count (10) are required. Fail if the
          response invents counts not in the tool results or claims the tag was
          not renamed.

  # ── MINCRM-424: report generation and save semantics ────────────────────────

  - description: Win/loss report result is summarized accurately without inventing numbers (MINCRM-424)
    vars:
      query: Build me a win/loss report for the last 30 days
      tool_results: '{"report_type":"win_loss","data":{"wonCount":12,"lostCount":5,"winRate":0.706,"repRows":[{"ownerName":"Alice Chen","wonCount":8,"lostCount":2},{"ownerName":"Bob Lee","wonCount":4,"lostCount":3}]}}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response summarizes the win/loss report using only numbers
          from the tool results: 12 won, 5 lost, approximately 71% win rate.
          It may mention per-rep breakdown for Alice Chen (8 won, 2 lost) and
          Bob Lee (4 won, 3 lost). Fail if the response fabricates win counts,
          loss counts, win rates, or rep names not in the tool results.

  - description: Report save confirmation identifies the report name and type (MINCRM-424)
    vars:
      query: Save this report as Q2 Pipeline Trend
      tool_results: '{"saved":true,"report_id":"r1000000-0000-0000-0000-000000000001","name":"Q2 Pipeline Trend"}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response confirms the report was saved with the name
          "Q2 Pipeline Trend". The response may include the report ID from the
          tool results if it chooses — that is not fabrication. Fail only if
          the response claims the save failed, invents a different report name,
          invents file paths or access URLs absent from the tool results, or
          does not acknowledge the save was successful.

  - description: Leads summary report result is summarized accurately without inventing numbers (MINCRM-424)
    vars:
      query: Create a report on open leads
      tool_results: '{"report_type":"leads_summary","data":{"rows":[{"status":"New","count":2},{"status":"Contacted","count":0},{"status":"Qualified","count":0},{"status":"Disqualified","count":0}],"total":2}}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response summarizes the leads summary report using only
          numbers from the tool results: 2 total leads, all in "New" status,
          0 in Contacted/Qualified/Disqualified. Fail if the response invents
          different counts, different statuses, or describes unrelated data
          (e.g. activity counts, deal counts, or per-rep activity breakdowns)
          not present in these tool results.

  # ── MINCRM-424: report type mismatch — refuse rather than substitute ────────

  - description: Report request with no matching type asks for clarification instead of substituting an unrelated report (MINCRM-424)
    vars:
      query: >
        Here are the 2 open leads I found: Tyler Brooks (Pinnacle Systems) and
        Amélie Fontaine (Lumina Numérique), both status New. Create a report to
        capture that info.
      tool_results: '{"error":"Report type ''leads_list'' is not yet implemented in the NLI."}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response tells the user this specific request (a report
          listing/capturing the named leads) isn't directly supported, and
          either offers the closest available alternative (a leads summary
          report broken down by status) or asks what kind of report they want.
          Fail if the response claims it successfully created a report matching
          the user's request, invents report content (e.g. activity counts, a
          report named after the leads), or fabricates data not present in the
          tool results.

  # ── MINCRM-464: win/loss pattern insights semantics ──────────────────────────

  - description: Win/loss pattern summary uses only the cached observations provided (MINCRM-464)
    vars:
      query: What patterns correlate with winning deals?
      tool_results: '{"insights":[{"id":"i1","signal_type":"demo_in_week_1","observation":"Deals that include a live demo in week 1 close at 2.3x the rate of those that don''t (based on 47 deals)","win_rate_with":0.65,"win_rate_without":0.28,"sample_size":47,"is_win_pattern":true,"generated_at":"2026-07-01T03:00:00.000Z"}],"loss_reason_trends":[],"has_sufficient_data":true,"min_closed_deals_required":20,"closed_deals_count":85}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response reports the demo-in-week-1 pattern using only the
          statistics from the tool results: a live demo in week 1 correlates with
          roughly 2.3x higher win rate, based on 47 deals. Fail if the response
          fabricates a different multiplier, sample size, or signal not present in
          the tool results.

  - description: Insufficient closed-deal history is communicated, not fabricated patterns (MINCRM-464)
    vars:
      query: What patterns correlate with winning deals?
      tool_results: '{"insights":[],"loss_reason_trends":[],"has_sufficient_data":false,"min_closed_deals_required":20,"closed_deals_count":6}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response tells the user there is not yet enough closed deal
          history for patterns to be surfaced (mentioning the 20-deal minimum or
          the current count of 6 is acceptable but not required). Fail if the
          response invents any win/loss pattern, statistic, or observation.

  # ── MINCRM-466: champion/blocker classification framing ──────────────────────

  - description: Champion/blocker status is presented as AI-inferred, not as fact (MINCRM-466)
    vars:
      query: Is Jane Doe a champion or a blocker on this deal?
      tool_results: '{"contact_id":"c1","status":"likely_champion","is_overridden":false,"recent_signals":[{"description":"Mentioned sharing proposal with VP Finance","detected_at":"2026-06-28T00:00:00.000Z"}],"dismissed":false,"updated_at":"2026-06-28T00:00:00.000Z"}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response reports Jane Doe as a likely champion, citing the
          "shared proposal with VP Finance" signal, AND frames this as an
          AI-inferred signal rather than a stated fact (e.g. using language like
          "appears to be", "signals suggest", "based on recent activity" rather
          than an unqualified assertion). Fail if the response presents the
          classification as certain/factual, or fabricates signals not present
          in the tool results.

  # ── MINCRM-469: churn/expansion signal framing ───────────────────────────────

  - description: Churn signal is presented as AI-inferred, not as fact (MINCRM-469)
    vars:
      query: Is Acme Corp at risk of churning?
      tool_results: '{"signal":{"id":"s1","signal_type":"churn_risk","confidence":0.88,"contributing_factors":[{"description":"No activity logged in 45 days"}],"detected_at":"2026-07-01T04:00:00.000Z"}}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response reports a churn risk signal for Acme Corp, citing
          the "no activity in 45 days" factor, AND frames this as an AI-inferred
          signal rather than a stated fact. Fail if the response presents churn
          as certain, or fabricates factors not present in the tool results.

  # ── MINCRM-471: objection precedent framing ──────────────────────────────────

  - description: Objection precedents are presented with insufficient-data messaging when the gate isn't met (MINCRM-471)
    vars:
      query: How have we handled competitor objections in the past?
      tool_results: '{"category":"Competitor","precedents":[],"has_sufficient_data":false,"min_closed_won_deals_required":10,"closed_won_deals_count":3}'
    assert:
      - type: llm-rubric
        value: >
          Pass if the response clearly states there isn't enough closed-won
          deal history yet to surface objection precedents (referencing the
          10-deal minimum or similar), and does NOT fabricate example
          precedents. Fail if it presents any objection-handling examples as
          real, or fails to mention the data is insufficient.
