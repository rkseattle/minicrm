# NLI RBAC enforcement eval suite (MINCRM-568)
#
# Validates the NLI layer's observable RBAC behaviour:
#   1. A rep-role user invoking an admin-only tool receives a permission error,
#      not a result (deterministic not-contains on tool name in the response).
#   2. The plain-language error message matches the required format (Haiku rubric).
#
# What these tests do NOT verify (already covered by Vitest unit tests):
#   - That buildToolSet('rep', ...) excludes the admin tool names — see nliToolPermissions.test.ts
#   - That ADMIN_ONLY_TOOL_NAMES contains the expected entries — see nliToolPermissions.test.ts
#
# The RBAC enforcement tests simulate what happens at the NLI session layer:
# the model is presented only the rep tool set (admin tools absent from the
# tools: config), then given a tool result that represents a permission error
# returned by the tool executor. This tests the model's correct interpretation
# and communication of that error — the meaningful observable behaviour.
#
# Threshold: 0.9 for the Haiku-judged error-format test.

description: NLI RBAC enforcement — unauthorized operation error handling

providers:
  - id: anthropic:claude-haiku-4-5-20251001

threshold: 0.9

prompts:
  - "{{prompt}}"

tests:
  # ── Deterministic: admin tool name does not appear in rep-session response ────
  #
  # The model is given the rep tool set (no admin tools) and a user request
  # for pipeline configuration data. The tool executor returns a FORBIDDEN error.
  # The model's response must not contain any admin-only tool name — confirming
  # it did not attempt to call an admin tool or surface one to the user.

  - description: Rep session response does not reference admin tool names after forbidden error
    vars:
      prompt: >
        You are a CRM assistant in a session for a rep-role user. The following
        tools are available: searchContacts, getContact, createContact,
        updateContact, deleteContact, searchAccounts, getAccount, createAccount,
        updateAccount, deleteAccount, searchLeads, getLead, createLead,
        updateLead, deleteLead, convertLead, searchDeals, getDeal, createDeal,
        updateDeal, deleteDeal, searchActivities, getActivity, createActivity,
        updateActivity, deleteActivity, searchNotes, getNote, createNote,
        updateNote, deleteNote, listTags, attachTag, detachTag, generateReport,
        exportEntities.

        The user asked: "Show me all pipeline configurations"

        The tool executor returned:
        {"error":{"code":"FORBIDDEN","message":"You don't have permission to manage pipeline settings"}}

        Respond to the user.
    assert:
      - type: not-contains
        value: listPipelines
      - type: not-contains
        value: getPipeline
      - type: not-contains
        value: listStages
      - type: not-contains
        value: listCustomFields
      - type: not-contains
        value: listAutomationRules
      - type: not-contains
        value: getAutomationRule
      - type: not-contains
        value: listWebhooks
      - type: not-contains
        value: listEmailTemplates
      - type: not-contains
        value: getEmailTemplate

  # ── Haiku-judged: unauthorized operation returns correct plain-language error ─

  - description: Unauthorized admin operation returns correct plain-language error
    vars:
      prompt: >
        You are a CRM assistant. The user has requested an operation they are
        not permitted to perform. Respond with the appropriate error message.

        Tool result:
        {"error":{"code":"FORBIDDEN","message":"You don't have permission to manage pipeline settings"}}

        User query: Show me all pipeline configurations
    assert:
      - type: llm-rubric
        value: >
          The response clearly communicates that the user does not have
          permission to perform the requested operation. It uses plain
          language equivalent to "You don't have permission to manage
          pipeline settings" and does not suggest any workaround or
          alternative path to access the restricted data.
        provider: anthropic:claude-haiku-4-5-20251001
