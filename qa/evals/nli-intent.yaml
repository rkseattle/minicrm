# NLI intent resolution eval suite (MINCRM-568)
#
# Validates that unambiguous natural-language queries produce the correct
# tool_use selection. All assertions are deterministic.
#
# The prompt instructs the model to respond ONLY with a JSON object naming
# the tool it would call. No tools are registered in the provider config —
# this forces a plain-text response that the javascript assertion can parse.
# (Registering tools in provider config causes Haiku to emit a tool_use
# content block instead of text, making JSON.parse(output) fail.)
#
# Assertions use `javascript` to parse and compare the `tool` field.
# Do not use `is-json` with a `value:` object — promptfoo treats that value
# as a JSON Schema (validated by AJV with strictSchema:true), which throws
# on unknown keyword "tool".

description: NLI intent resolution — deterministic tool selection

providers:
  - id: anthropic:claude-haiku-4-5-20251001

prompts:
  - |
    You are a CRM assistant. You have access to these tools:
    searchContacts, getContact, createContact, updateContact, deleteContact,
    searchAccounts, getAccount, createAccount, updateAccount, deleteAccount,
    searchLeads, getLead, createLead, updateLead, deleteLead, convertLead,
    searchDeals, getDeal, createDeal, updateDeal, deleteDeal,
    searchActivities, getActivity, createActivity, updateActivity, deleteActivity,
    searchNotes, getNote, createNote, updateNote, deleteNote,
    listTags, attachTag, detachTag, generateReport, exportEntities.

    Given the user request below, identify the single most appropriate tool
    to call. Respond ONLY with a JSON object in this exact format, with no
    prose or explanation:
    {"tool": "<tool_name>"}

    User request: {{query}}

tests:
  - description: Show contacts named Alice maps to searchContacts
    vars:
      query: Show me all contacts named Alice
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.tool === 'searchContacts';

  - description: Create a note on the Acme account maps to createNote
    vars:
      query: Create a note on the Acme account
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.tool === 'createNote';

  - description: List open deals in Enterprise pipeline maps to searchDeals
    vars:
      query: List all open deals in the Enterprise pipeline
    assert:
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.tool === 'searchDeals';
