# NLI intent resolution eval suite (MINCRM-568)
#
# Validates that unambiguous natural-language queries produce the correct
# tool_use selection. All assertions are deterministic.
#
# The prompt instructs the model to respond ONLY with a JSON object naming
# the tool it would call. No tools are registered in the provider config —
# this forces a plain-text response that the javascript assertion can parse.
# (Registering tools in provider config causes Haiku to emit a tool_use
# content block instead of text, making JSON.parse(output) fail.)
#
# Assertions use `javascript` to parse and compare the `tool` field.
# Markdown fences are stripped before parsing — Haiku sometimes wraps the
# JSON in ```json ... ``` despite the prompt instruction.
# Do not use `is-json` with a `value:` object — promptfoo treats that value
# as a JSON Schema (validated by AJV with strictSchema:true), which throws
# on unknown keyword "tool".

description: NLI intent resolution — deterministic tool selection

providers:
  - id: anthropic:claude-haiku-4-5-20251001

prompts:
  - |
    You are a CRM assistant. You have access to these tools:
    requestMutationConfirmation,
    searchContacts, getContact, createContact, updateContact, deleteContact,
    searchAccounts, getAccount, createAccount, updateAccount, deleteAccount,
    searchLeads, getLead, createLead, updateLead, deleteLead, convertLead,
    searchDeals, getDeal, createDeal, updateDeal, deleteDeal,
    searchActivities, getActivity, createActivity, updateActivity, deleteActivity,
    searchNotes, getNote, createNote, updateNote, deleteNote,
    listTags, attachTag, detachTag, renameTag,
    generateReport, saveReport, exportEntities, getWinLossPatterns,
    getContactChampionBlockerStatus, getAccountChurnExpansionSignal,
    getAtRiskAndExpansionAccounts, getObjectionPrecedents.

    Rule: before calling ANY create, update, or delete tool (except createNote)
    you MUST first call requestMutationConfirmation to present a summary of the
    proposed change to the user and wait for approval. Notes are lightweight
    annotations and may be created directly without confirmation. saveReport
    persists data, so it also requires requestMutationConfirmation first —
    never call saveReport directly.

    Rule: generateReport builds one of exactly four report types on demand —
    win_loss (won vs lost deals by date range), activity_volume, stage_trend,
    or leads_summary. getWinLossPatterns instead returns the cached results of
    a nightly AI analysis of what correlates with winning or losing deals
    (plain-language pattern observations, not a won/lost report) — use it only
    for pattern/correlation questions like "what patterns predict a win?", not
    for "build me a win/loss report".

    Rule: getAccountChurnExpansionSignal returns the churn/expansion signal
    for one specific named account. getAtRiskAndExpansionAccounts returns
    every at-risk or expansion account across the whole org. Use searchAccounts
    only for lookups unrelated to churn/expansion risk.

    Rule: getObjectionPrecedents takes a category input (one of Price, Timing,
    Competitor, ProductFit, Authority, Risk, Other) inferred from the request,
    e.g. "price objections" implies category "Price".

    Given the user request below, identify the single most appropriate tool
    to call FIRST. Respond ONLY with a JSON object in this exact format, with no
    prose, explanation, or markdown formatting:
    {"tool": "<tool_name>", "input": {<tool input, if any>}}

    User request: {{query}}

tests:
  - description: Show contacts named Alice maps to searchContacts
    vars:
      query: Show me all contacts named Alice
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'searchContacts';

  - description: Create a note on the Acme account maps to createNote or a preceding account lookup
    vars:
      query: Create a note on the Acme account
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          // createNote requires entity_id (a UUID) per its real tool schema, not a
          // name — "Acme" must be resolved to an account ID first. Both directly
          // calling createNote (if the model already knows/assumes an ID) and
          // calling searchAccounts first to resolve the name are correct.
          return parsed.tool === 'createNote' || parsed.tool === 'searchAccounts';

  - description: List open deals in Enterprise pipeline maps to searchDeals
    vars:
      query: List all open deals in the Enterprise pipeline
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'searchDeals';

  # ── MINCRM-425 / MINCRM-426: mutation confirmation first-tool assertions ───

  - description: Create contact intent calls requestMutationConfirmation first (MINCRM-425)
    vars:
      query: Add a new contact named Bob Smith at bob@example.com
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'requestMutationConfirmation';

  - description: Update record intent calls requestMutationConfirmation first (MINCRM-425)
    vars:
      query: Change the email on contact Alice Chen to alice@newdomain.com
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'requestMutationConfirmation';

  - description: Delete record intent calls requestMutationConfirmation first (MINCRM-426)
    vars:
      query: Delete the contact Bob Smith
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'requestMutationConfirmation';

  - description: Bulk delete intent first calls search to determine scope or requestMutationConfirmation (MINCRM-426)
    vars:
      query: Delete all contacts tagged as "test data"
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          // Bulk delete may search first to enumerate scope, then confirm;
          // or may call requestMutationConfirmation directly if scope is assumed known.
          return parsed.tool === 'searchContacts' || parsed.tool === 'requestMutationConfirmation';

  # ── MINCRM-427 / MINCRM-428: user AI context entries ───────────────────────

  - description: Read-only query does not call requestMutationConfirmation (MINCRM-427)
    vars:
      query: Show me all contacts I haven't contacted in a while
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          // A read-only lookup should call a search tool, not requestMutationConfirmation
          return parsed.tool === 'searchContacts' || parsed.tool === 'searchActivities';

  - description: Query with ambiguous term resolves to search tool first (MINCRM-427)
    vars:
      query: Find high-value deals that are about to close
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'searchDeals';

  # ── MINCRM-432: cross-entity note search ────────────────────────────────────

  - description: Keyword-only note search maps to searchNotes (MINCRM-432)
    vars:
      query: Show me all notes mentioning budget freeze
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'searchNotes';

  - description: Author-scoped cross-entity note search maps to searchNotes (MINCRM-432)
    vars:
      query: Find all notes I created this week
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'searchNotes';

  # ── MINCRM-433: tag rename ───────────────────────────────────────────────────

  - description: Tag rename intent calls requestMutationConfirmation first (MINCRM-433)
    vars:
      query: "Rename the tag 'cold' to 'dormant'"
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          // renameTag mutates shared data; confirmation is required first
          return parsed.tool === 'requestMutationConfirmation';

  # ── MINCRM-424: report save ──────────────────────────────────────────────────

  - description: Generate report intent maps to generateReport (MINCRM-424)
    vars:
      query: Build me a win/loss report for the last 30 days
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'generateReport';

  - description: Save report intent calls requestMutationConfirmation first (MINCRM-424)
    vars:
      query: Save this report as Q2 Pipeline Trend
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          // saveReport persists data; confirmation is required before writing
          return parsed.tool === 'requestMutationConfirmation';

  - description: Leads summary report intent maps to generateReport (MINCRM-424)
    vars:
      query: Give me a summary report of leads by status
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'generateReport';

  # ── MINCRM-464: win/loss pattern insights ────────────────────────────────────

  - description: Win/loss pattern question maps to getWinLossPatterns (MINCRM-464)
    vars:
      query: What patterns correlate with winning deals versus losing them?
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'getWinLossPatterns';

  # ── MINCRM-466: champion/blocker status ──────────────────────────────────────

  - description: Champion/blocker question maps to getContactChampionBlockerStatus (MINCRM-466)
    vars:
      query: Is Jane Doe a champion or a blocker on this deal?
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'getContactChampionBlockerStatus';

  # ── MINCRM-469: churn/expansion signals ──────────────────────────────────────

  - description: Single-account churn risk question maps to getAccountChurnExpansionSignal (MINCRM-469)
    vars:
      query: Is Acme Corp at risk of churning?
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'getAccountChurnExpansionSignal';

  - description: Org-wide at-risk accounts question maps to getAtRiskAndExpansionAccounts (MINCRM-469)
    vars:
      query: Which accounts are at risk of churning right now?
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'getAtRiskAndExpansionAccounts';

  # ── MINCRM-471: objection pattern matching ───────────────────────────────────

  - description: Objection precedent question maps to getObjectionPrecedents (MINCRM-471)
    vars:
      query: How have we handled price objections in the past?
    assert:
      - type: javascript
        value: |
          const text = output.replace(/^```[a-z]*\n?/m, '').replace(/\n?```$/m, '').trim();
          const parsed = JSON.parse(text);
          return parsed.tool === 'getObjectionPrecedents' && parsed.input?.category === 'Price';
