syntax = "proto3";
package minicrm.audit.v1;
option java_package = "com.minicrm.audit.v1";

message AuditRequest {
  string record_type = 1;  // empty = all types
  string record_id   = 2;  // empty = all records
  string after       = 3;  // ISO 8601 lower bound
  string before      = 4;  // ISO 8601 upper bound
  int32  page        = 5;  // 1-based, unary RPC only
  int32  limit       = 6;  // default 25, unary RPC only
}

message AuditEvent {
  string id          = 1;
  string record_type = 2;
  string record_id   = 3;
  string action      = 4;
  string field_name  = 5;
  string old_value   = 6;
  string new_value   = 7;
  string changed_by  = 8;
  string changed_at  = 9;  // ISO 8601
}

message AuditResponse {
  repeated AuditEvent events = 1;
  int32               total  = 2;
  int32               page   = 3;
  int32               limit  = 4;
}

service AuditService {
  // Paginated historical query. Validates .proto loading and unary request/response.
  rpc ListAuditEvents(AuditRequest) returns (AuditResponse);

  // Live event stream. Validates server-streaming and GrpcClient stream iteration.
  // Streams new AuditEvent messages as they are written. Never terminates unless
  // the client cancels or the server shuts down.
  rpc StreamAuditEvents(AuditRequest) returns (stream AuditEvent);
}
