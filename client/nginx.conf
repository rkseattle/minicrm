server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache-control: hashed assets (JS/CSS with content hash in filename) can be
    # cached indefinitely; index.html must always revalidate so deploys take effect.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve static assets directly; fall back to index.html for SPA routing.
    # Without try_files, navigating directly to /contacts or refreshing a
    # non-root route returns a 404 from nginx instead of loading the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend server.
    # Uses the Docker Compose internal hostname; this config is only used in the
    # Docker Compose context.
    # client_max_body_size matches the 25 MB multer limit in attachmentService.ts.
    # Without this, nginx rejects large uploads with 413 before Express sees them.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;
    }
}
